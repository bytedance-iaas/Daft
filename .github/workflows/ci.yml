# Curator v2 CI: v1 unit tests, parity tools, the A-class guard and the image.
name: curator-ci

on:
  push:
    branches: [feat/curator-v2]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Every suite runs even when an earlier one fails, so one red suite cannot hide another.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # parity tests extract v1 at the freeze commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"    # same as the image
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        id: install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: v1 unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        # test_environment checks a GPU host (torch, nvidia-smi); not available here
        run: python -m pytest -q -rfE curation/tests --ignore=curation/tests/test_environment.py
      - name: Contracts (C1-C5 tests and the drift lock)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: |
          python -m pytest -q -rfE tests/contracts
          python -m curation.contracts check
      - name: v2 command line (W3)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: python -m pytest -q -rfE tests/cli
      - name: Planner and VLM request merge framework (W6)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: python -m pytest -q -rfE tests/planner
      - name: Daemon skeleton (W4)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: python -m pytest -q -rfE tests/daemon
      - name: Secrets and resources (W8)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: python -m pytest -q -rfE tests/secrets
      - name: Incremental re-export (W7)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        # the official lerobot loader cases skip here; the lerobot-loader job runs them
        run: python -m pytest -q -rfE tests/export
      - name: Parity tools (unit + end-to-end on the synthetic dataset)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: tools
        run: python -m pytest -q -rfE tools/parity/tests

  lerobot-loader:
    # The official LeRobot loaders read the incremental re-exports without warnings (F2.5).
    # lerobot 0.3.x reads only v2.1 and 0.4+ only v3.0, so one job per format, in their own
    # environments, never in the image.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - reads: v2.1
            pip: >-
              lerobot==0.3.3 torch==2.6.0 torchvision==0.21.0 torchcodec==0.2.1
              huggingface_hub[cli,hf-transfer]==0.34.4 datasets==3.6.0 numpy==2.2.6
              pandas==2.3.3 pyarrow==21.0.0 av==15.1.0 opencv-python-headless==4.12.0.88
          - reads: v3.0
            pip: lerobot[dataset]==0.6.1 opencv-python-headless==4.12.0.88
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lerobot (CPU torch) in this job only
        run: >
          pip install --extra-index-url https://download.pytorch.org/whl/cpu
          ${{ matrix.pip }} pytest jsonschema referencing pyyaml pytest-github-actions-annotate-failures
      - name: Official loader on incremental re-exports (${{ matrix.reads }})
        working-directory: backend
        env:
          HF_HUB_OFFLINE: "1"
          CURATOR_EXPECT_LOADER_READS: ${{ matrix.reads }}
        run: |
          python -c "import lerobot"
          python -m pytest -q -rfE -rs tests/export/test_lerobot_loader.py tests/export/test_lerobot_loader_expected.py

  frontend:
    # the React console (W10): lint, types generated from the frozen C4, tests on the
    # contract-checked mock, production build; runs on both supported Node lines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  a-class-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Algorithm files unchanged unless declared with parity-change
        env:
          PYTHONPATH: tools
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m parity a-class-check --pr-body-env PR_BODY

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (public mirrors; the Volcano-internal ones are not reachable here)
        run: >
          docker build -f deploy/Dockerfile -t curator:ci
          --build-arg NO_MIRROR=1
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          --build-arg APT_MIRROR=http://deb.debian.org .
      - name: CLI runs in the image
        run: docker run --rm curator:ci --help
