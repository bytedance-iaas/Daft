# Curator v2 CI: v1 unit tests, parity tools, the A-class guard and the image.
name: curator-ci

on:
  push:
    branches: [feat/curator-v2]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch supersedes a run still in flight
concurrency:
  group: curator-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Every suite runs even when an earlier one fails, so one red suite cannot hide another.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # parity tests extract v1 at the freeze commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"    # same as the image
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        id: install
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: v1 unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        # test_environment checks a GPU host (torch, nvidia-smi); not available here
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE curation/tests --ignore=curation/tests/test_environment.py
      - name: Contracts (C1-C5 tests and the drift lock)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: |
          python -m pytest -q -rfE tests/contracts
          python -m curation.contracts check
      - name: v2 command line (W3)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/cli
      - name: Planner and VLM request merge framework (W6)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/planner
      - name: Daemon skeleton (W4)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/daemon
      - name: Secrets and resources (W8)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/secrets
      - name: Result readers (W5b)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/results
      - name: Orchestration (W5a; the slow tests run the real CLI end to end)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/orchestr
      - name: Opt-in execution optimizations (streaming funnel, checkpoints, frame cache)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/optimizations
      - name: Image and deployment-contract checks (W11)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/deploy
      - name: EEF-video consistency module (F5; DEMO-data cases skip without the local datasets)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE -rs tests/eef
      - name: Data visualizer (F13; readers, presentation model, curves, transcoding)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: backend
        run: bash ../.github/scripts/pytest-summary.sh -q -rfE tests/viz
      - name: Parity tools (unit + end-to-end on the synthetic dataset)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: tools
        run: bash .github/scripts/pytest-summary.sh -q -rfE tools/parity/tests
      - name: Regression sample tools (scorer, and the finding map against the platform's codes)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: tools
        run: bash .github/scripts/pytest-summary.sh -q -rfE tools/regression_samples/tests

  frontend:
    # the React console (W10): lint, types generated from the frozen C4, tests on the
    # contract-checked mock, production build; runs on both supported Node lines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  a-class-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Algorithm files unchanged unless declared with parity-change
        env:
          PYTHONPATH: tools
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m parity a-class-check --pr-body-env PR_BODY

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (public mirrors; the Volcano-internal ones are not reachable here)
        run: >
          docker build -f deploy/Dockerfile -t curator:ci
          --build-arg NO_MIRROR=1
          --build-arg PIP_INDEX_URL=https://pypi.org/simple
          --build-arg SUPPLEMENT_PYPI_URL=
          --build-arg APT_MIRROR=http://deb.debian.org .
      - name: The Daemon and the CLI start in the image
        run: |
          docker run --rm curator:ci --help
          docker run --rm curator:ci curation --help
          docker run --rm --entrypoint curator-daemon curator:ci --help
