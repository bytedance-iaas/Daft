<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- curator:base -->
    <script>
      // Mount prefix bootstrap (doc 07 §2.3). The Daemon replaces the marker above with a static
      // base element (href "/curation/") and a script element that sets
      // window.__CURATOR_BASE__ = "/curation" (see frontend/README.md). Assets are relative, so the
      // base element keeps deep links (for example /curation/tasks/1/report) loading ./assets/*
      // from the prefix; being static, it also steers the browser's preload scanner. Without
      // injection (a plain static server) the prefix is inferred and the base element added here.
      (function () {
        var known = ['overview', 'datasets', 'tasks', 'credentials'];
        var base = window.__CURATOR_BASE__;
        if (typeof base !== 'string') {
          // Not injected (e.g. a plain static server): infer from the path, never assume the root.
          var parts = window.location.pathname.split('/');
          var cut = parts.length;
          for (var i = 1; i < parts.length; i++) {
            if (known.indexOf(parts[i]) >= 0) { cut = i; break; }
          }
          base = parts.slice(0, cut).join('/');
          if (/\.html?$/.test(base)) base = base.replace(/\/[^/]*$/, '');
        }
        base = String(base).replace(/\/+$/, '');
        window.__CURATOR_BASE__ = base;
        if (!document.querySelector('base[href]')) {
          var el = document.createElement('base');
          el.href = base + '/';
          document.head.appendChild(el);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>数据质检平台 · Physical AI Kit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
