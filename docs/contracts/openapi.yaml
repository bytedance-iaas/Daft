                        review_modules: [task_success]
                      - episode_index: 112
                        list: reject
                        review: false
                        reason_modules: [timestamp_check]
                        review_modules: []
                      - episode_index: 120
                        list: held
                        review: false
                        reason_modules: [task_success]
                        review_modules: []
                    next_cursor: eyJ2IjoxfQ
                    has_more: true
                    total: 14
                    counts: {all: 640, passed: 508, reject: 96, held: 36, review: 32}
                    revision: 2
