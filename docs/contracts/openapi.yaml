openapi: 3.1.0
info:
  title: Curator v2 API
  version: 2.4.0
  description: |
    C4 of the frozen contracts (design doc 03). JSON in, JSON out, UTF-8.
    Every route lives under the mount prefix `{base}` (empty by default, `/curation` in
    production; the gateway does not strip it). Write operations are asynchronous: they
    return the resource and its state, progress arrives over SSE or polling.
    Errors use one body, `Error`; `code` is stable for machines, `message` is Chinese for people.
    `precheck_failed` (422, any write that starts work) carries `error.details` shaped as
    `PrecheckDetails`: one entry per pre-start check (D30).
    Responses that point people at a page carry `links` (D22): absolute URLs when
    `server.publicBaseUrl` is configured, otherwise relative paths with `absolute: false`.
    Write endpoints accept only `application/json` - send the header on every write, even without
    a body - and cross-site writes are refused; there is no CORS.
    Ids are opaque strings. Records made since 1.10.0 get `<prefix>-<9 lowercase letters>` (task,
    sub, ds, pf, cred, vb, vm, upl; e.g. `task-kqzmrtbwe`, D45); records made before keep their
    `<prefix>_...` id, and both work everywhere. Ids carry no time: lists sort by creation time.

    1.1.0 (2026-09-21): dataset registry (D36): `/datasets` now lists registered datasets and the
    TOS / cache-bucket listing moved to `/datasets/browse`; `/overview`; starting a task re-checks
    the dataset fingerprints and answers 409 `source_changed` with a `SourceChange`, after which
    `/tasks/{id}/repreflight` re-runs preflight (D37); the task list filters by `module` and
    `dataset_id` and lists the selected modules; request inputs may name a `dataset_id`;
    `dataset_in_use`. No client consumed 1.0.0.

    1.2.0 (2026-09-21): every write request carries `Content-Type: application/json`, a body or
    not, and `Idempotency-Key` is accepted on every write; `method_not_allowed`; `Task.vlm`
    has its own schema with `snapshot`; access-key names are null in responses once the key
    was deleted; SSE `state` and `done` carry `subtask_id` and `reason`; the log order and the
    `subtask` filter are spelled out; call kinds and stage ids are open like in C2/C3 1.1.

    1.3.0 (2026-09-21): `Idempotency-Key` is declared on every write; `Decision` and
    `DatasetDetail` validate (shared fields plus `unevaluatedProperties: false` instead of an
    allOf over a closed base); `precheck_failed` details (`PrecheckDetails`), probe error codes,
    the confirmation rule for deleting keys and backends that finished tasks used, the media
    signing prefix, optional session tokens on access keys, `Subtask.pause_reason`, `rel:
    dataset` links, dataset ids and the overview's counting rules are spelled out.

    1.4.0 (2026-09-21): applying an adjudication takes an optional `AdjudicationApply` body -
    `relabel_rerun` picks how relabelled episodes are judged again, v1's two layers by default
    or the first run's full flow (D39) - and the subtask's `scope` records the choice;
    `Summary.skipped` counts episodes left out because source files are missing (D40), which
    the report lists under `integrity.skipped_episodes`.

    1.5.0 (2026-09-21): review kinds are declared by the registry (D43): `ModuleRegistry`
    carries the `review_lines` catalog (id, title, the list its episodes are in, whether an
    open item counts as pending, the decisions with their titles) and every module its
    `review_lines` and `appealable`; adjudication `line` and `decision` are open strings the
    Daemon checks against that catalog. Rejects attributed to dedup may be appealed and a
    question can name `duplicate_of`; already-rejected episodes get no task-verdict question
    (D42). Appeal candidates never count as pending.

    1.5.1 (2026-09-22): v1's optional task verdict after a relabel is back as a catalog
    `follow_ups` entry (a card gains the question once its label answer adopts a new label;
    answered, the machine takes it and does not judge again); the `status` filter, the label an
    adopted suggestion gets without `new_label`, the episode view's `reasons` / `review` items
    and the 404 reasons of the result readers are spelled out.

    1.5.2 (2026-09-22): a question a card gained as a follow-up says so (`follow_up_of`), and
    a follow-up whose opening answer changed is left out of the card.

    1.6.0 (2026-09-22): a model may be the default one (`VlmModel.is_default`, set through
    `VlmModelPatch`): the new-task form starts with it instead of asking, and there is at most
    one per owner across all backends.

    1.7.0 (2026-09-23): the module registry 1.4 (design doc 12): every module says its
    `input_scope` (funnel / all_selected) and whether it `affects_dataset_verdict`; the need
    `eef_input` and a module id as `depends_on` (eef_video_review on eef_video_consistency).
    The two EEF-video consistency modules are advisory: they never change keep / drop / held.

    1.8.0 (2026-09-23): file parameters (registry 1.5). `POST /uploads` stores an input file of a
    module parameter after validating it (errors located to sample / frame / camera / point /
    JSON path) and returns an `Upload` whose `handle` (`upload:<upload_id>`) is the parameter's
    value in `TaskCreate.modules[].params`; `GET /uploads/{upload_id}` reads it back. Creating a
    task that selects a module needing `eef_input` preflights that module against the dataset with
    the uploaded file; the task's preflight snapshot carries that entry.

    1.10.0 (2026-09-23): new ids are `<prefix>-<9 lowercase letters>` (D45): the patterns of
    dataset ids, `UploadId` and upload handles take both formats. `GET /overview?days=7|30|90|365`
    picks the period of `recent`, which says its `bucket` (day / week / month) and `since`;
    `recent.tokens_per_bucket` (`start`, `label`, `tokens`) replaces `tokens_per_day`.
    `GET /tasks?state=running` also lists finished tasks whose subtask is queued or running (D46).

    1.10.1 (2026-09-23): running tasks expose per-episode funnel progress and immediate
    machine verdicts through `/tasks/{id}/pipeline/episodes` and its single-episode reader;
    `TaskParams.batch_size` lets API clients set the maximum number of episodes handed from
    one funnel layer to the next per batch. (Written on 2026-09-22 as 1.7.0 / 1.7.1 on a branch
    that predates 1.8.0-1.10.0; renumbered when merged.)

    1.11.0 (2026-09-23): the report's Episode tab (F6.2). `GET /tasks/{id}/episodes` lists the
    episodes of a result revision - list, the modules behind it, whether a person still has to
    answer something about it - filtered by list, by open questions and by an episode number
    (`q`: `12`, `ep12`, `ep 12`), in episode order with a revision-bound cursor;
    `GET /tasks/{id}/episodes/{index}/sync-curves` serves one episode's video-action sync curves
    (picture motion and arm motion over time, the cross-correlation over the lag, the reading on
    it). Module summaries in `report.json` gain chart-ready aggregates (design doc 06 §6.2);
    their schema stays a free object. (Written as 1.9.0 on the F6.2 branch; renumbered when
    merged after 1.10.1.)

    1.12.0 (2026-09-23): mcap and lance datasets (D44, v1's PR #155). `DatasetFormat` and the
    `format` filter of `GET /datasets` take `mcap` and `lance` (lerobot-lance-convert >= 0.3.0);
    `BrowsedDataset.format_hint` takes them too. `EpisodePreview` of such a dataset has no
    cameras (their videos are inside the files / tables); an mcap episode whose task text is in
    a task topic, which the preview does not read, says so with `task_unread`. The preflight
    (C2) reports `kind` mcap / lance; exports of these datasets name their `dataset_dir`.
    (Written as 1.11.0 on the F6.5 branch; renumbered when merged after the report's 1.11.0.)

    1.13.0 (2026-09-23): the module registry's stages take `profile_vlm` (registry 1.7): the
    skill profile runs in a VLM stage of its own after dedup instead of `post_verdict`; the plan's
    stage id for it is `profile_vlm`.

    1.14.0 (2026-09-23): texts only - the review line `eef_check` (registry 1.9, D49) is named
    among `ReviewLineId` and the decisions of `DecisionInput`.

    1.15.0 (2026-09-24): `GET /tasks` takes `has_result` (tasks with a committed result: the
    console's 质检报告 list) and `pending_adjudication` (tasks with pending adjudication items:
    its 人工裁决 list); false or absent does not filter.

    1.16.0 (2026-09-24): the data integrity module (registry 1.11, design doc 14, D50-D52): the
    stage enums take `integrity`, first in the funnel (the registry's stages and module stage, the
    pipeline's `last_stage` and `stage_processing_s`; `next_stage` takes `numeric`); the review line `integrity_check`
    (decisions intact, broken, unsure) is named among `ReviewLineId` and `DecisionInput`.

    1.17.0 (2026-09-26): a TOS access key may be the default one (`Credential.is_default`, set
    through `CredentialUpdate`): the new-task form starts with it, and there is at most one per
    owner. Deleting the key leaves none.

    1.18.0 (2026-09-26): `PipelineActivity` may say when the layer was working and why it is not:
    `busy` lists the spans during which episodes were out (at most 64; the rest of the layer's run
    is waiting), `held_by_downstream` that it has episodes to hand out but holds them because the
    next layer's queue is full. Both optional: snapshots written before have neither.

    1.19.0 (2026-09-28): the upload kind `eef_record_mapping` (registry 1.13, design doc 12 §8.7): the
    EEF module's dataset-record mapping (`eef-mapping/1.1`), validated on arrival; its summary names
    the sources, the robot, the columns / topics and the declared frames.

    1.20.0 (2026-09-28): a module's preflight entry may carry `drafts` (C2 preflight schema): files a
    module drafts from the dataset's metadata for a person to confirm before use, by parameter key -
    the EEF module's `record_mapping` from a LeRobot info.json, with every assumption listed (design
    doc 12 §8.7, D-E17). Confirming uploads the draft as an `eef_record_mapping` like any other file.

    1.21.0 (2026-09-28): `POST /datasets/{id}/sign` (design doc 15, D55): the ReRun web viewer's
    reads of a registered private TOS dataset, signed by the Daemon with the key bound to the
    registration - one S3 SigV4 presigned URL per object read or ListObjectsV2 page, on TOS's
    public S3-compatible endpoint. The caller names full object keys and listing prefixes, which
    must lie under the dataset's prefix; bucket, region and key are the registration's.

    1.22.0 (2026-09-29): a module may ride on another (registry 1.14, `rides_on`): it is answered
    inside its host's model requests, runs whenever the host runs and is never selected on its
    own - the new-task form does not offer it, a task request naming it is accepted and the name
    ignored, the report shows it. First one: `camera_defects` on `task_success`.

    2.0.0 (2026-10-01): findings, policy verdicts and the two parallel blocks (design doc 17,
    D56-D59). The module registry is 2.0: a module has a `block` (cpu / vlm) and a `stage` of that
    block (`integrity`, `numeric`, `frame`, `dedup`; `autolabel`, `vlm`, `profile` - `dedup` and
    `profile` are the full-set stages), a catalogue of finding `codes` (each mapped to an item of
    the taxonomy C6, with a default severity, a default level blocking / review / info, the review
    line a review-level code raises and whether a blocking one may be appealed) and the items it
    `covers`; `gate`, `input_scope`, `affects_dataset_verdict`, `produces_adjudication`,
    `review_lines` and the module-level `appealable` are gone (the last three follow from the codes).
    The registry carries the bound taxonomy (`taxonomy_version`, `taxonomy`), the `blocks`, the
    `finding_levels` and the `unassessable_reasons`. `TaskParams.policy` names the verdict policy
    (`default`: today's gates; `report_only`: report every finding, reject nothing; the funnel
    keeps judging by `default` until the policy aggregate replaces it, F12.3). Optional, for the
    two-block pipeline (F12.4): `StageProgress.block` / `full_set`, `PipelineEpisode.stages` /
    `provisional`; for the findings (F12.3): `TaskEpisode.items` / `levels`. The report, the
    plan and the result records follow C2 2.0, which keeps reading the 1.0 documents of tasks
    made before (D59).

    2.1.0 (2026-10-01): the policy verdicts (F12.3). An `EpisodeNote` of the episode view's
    `reasons` may carry what a C2 2.0 reason carries: the finding `code`, its taxonomy `item` and
    whether it may be `appealable`; its `kind` is then `finding`, `human`, `execution_error` or
    `duplicate`.

    2.2.0 (2026-10-01): the two blocks (F12.4, design doc 17 §3). A `PipelineEpisode` of a two-block
    run has `stages` (every per-episode stage of both blocks: waiting / running / done / error) and a
    `provisional` verdict; `last_stage` / `next_stage` are a funnel run's position and only appear on
    tasks made before. `StageProgress` of a two-block run names its `block` and, for dedup and the
    skill profile, `full_set`.

    2.3.0 (2026-10-02): the console's findings views (F12.5, design doc 17 §5). On a findings
    revision every `TaskEpisode` carries the `items` and `levels` of its findings (its list
    entry's, C2 final-list 2.0: the policy's levels after the applied human decisions) and
    `listTaskEpisodes` filters by `level` and `item`; `EpisodeView.findings` lists every finding of
    the episode with its level (`EpisodeFinding`); an `AdjudicationQuestion` names the finding
    `codes` it asks about and their `items`; the live episode page of a two-block run counts per
    module the episodes judged, failed on and with a finding (`modules`). The report (C2) adds
    the rejects per item (`overview.reject_items`) and per module the episodes with a finding,
    in all and per level (`summary.flagged_episodes`, `summary.levels`).

    2.4.0 (2026-10-04): the data visualizer (design doc 18, D60-D64). Two sets of readers share one
    presentation model (`VizDataset`, `VizEpisode`, `VizSeries`): the dataset scope for the
    visualize page (`/datasets/{id}/viz`, `/viz/episodes`, `/viz/meta`,
    `/datasets/{id}/episodes/{index}/viz|series`, the cameras the Daemon serves:
    `.../cameras/{camera}.mp4|.frames|.json`) and the task scope for the mini player of the report,
    the adjudication cards and the live episodes (`/tasks/{id}/viz`,
    `/tasks/{id}/episodes/{index}/viz|series|cameras/...`, read from the task's frozen input; the
    `.mp4` route existed undeclared for mcap cameras). mcap datasets get a field mapping (C7
    `viz-mapping.schema.json`): `POST /viz/mcap-probe` drafts it, `GET`/`PUT /datasets/{id}/mapping`
    keep it per dataset (versioned, frozen into a task's run.json when it starts), `/viz/templates`
    is the site's template library. External annotation files are a new upload kind
    `viz_annotations` (JSON, or a zip of per-episode JSON sent as `application/zip`), attached with
    `PUT /datasets/{id}/annotations` or at registration (`DatasetCreate.annotations_upload`, with
    `viz_mapping`). `DatasetItem.viz` says whether a dataset can be visualized and
    `GET /datasets?viz=true` lists only those; `DatasetDetail` names its `viz_mapping` and
    `annotations`; `EpisodeView` gains `fps` and `dataset_id`.
servers:
  - url: "{base}/api/v1"
    variables:
      base:
        default: ""
        description: mount prefix, e.g. /curation
security:
  - basicAuth: []
tags:
  - name: credentials
    description: TOS access keys (VLM API keys are stored with their backend)
  - name: vlm
    description: VLM backends and models
  - name: datasets
    description: modules, dataset registry and browsing, episodes, preflight, delivery probe
  - name: overview
    description: the overview page
  - name: tasks
    description: tasks and subtasks
  - name: report
    description: >-
      report, detail tables, episodes, performance, adjudication. They read a committed result
      revision; when its files are not on the Daemon's disk and cannot be fetched back from the
      delivery directory, the answer is 404 not_found with details.reason run_dir_missing or
      revision_missing.
  - name: system
    description: media signing, events, probes
  - name: uploads
    description: input files of module parameters (registry 1.5, format upload), validated on arrival
  - name: viz
    description: >-
      the data visualizer (design doc 18): the presentation model of a registered dataset or of a
      task's input, curves, the cameras the Daemon serves, mcap field mappings and templates

paths:
  # ---------------------------------------------------------------- credentials
  /credentials:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: List TOS access keys (never returns secrets)
      responses:
        "200":
          description: all access keys of the owner
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Credential"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [credentials]
      operationId: createCredential
      summary: Save an access key; verifies identity only (D30, doc 08 §4)
      description: |
        Saving never fails because verification failed: the key is stored and marked
        `failed` or `unverified`. Read and write permissions are checked against concrete
        buckets when a task starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [credentials]
      operationId: updateCredential
      summary: Update; a secret left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Delete (409 credential_in_use while a non-terminal task uses it)
      description: |
        Referenced only by finished tasks: requires `confirm=true`. Those tasks keep their
        reports, which then say the key is gone; rebind-credentials gives them another one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [credentials]
      operationId: verifyCredential
      summary: Verify identity again
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: verification result (also stored on the key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- vlm backends
  /vlm-backends:
    get:
      tags: [vlm]
      operationId: listVlmBackends
      summary: List backends with their models
      responses:
        "200":
          description: backends
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/VlmBackend"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [vlm]
      operationId: createVlmBackend
      summary: Add a backend with its API key; then try GET {endpoint}/models once (D8)
      description: Not listing any models is not an error; the user adds model IDs by hand.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [vlm]
      operationId: updateVlmBackend
      summary: Update; an API key left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [vlm]
      operationId: deleteVlmBackend
      summary: Delete with its models and key (409 backend_in_use while a non-terminal task uses it)
      description: |
        An unfinished task using it answers 409 in_use. When only finished (or deleted) tasks
        use it, the 409 carries `error.details.confirm_required: true`; repeating the call
        with `confirm=true` deletes it and those tasks lose the reference.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: verifyVlmBackend
      summary: Probe the endpoint (GET /models, else a minimal chat call)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/refresh-models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: refreshVlmModels
      summary: List models again; an empty result means "enter them by hand"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: listing result
          content:
            application/json:
              schema:
                type: object
                required: [listed, models]
                properties:
                  listed: {type: boolean, description: "false when GET /models is not available"}
                  models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
                  note: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: addVlmModel
      summary: Add a model ID or inference endpoint ID (ep-...), checked with one minimal call
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmModelCreate"}
      responses:
        "201":
          description: added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmModel"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: model_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [vlm]
      operationId: updateVlmModel
      summary: Set reasoning effort and parallelism
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmModelPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmModel"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [vlm]
      operationId: deleteVlmModel
      summary: Remove a model (409 backend_in_use while a non-terminal task uses it)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: removed}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- datasets
  /modules:
    get:
      tags: [datasets]
      operationId: getModules
      summary: The module registry (C1); the frontend's module list comes only from here
      responses:
        "200":
          description: registry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModuleRegistry"}
        default: {$ref: "#/components/responses/Error"}
  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: The overview page in one call - what needs attention, what runs, the chosen period (D36)
      parameters:
        - name: days
          in: query
          description: >-
            the period of `recent`: 7 or 30 days (by day), 90 = the 13 calendar weeks up to this one
            (by week), 365 = the 12 calendar months up to this one (by month); anything else is 400
          schema: {enum: [7, 30, 90, 365], default: 7}
      responses:
        "200":
          description: overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        default: {$ref: "#/components/responses/Error"}
  /datasets:
    get:
      tags: [datasets]
      operationId: listDatasets
      summary: Registered datasets, page-number pagination, newest first (D36)
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {enum: [10, 20, 50, 100], default: 20}
        - name: q
          in: query
          description: search by name or address
          schema: {type: string}
        - name: format
          in: query
          schema: {$ref: "#/components/schemas/DatasetFormat"}
        - name: check_state
          in: query
          schema: {enum: [ok, changed]}
        - name: viz
          in: query
          description: true = only datasets a visualizer reader serves (LeRobot, mcap), for the visualize page's picker
          schema: {type: boolean}
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DatasetItem"}}
                  page: {type: integer, minimum: 1}
                  page_size: {type: integer}
                  total: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [datasets]
      operationId: createDataset
      summary: Register a dataset - preflight plus the full file listing, both fingerprints kept (D36)
      description: |
        Registering the same source + address + region again returns the existing registration
        with 200 instead of creating a second one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetCreate"}
      responses:
        "201":
          description: registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        "200":
          description: already registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/browse:
    get:
      tags: [datasets]
      operationId: browseDatasets
      summary: List datasets under a private TOS prefix or in the HuggingFace cache bucket, to pick one to register
      parameters:
        - $ref: "#/components/parameters/Source"
        - name: uri
          in: query
          description: tos:// prefix to list (source=tos)
          schema: {type: string}
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CredentialName"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: datasets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/BrowsedDataset"}}
        default: {$ref: "#/components/responses/Error"}
  /datasets/episodes:
    get:
      tags: [datasets]
      operationId: listDatasetEpisodes
      summary: Episodes for the preview grid; metadata only, no decoding on the server (doc 03 §10)
      description: Give `dataset_id`, or `source` + `uri` (+ `region`, `credential`).
      parameters:
        - name: dataset_id
          in: query
          schema: {type: string}
        - name: source
          in: query
          schema: {enum: [tos, public, local]}
        - name: uri
          in: query
          schema: {type: string}
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CredentialName"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: episodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/EpisodePreview"}}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [datasets]
      operationId: getDataset
      summary: One registration with its preflight result, recent fingerprint checks and tasks
      responses:
        "200":
          description: dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [datasets]
      operationId: updateDataset
      summary: Rename, or change the note
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [datasets]
      operationId: deleteDataset
      summary: Remove the registration; the data on TOS is untouched. In use by an unfinished task -> 409 dataset_in_use
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: removed}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/recheck:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [datasets]
      operationId: recheckDataset
      summary: Recompute both fingerprints and compare, nothing else changes; a difference sets check_state=changed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: the check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetCheck"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/repreflight:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [datasets]
      operationId: repreflightDataset
      summary: Run preflight again and keep the new result and fingerprints; check_state returns to ok
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: refreshed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/sign:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [datasets]
      operationId: signDataset
      summary: Presigned S3 URLs for the ReRun viewer to read a registered TOS dataset (D55)
      description: |
        Design doc 15 §2. For `source: tos` registrations only (public and local ones answer
        400). Each request is one read: `get` an object by its full key in the bucket, or `list`
        one ListObjectsV2 page (`list-type=2`, `prefix`, optional `delimiter`,
        `continuation-token`, `max-keys`). Keys and prefixes must start with the dataset's
        prefix and a `/`; they are checked, never rewritten, and one bad item fails the whole
        request with `details.errors[].field` = `requests.<i>.key|prefix`. The URLs are for
        TOS's public S3-compatible endpoint `https://<bucket>.tos-s3-<region>.volces.com`, sign
        only the `host` header (a `Range` header does not change them) and are answered with
        `Cache-Control: no-store`. A key the registration no longer has: 404 with
        `details.reason: credential_missing`; a key that cannot be decrypted: 500 with
        `details.reason: secret_unreadable`; a key with a custom endpoint: 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetSignRequest"}
      responses:
        "200":
          description: one URL per request, in the same order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetSignResponse"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/viz:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [viz]
      operationId: getDatasetViz
      summary: The presentation model of a registered dataset for the visualizer (design doc 18 §4.0)
      description: |
        Cameras and how each one is served, curve groups, annotation sources and the field tree,
        read by the format's reader from the registration's metadata (LeRobot `meta/`, an mcap
        file's summary and the dataset's confirmed mapping) - never from the samples - and cached
        by the metadata fingerprint. A format without a reader in this phase (lance) answers with
        `format.reader` null; an mcap dataset whose mapping is not confirmed answers
        `mapping.state: none` with no cameras or streams and a warning.
      responses:
        "200":
          description: the dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizDataset"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/viz/episodes:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [viz]
      operationId: listDatasetVizEpisodes
      summary: The episodes of the visualizer's side rail - number, length, task text, and steps when the episode table has them
      parameters:
        - name: q
          in: query
          description: an episode number (`12`, `ep12`) or words of the task text
          schema: {type: string, maxLength: 200}
        - name: sort
          in: query
          description: "`steps`: episodes without known steps first"
          schema: {enum: [index, duration, steps], default: index}
        - name: order
          in: query
          schema: {enum: [asc, desc], default: asc}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizEpisodePage"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/viz/meta:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [viz]
      operationId: getDatasetVizMeta
      summary: A metadata file the field tree names (meta/*, README), for its preview; cut at 256 KiB
      parameters:
        - name: path
          in: query
          required: true
          description: relative to the dataset, e.g. `meta/info.json`
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        "200":
          description: the file
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizMetaFile"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/episodes/{index}/viz:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
    get:
      tags: [viz]
      operationId: getDatasetEpisodeViz
      summary: One episode for the player - its clock, cameras with their URLs, task text and annotations
      description: |
        Presigned URLs expire (`cameras[].expires_at`); ask again to renew them. Opening an episode
        starts preparing the cameras the Daemon serves (remux, frame packs, transcoding) in the
        background.
      responses:
        "200":
          description: the episode
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizEpisode"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/episodes/{index}/series:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
    get:
      tags: [viz]
      operationId: getDatasetEpisodeSeries
      summary: One curve group of an episode, min / max thinned to at most `points` (design doc 18 §4.3)
      parameters:
        - $ref: "#/components/parameters/VizStream"
        - $ref: "#/components/parameters/VizFrom"
        - $ref: "#/components/parameters/VizTo"
        - $ref: "#/components/parameters/VizPoints"
      responses:
        "200":
          description: the curves
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizSeries"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/episodes/{index}/cameras/{camera}.mp4:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getDatasetCameraVideo
      summary: A camera served by the Daemon - a local dataset's file, a fragmented-mp4 remux or an H.264 transcode - with Range
      parameters:
        - $ref: "#/components/parameters/VizTranscode"
        - $ref: "#/components/parameters/RangeHeader"
      responses:
        "200":
          $ref: "#/components/responses/VizVideo"
        "206":
          $ref: "#/components/responses/VizVideoRange"
        "202":
          $ref: "#/components/responses/VizPending"
        "416":
          description: the range is outside the file
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/episodes/{index}/cameras/{camera}.frames:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getDatasetCameraFrames
      summary: The JPEG frame pack of a camera - the frames' own bytes back to back, read by Range with the index
      parameters:
        - $ref: "#/components/parameters/RangeHeader"
      responses:
        "200":
          $ref: "#/components/responses/VizFrames"
        "206":
          $ref: "#/components/responses/VizFramesRange"
        "202":
          $ref: "#/components/responses/VizPending"
        "416":
          description: the range is outside the pack
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/episodes/{index}/cameras/{camera}.json:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getDatasetCameraFrameIndex
      summary: The index of a camera's JPEG frame pack - time, offset and size of every frame
      responses:
        "200":
          description: the index
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizFrameIndex"}
        "202":
          $ref: "#/components/responses/VizPending"
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/mapping:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [viz]
      operationId: getDatasetMapping
      summary: The dataset's mcap field mapping (C7) and the check reader's mapping derived from it
      responses:
        "200":
          description: the mapping
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetMapping"}
        default: {$ref: "#/components/responses/Error"}
    put:
      tags: [viz]
      operationId: putDatasetMapping
      summary: Confirm a new version of the mapping (validated against C7 and the dataset's topics)
      description: |
        Only for mcap datasets. Tasks started before keep the version frozen into their run.json
        (D62); tasks started after read this one. A mapping that names topics the dataset does not
        have, pairs series that are not of opposite roles or names a frame reference that is not
        a camera or series fails with `validation_failed` and `details.errors` per item.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetMappingPut"}
      responses:
        "200":
          description: confirmed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetMapping"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/annotations:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [viz]
      operationId: putDatasetAnnotations
      summary: Attach an external annotation file (a `viz_annotations` upload) to the dataset, replace it or remove it (null)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetAnnotationsPut"}
      responses:
        "200":
          description: the dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
  /preflight:
    post:
      tags: [datasets]
      operationId: preflight
      summary: Preflight a dataset (metadata only, seconds); the result is kept 30 minutes
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreflightRequest"}
      responses:
        "200":
          description: preflight result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreflightResponse"}
        default: {$ref: "#/components/responses/Error"}
  /deliveries/probe:
    post:
      tags: [datasets]
      operationId: probeDelivery
      summary: Write and delete one object under the delivery directory with the given key
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeliveryProbeRequest"}
      responses:
        "200":
          description: probe result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbeResult"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- uploads
  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Store the input file of a module parameter after validating it (registry 1.5)
      description: >-
        The body is the file itself, sent as JSON like every write: a trajectory.json as it is
        (kind eef_trajectory), or the seed rows as a JSON array (kind eef_observation_seeds; the
        console turns a .jsonl file into that array). Kind viz_annotations also takes a zip of
        per-episode JSON files named by episode index, sent as application/zip (still not a
        CORS-safelisted type, so cross-site writes stay refused). Up to 64 MiB. An invalid file is not stored:
        400 validation_failed with details.errors, each located as precisely as the file allows
        (field = JSON path, plus sample_id / episode_index / frame_index / camera_id / point_id).
        The dataset is not known yet, so media are checked when a task uses the file.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: kind
          in: query
          required: true
          schema: {$ref: "#/components/schemas/UploadKind"}
        - name: name
          in: query
          required: true
          description: the file name as picked (kept for display)
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: "the file content (see above)"}
          application/zip:
            schema: {type: string, format: binary, description: "viz_annotations only"}
      responses:
        "201":
          description: stored and validated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}
  /uploads/{upload_id}:
    get:
      tags: [uploads]
      operationId: getUpload
      summary: An upload's metadata and validation summary (the caller's own uploads only)
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/UploadId"}
      responses:
        "200":
          description: the upload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}

  /viz/mcap-probe:
    post:
      tags: [viz]
      operationId: probeMcap
      summary: Probe an mcap dataset and draft its mapping (design doc 18 §6.4) - before registering it or after
      description: |
        Reads the summary section of one episode file (the first, or `file`) and the first message
        of every topic with ranged reads: schema and encodings, rate, count, picture size and
        codec, numeric fields. The draft comes from `template` when given, else from the best
        matching template (site templates and the built-ins, coverage >= 80 %), else from
        builtin:foxglove / builtin:ros2 by the message encoding. A dataset whose files disagree on
        their topics gets a warning.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/McapProbeRequest"}
      responses:
        "200":
          description: the probe and the draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/McapProbe"}
        default: {$ref: "#/components/responses/Error"}
  /viz/templates:
    get:
      tags: [viz]
      operationId: listVizTemplates
      summary: Mapping templates - the built-ins first, then the site's own, newest first
      responses:
        "200":
          description: templates
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/VizTemplate"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [viz]
      operationId: createVizTemplate
      summary: Save a mapping as a site template (另存为模版); the name must be unique (409 name_taken)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VizTemplateCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizTemplate"}
        default: {$ref: "#/components/responses/Error"}
  /viz/templates/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/VizTemplateId"}
    delete:
      tags: [viz]
      operationId: deleteVizTemplate
      summary: Delete a site template (built-ins cannot be deleted); datasets keep the mappings drafted from it
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tasks
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Task list, page-number pagination (D21), newest first
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {enum: [10, 20, 50, 100], default: 20}
        - name: state
          in: query
          description: >-
            a task state, or `deleted` for soft-deleted tasks (restorable for 30 days). `running` also
            lists finished tasks whose subtask (retry, resume, adjudication run, re-export) is queued or
            running: the console shows them as running (D46); their `state` stays terminal and
            `active_subtask` names the subtask
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskState"
              - const: deleted
        - name: q
          in: query
          description: search by name or id
          schema: {type: string}
        - name: delivery
          in: query
          description: tasks writing to this delivery directory
          schema: {type: string}
        - name: module
          in: query
          description: comma-separated module ids; only tasks that selected every one of them (an unknown id is 400 validation_failed)
          schema: {type: string}
        - name: dataset_id
          in: query
          description: tasks on this registered dataset
          schema: {type: string}
        - name: has_result
          in: query
          description: true keeps only tasks with a committed result (result_rev >= 1, a report to read); false or absent does not filter (1.15)
          schema: {type: boolean, default: false}
        - name: pending_adjudication
          in: query
          description: >-
            true keeps only tasks with pending adjudication items (TaskListItem.pending_adjudication
            > 0); false or absent does not filter (1.15)
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TaskListItem"}}
                  page: {type: integer, minimum: 1}
                  page_size: {type: integer}
                  total: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task - the requirement's run_modules() (D5)
      description: |
        The only way to submit work. The Daemon always plans internally; callers may only give
        upper bounds (D31). With `start_now` the three pre-start checks run first (D30): input
        readable, delivery writable, VLM callable; any failure returns `precheck_failed` with
        a per-check reason and nothing starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskCreate"}
      responses:
        "201":
          description: created (state queued, or created when start_now=false)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/batch:
    post:
      tags: [tasks]
      operationId: createTasksBatch
      summary: One configuration, several datasets, one task each (deep link with many datasets)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskBatchCreate"}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: {type: array, items: {$ref: "#/components/schemas/TaskCreated"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: task detail (doc 03 §3.3)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: created - any field; after start - only name and note (D20)
      description: Other fields after start return task_state_conflict. Concurrent edits are guarded by If-Match.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: true
          description: the task's updated_at as returned by GET; a stale value returns 412
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Soft-delete the platform record; TOS is untouched (D28); created or terminal only
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: "deleted; restorable for 30 days"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: restoreTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: restored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/purge-artifacts:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: purgeTaskArtifacts
      summary: Delete this task's run directory on TOS; the exact path must be echoed back (D28)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_path]
              properties:
                confirm_path: {type: string, description: "tos://.../<run_id>/ exactly as the server computes it"}
      responses:
        "202":
          description: purge started
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path: {type: string}
                  bytes: {type: integer, minimum: 0}
                  latest_removed: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/rebind-credentials:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: rebindTaskCredentials
      summary: Give a finished task a new access key after the old one was deleted
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                input_credential: {type: string}
                output_credential: {type: string}
      responses:
        "200":
          description: rebound
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: action
        in: path
        required: true
        schema: {enum: [start, pause, resume, stop]}
    post:
      tags: [tasks]
      operationId: taskAction
      summary: start / pause / resume / stop; illegal transitions return 409 task_state_conflict
      description: |
        `start` first re-checks the dataset fingerprints against its registration (D37). On a
        mismatch nothing starts: 409 `source_changed` whose `error.details` is a `SourceChange`;
        after the user confirms, call `POST /tasks/{id}/repreflight`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: new state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/repreflight:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: repreflightTask
      summary: After a source_changed at start, run preflight again and start if the task still fits (D37)
      description: |
        Refreshes the dataset registration. Compatible (selected modules still available, explicit
        episodes still in range, needed inputs present) -> the task starts as with `start`; otherwise
        it stays `created` and `incompatibilities` says what to change in the form.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepreflightResult"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: retryTask
      summary: Re-run only the error episodes, from the stage they failed in (D25, D33)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                modules:
                  type: array
                  items: {$ref: "#/components/schemas/ModuleId"}
                  description: omitted = every module with error episodes or a whole-module failure
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/continue:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: continueTask
      summary: Resume a stopped or failed task from its checkpoints (not after source_changed)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/reexport:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: reexportTask
      summary: Incremental re-export of the delivered dataset (also the first export when export=false)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/subtasks:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: listSubtasks
      responses:
        "200":
          description: subtasks, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Subtask"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskTimeline
      summary: Execution timeline - main run, subtasks, pauses and resumes, result revisions
      responses:
        "200":
          description: timeline, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TimelineEntry"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/plan:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskPlan
      summary: The execution plan, read only (404 before the task starts)
      responses:
        "200":
          description: plan
          content:
            application/json:
              schema: {$ref: "./cli/plan.schema.json"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskLogs
      summary: Full logs, cursor paginated; SSE only carries what is happening now
      description: Newest first; the next page goes back in time. Without `subtask` the main run and every
        subtask are listed, `subtask=` (empty) keeps the main run only, `subtask=<id>` that subtask only.
      parameters:
        - name: stage
          in: query
          schema: {type: string}
        - name: subtask
          in: query
          description: absent = everything, empty = main run only, an id = that subtask only
          schema: {type: string}
        - name: level
          in: query
          schema: {enum: [error, warn, info, debug]}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: log lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/LogLine"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskUsage
      summary: Token usage by module, call kind, model and subtask; totals use the actual ledger only
      responses:
        "200":
          description: usage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageReport"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- report
  /tasks/{id}/report:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getReport
      summary: Report of the current (or given) result revision
      responses:
        "200":
          description: report
          content:
            application/json:
              schema:
                type: object
                required: [revision, report, links]
                properties:
                  revision: {type: integer, minimum: 1}
                  report: {$ref: "./cli/report.schema.json"}
                  links: {$ref: "#/components/schemas/Links"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/report/tables/{table}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: table
        in: path
        required: true
        description: a table id declared in the module registry
        schema: {type: string}
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getReportTable
      summary: One slice of a detail table, read from Parquet by the Daemon (doc 03 §6)
      description: |
        The cursor carries the revision; if the revision changed since the cursor was issued the
        server returns result_changed and the client starts again from the first page.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: sort
          in: query
          description: a column from the table's sortable whitelist
          schema: {type: string}
        - name: order
          in: query
          schema: {enum: [asc, desc], default: asc}
      responses:
        "200":
          description: rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [columns, revision]
                    properties:
                      columns: {type: array, items: {type: string}}
                      revision: {type: integer, minimum: 1}
                      items: {type: array, items: {type: object}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: listTaskEpisodes
      summary: The episodes of a result revision, for the report's Episode tab (F6.2)
      description: |
        Every episode of the three final lists in episode order: its list, the modules that put
        it there, and whether a person still has to answer something about it (on the current
        revision the adjudication cards still to decide - pending or unsure; on a history
        revision the questions that revision asked). `q` is an episode number matched as a
        substring of the index; a leading `ep` and leading zeros are dropped, so `12`, `ep12`,
        `ep 12` and `ep000012` all find ep 12. The cursor carries the revision and is bound to
        the filters (another filter set is 400 validation_failed, another revision 409
        result_changed). `total` counts the filtered set, `counts` the whole revision. On a findings
        revision (C2 2.0) `level` and `item` keep the episodes with a finding of that level / that
        taxonomy item (2.3.0); a revision without them (the funnel's) matches none.
      parameters:
        - name: list
          in: query
          schema: {enum: [passed, reject, held]}
        - name: review
          in: query
          description: only episodes with (true) or without (false) an open question
          schema: {type: boolean}
        - name: level
          in: query
          description: only episodes with a finding of this level (findings revisions, 2.3.0)
          schema: {$ref: "#/components/schemas/FindingLevel"}
        - name: item
          in: query
          description: only episodes with a finding of this taxonomy item (findings revisions, 2.3.0); not an item id is 400
          schema: {type: string, maxLength: 32}
        - name: q
          in: query
          description: "an episode number, optionally with the ep prefix: 12, ep12, ep 12"
          schema: {type: string, maxLength: 64}
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: episodes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskEpisodePage"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: index
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getEpisode
      summary: One episode across all modules (the v1 trajectory page)
      responses:
        "200":
          description: episode view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EpisodeView"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/pipeline/episodes:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [report]
      operationId: listPipelineEpisodes
      summary: Recent per-episode funnel progress, available while the task runs
      parameters:
        - name: before
          in: query
          description: Change sequence cursor returned as next_cursor; shows the most recently updated episodes first.
          schema: {type: integer, minimum: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: Recent episodes and live funnel verdicts
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor, started, finished]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/PipelineEpisode"}}
                  next_cursor: {type: [integer, "null"], minimum: 0}
                  started: {type: integer, minimum: 0}
                  finished: {type: integer, minimum: 0}
                  modules:
                    type: array
                    description: >-
                      two-block runs (2.3.0): per per-episode module so far, the episodes it judged, the ones
                      it failed on and, of the judged, the ones with a finding (the live module cards)
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, judged, error, flagged]
                      properties:
                        id: {$ref: "#/components/schemas/ModuleId"}
                        judged: {type: integer, minimum: 0}
                        error: {type: integer, minimum: 0}
                        flagged: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/pipeline/episodes/{index}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: index
        in: path
        required: true
        schema: {type: integer, minimum: 0}
    get:
      tags: [report]
      operationId: getPipelineEpisode
      summary: Immediate funnel result and module records of one episode
      responses:
        "200":
          description: Episode progress and current records
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PipelineEpisode"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/sync-curves:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: index
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getEpisodeSyncCurves
      summary: One episode's video-action sync curves (F6.2)
      description: |
        Per camera: picture motion (optical-flow energy) and arm motion (joint speed) over time,
        the cross-correlation of the two within the check's scan window, and the check's reading
        on that curve. Values are raw; the page normalizes them to compare shapes. At most 600
        points per series. 404 not_found with details.reason module_not_run (the sync check was not
        selected), no_record (the episode never reached it, or it failed there) or no_curves
        (nothing was kept: by default only episodes worth a look keep their curves).
      responses:
        "200":
          description: curves
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SyncCurves"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/viz:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [viz]
      operationId: getTaskViz
      summary: The presentation model of a task's input as the task saw it (the mini player, design doc 18 §2)
      description: |
        Read like `getDatasetViz`, but from the task's frozen input (D27): its address and input
        key, `preflight.json`, `source_manifest.json` and the mcap mapping frozen into run.json.
        A deleted or changed registration does not change it; `dataset_id` is the task's
        registration while it exists.
      responses:
        "200":
          description: the task's input
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizDataset"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/viz:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
    get:
      tags: [viz]
      operationId: getTaskEpisodeViz
      summary: One episode of the task's input for the mini player, with the check clock to place findings
      responses:
        "200":
          description: the episode
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizEpisode"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/series:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
    get:
      tags: [viz]
      operationId: getTaskEpisodeSeries
      summary: One curve group of an episode of the task's input (as getDatasetEpisodeSeries)
      parameters:
        - $ref: "#/components/parameters/VizStream"
        - $ref: "#/components/parameters/VizFrom"
        - $ref: "#/components/parameters/VizTo"
        - $ref: "#/components/parameters/VizPoints"
      responses:
        "200":
          description: the curves
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizSeries"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/cameras/{camera}.mp4:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getTaskCameraVideo
      summary: A camera of the task's input served by the Daemon (as getDatasetCameraVideo)
      description: |
        Also what `GET /media/sign` resolves an mcap episode's virtual camera path to (the
        episode view's `videos`): without `transcode`, a JPEG camera is muxed into an MJPEG mp4 in
        memory as before 2.4.0.
      parameters:
        - $ref: "#/components/parameters/VizTranscode"
        - $ref: "#/components/parameters/RangeHeader"
      responses:
        "200":
          $ref: "#/components/responses/VizVideo"
        "206":
          $ref: "#/components/responses/VizVideoRange"
        "202":
          $ref: "#/components/responses/VizPending"
        "416":
          description: the range is outside the file
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/cameras/{camera}.frames:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getTaskCameraFrames
      summary: The JPEG frame pack of a camera of the task's input (as getDatasetCameraFrames)
      parameters:
        - $ref: "#/components/parameters/RangeHeader"
      responses:
        "200":
          $ref: "#/components/responses/VizFrames"
        "206":
          $ref: "#/components/responses/VizFramesRange"
        "202":
          $ref: "#/components/responses/VizPending"
        "416":
          description: the range is outside the pack
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}/cameras/{camera}.json:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/PathIndex"
      - $ref: "#/components/parameters/PathCamera"
    get:
      tags: [viz]
      operationId: getTaskCameraFrameIndex
      summary: The index of a camera's JPEG frame pack (as getDatasetCameraFrameIndex)
      responses:
        "200":
          description: the index
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VizFrameIndex"}
        "202":
          $ref: "#/components/responses/VizPending"
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/perf:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getPerf
      summary: Performance profile - all calls, main run only, or one subtask
      parameters:
        - name: scope
          in: query
          schema: {enum: [all, main, subtask], default: all}
        - name: subtask
          in: query
          schema: {type: string}
      responses:
        "200":
          description: profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Perf"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/adjudication:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [report]
      operationId: listAdjudication
      summary: The adjudication queue, one card per episode, grouped by source module
      parameters:
        - name: source
          in: query
          schema: {$ref: "#/components/schemas/ModuleId"}
        - name: status
          in: query
          description: >-
            by card status, the same on both tabs: pending = not answered yet (on the appeals tab
            too, although appeals never count in AdjudicationCounts.pending) or answered unsure;
            decided; unapplied = answered but not executed yet
          schema: {enum: [pending, decided, unapplied, all], default: pending}
        - name: tab
          in: query
          description: >-
            appeals lists rejects attributed to an appealable module (registry `appealable`;
            today task_success alone and dedup); physical and structural gates and soft scores
            are final
          schema: {enum: [review, appeals], default: review}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [counts]
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/AdjudicationCard"}}
                      counts: {$ref: "#/components/schemas/AdjudicationCounts"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [report]
      operationId: submitAdjudication
      summary: Record decisions (append only, last one wins, nothing is executed)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  items: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdjudicationCounts"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/adjudication/apply:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [report]
      operationId: applyAdjudication
      summary: Execute the recorded decisions as a subtask (D10); never exports (D9)
      description: |
        The body is optional; without one (or with `{}`) relabelled episodes are judged again the
        way v1 does (D39). The choice is kept in the subtask's `scope.relabel_rerun`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdjudicationApply"}
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- system
  /media/sign:
    get:
      tags: [system]
      operationId: signMedia
      summary: A presigned TOS URL for a video or evidence frame (D16); browsers fetch it directly
      parameters:
        - name: task
          in: query
          required: true
          schema: {type: string}
        - name: scope
          in: query
          required: true
          description: delivery (output key) or input (input key; the public cache bucket is not signed)
          schema: {enum: [delivery, input]}
        - name: path
          in: query
          required: true
          description: >-
            relative to the scope's prefix - scope=delivery: the task's run directory
            <delivery>/<run_id>/; scope=input: the dataset root - normalized and checked
            against it. Clip start and end times come from the episode endpoint.
          schema: {type: string}
        - name: ttl
          in: query
          schema: {type: integer, minimum: 60, maximum: 3600, default: 1800}
      responses:
        "200":
          description: signed URL (public endpoint)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedUrl"}
        default: {$ref: "#/components/responses/Error"}
  /events/tasks/{id}:
    servers:
      - url: "{base}"
        variables:
          base: {default: ""}
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [system]
      operationId: taskEvents
      summary: Server-sent events for one task (doc 03 §5)
      description: |
        Events: `state`, `progress`, `log`, `usage`, `done`, `reset`; data payloads are the
        Sse* schemas. Every event has `id: <epoch>-<seq>`. Reconnect with `Last-Event-ID`: same
        epoch and seq still buffered (last 200) resumes; otherwise the server sends `reset`
        and the client reloads GET /api/v1/tasks/{id}. usage and progress carry cumulative
        values. Progress is throttled to 2/s and logs to 20/s; the full log is in /logs.
        Clients must keep working without SSE by polling every 5 s.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: "^[0-9]+-[0-9]+$"}
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /healthz:
    servers:
      - url: "/"
      - url: "{base}"
        variables:
          base: {default: ""}
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness; no authentication, no dependency checks
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /readyz:
    servers:
      - url: "/"
      - url: "{base}"
        variables:
          base: {default: ""}
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness; no authentication (doc 09 §2.2)
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: not ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic against htpasswd (bcrypt / apr1), realm "Robot Data Curation" (doc 08 §5)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: the same key within 24 hours returns the first response (doc 03 §8)
      schema: {type: string, minLength: 8, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      description: opaque, from next_cursor
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Rev:
      name: rev
      in: query
      description: result revision; omitted = the current one (task.result_rev)
      schema: {type: integer, minimum: 1}
    Source:
      name: source
      in: query
      required: true
      schema: {enum: [tos, public, local]}
    Region:
      name: region
      in: query
      schema: {$ref: "#/components/schemas/Region"}
    CredentialName:
      name: credential
      in: query
      description: access key name (not needed for source=public)
      schema: {type: string}
    PathIndex:
      name: index
      in: path
      required: true
      description: the episode's own index (preflight `episode_indices`)
      schema: {type: integer, minimum: 0}
    PathCamera:
      name: camera
      in: path
      required: true
      description: the camera's `key` in the presentation model
      schema: {$ref: "#/components/schemas/VizCameraKey"}
    RangeHeader:
      name: Range
      in: header
      description: one byte range (`bytes=a-b`, `bytes=a-`, `bytes=-n`)
      schema: {type: string}
    VizTranscode:
      name: transcode
      in: query
      description: >-
        true: the H.264 transcode of the camera, for a browser that cannot decode the original
        (AV1 without hardware decoding, HEVC); 404 with details.reason transcode_disabled when
        CURATOR_VIZ_TRANSCODE is off
      schema: {type: boolean, default: false}
    VizStream:
      name: stream
      in: query
      required: true
      description: the curve group's `key` (VizStream.key)
      schema: {type: string, minLength: 1, maxLength: 128}
    VizFrom:
      name: from
      in: query
      description: start of the window in episode seconds (default 0)
      schema: {type: number, minimum: 0}
    VizTo:
      name: to
      in: query
      description: end of the window in episode seconds (default the episode's end)
      schema: {type: number, minimum: 0}
    VizPoints:
      name: points
      in: query
      description: at most this many points per line; more raw points are thinned by min / max per bucket
      schema: {type: integer, minimum: 100, maximum: 20000, default: 2000}

  responses:
    Error:
      description: |
        400 validation_failed, 401 unauthorized, 404 not_found, 409 task_state_conflict /
        subtask_active / credential_in_use / backend_in_use / name_taken / preflight_expired /
        source_changed / result_changed / idempotency_conflict, 412 precondition_failed,
        422 precheck_failed / confirm_path_mismatch / model_check_failed, 500 internal
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    VizVideo:
      description: the whole video (Accept-Ranges bytes)
      content:
        video/mp4:
          schema: {type: string, format: binary}
    VizVideoRange:
      description: the requested byte range (Content-Range)
      content:
        video/mp4:
          schema: {type: string, format: binary}
    VizFrames:
      description: the whole frame pack (Accept-Ranges bytes)
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    VizFramesRange:
      description: the requested byte range of the frame pack (Content-Range)
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    VizPending:
      description: still being prepared (transcoding, building the frame pack); ask again shortly
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VizMediaPending"}

  schemas:
    # ---------- common
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [validation_failed, unauthorized, not_found, task_state_conflict, subtask_active,
                     credential_in_use, backend_in_use, dataset_in_use, name_taken, preflight_expired, precheck_failed,
                     source_changed, result_changed, confirm_path_mismatch, model_check_failed,
                     idempotency_conflict, precondition_failed, method_not_allowed, internal]
            message: {type: string, description: "Chinese, shown to people as is"}
            details: {type: object}
    Link:
      type: object
      additionalProperties: false
      required: [rel, title, url]
      properties:
        rel: {enum: [task, report, adjudication, plan, logs, credentials, dataset]}
        title: {type: string}
        url: {type: string}
        absolute: {type: boolean, default: true, description: "false when publicBaseUrl is not configured"}
    Links:
      type: array
      items: {$ref: "#/components/schemas/Link"}
    CursorPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
    Region:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ModuleId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    ReasoningEffort:
      description: Ark's native values; null = the field is not sent (the model's default, and the parity setting)
      enum: [none, minimal, low, medium, high, xhigh, max, null]
    VerifyState:
      enum: [unverified, ok, failed]
    VerifyResult:
      type: object
      additionalProperties: false
      required: [verify_state, last_verified_at]
      properties:
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: integer}
        error: {type: [string, "null"]}
    PrecheckDetails:
      type: object
      description: error.details of precheck_failed - one entry per pre-start check (D30)
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, ok, code, reason]
            properties:
              id: {enum: [input, output, vlm]}
              ok: {type: boolean}
              code: {type: string, description: "stable reason of a failed check, e.g. forbidden, not_found, unreachable"}
              reason: {type: string, description: "Chinese, shown under the form field"}
              target: {type: string, description: "what was checked: a tos:// path or the model"}
              elapsed_ms: {type: integer, minimum: 0}
    ProbeResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}
        error:
          type: object
          description: >-
            Why it failed; with ok true only leftover appears (written, but the probe object
            could not be removed), which deserves a warning.
          properties:
            code: {enum: [forbidden, not_found, auth_failed, unreachable, server_error, failed, leftover]}
            message: {type: string}

    # ---------- credentials
    Credential:
      type: object
      additionalProperties: false
      required: [id, name, kind, meta, verify_state, is_default, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {const: tos}
        meta:
          type: object
          additionalProperties: false
          required: [region]
          properties:
            region: {$ref: "#/components/schemas/Region"}
            endpoint: {type: string}
            test_bucket: {type: string, description: "HeadBucket target when the key cannot ListBuckets"}
            access_key_id_hint: {type: string, description: "last 4 characters only"}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        references:
          type: object
          properties:
            active_tasks: {type: integer, minimum: 0}
            historical_tasks: {type: integer, minimum: 0}
        is_default:
          type: boolean
          description: >-
            the key a new task starts with; at most one per owner. Without one the form picks as
            before (the only key, or the one used last). Deleting the key leaves none.
        created_at: {type: integer}
        updated_at: {type: integer}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [name, access_key_id, secret_access_key, region]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string, minLength: 1}
        secret_access_key: {type: string, minLength: 1, writeOnly: true}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}
    CredentialUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string}
        secret_access_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}
        is_default:
          type: boolean
          description: >-
            true makes this key the default and takes the flag from any other key; false clears it
            when this key has it. Neither verifies the key again.

    # ---------- vlm
    VlmModel:
      type: object
      additionalProperties: false
      required: [id, model_name, reasoning_effort, max_concurrency, capabilities, source, is_default]
      properties:
        id: {type: string}
        is_default:
          type: boolean
          description: >-
            the model a new task starts with; at most one per owner across every backend. Without
            one the form asks, as before. Deleting the model or its backend leaves none.
        model_name: {type: string, description: "Model ID or inference endpoint ID (ep-...)"}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1, description: "null = the backend's"}
        capabilities:
          type: object
          additionalProperties: false
          properties:
            vision: {type: [boolean, "null"]}
            reasoning_effort_levels:
              type: array
              description: effective levels to offer (from the site's mapping table; all 7 when unknown)
              items: {enum: [none, minimal, low, medium, high, xhigh, max]}
        source: {enum: [listed, manual]}
    VlmModelCreate:
      type: object
      additionalProperties: false
      required: [model_name]
      properties:
        model_name: {type: string, minLength: 1}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
    VlmModelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
        is_default:
          type: boolean
          description: >-
            true makes it the one default and clears the flag on every other model of every
            backend; false clears it and leaves none
    VlmBackend:
      type: object
      additionalProperties: false
      required: [id, name, kind, endpoint, max_concurrency, has_api_key, verify_state, models, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [ark, custom]}
        endpoint: {type: string}
        max_concurrency: {type: integer, minimum: 1, default: 64}
        has_api_key: {type: boolean}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
        models_listed: {type: boolean, description: "whether GET /models worked last time"}
        created_at: {type: integer}
        updated_at: {type: integer}
    VlmBackendCreate:
      type: object
      additionalProperties: false
      required: [name, kind, endpoint]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {enum: [ark, custom]}
        endpoint: {type: string, minLength: 1}
        api_key: {type: string, writeOnly: true, description: "required for ark"}
        max_concurrency: {type: integer, minimum: 1}
      if:
        properties: {kind: {const: ark}}
      then:
        required: [api_key]
    VlmBackendUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        endpoint: {type: string}
        api_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        max_concurrency: {type: integer, minimum: 1}

    # ---------- datasets
    ModuleRegistry:
      type: object
      additionalProperties: false
      required: [registry_version, taxonomy_version, blocks, stages, full_set_stages, finding_levels,
                 unassessable_reasons, review_lines, taxonomy, modules]
      description: >-
        C1 2.0 (design doc 17 §2): where every module runs, what it can find and what it covers. The
        console takes every module, code and item name from here.
      properties:
        registry_version: {type: string}
        taxonomy_version: {type: string, description: "the taxonomy (C6) every code maps into"}
        blocks:
          type: array
          description: >-
            The two blocks that run side by side and never filter each other (D57); inside a block every
            stage gets every selected episode
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh, stages]
            properties:
              id: {enum: [cpu, vlm]}
              title_zh: {type: string}
              stages: {type: array, minItems: 1, items: {$ref: "#/components/schemas/RegistryStage"}}
        stages: {type: array, items: {$ref: "#/components/schemas/RegistryStage"}, description: "every stage, the CPU block's first"}
        full_set_stages:
          type: array
          items: {$ref: "#/components/schemas/RegistryStage"}
          description: stages that need the whole selection and start once the earlier stages of their block are done
        finding_levels:
          type: array
          description: blocking (rejects), review (asks a person), info (reported only), with the console's titles
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh]
            properties:
              id: {$ref: "#/components/schemas/FindingLevel"}
              title_zh: {type: string}
        unassessable_reasons:
          type: array
          description: why a module could not assess an item on an episode (design doc 17 §1.4)
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              title_zh: {type: string}
        review_lines:
          type: array
          description: >-
            The questions a person can be asked on the adjudication page (D43). A page shows a
            line it has no dedicated view for from this entry: its title, the question's reason
            and one button per decision.
          items: {$ref: "#/components/schemas/ReviewLine"}
        taxonomy:
          type: object
          additionalProperties: false
          required: [dimensions, items]
          description: the bound taxonomy (C6, docs/contracts/taxonomy.json) without its sample-set notes
          properties:
            dimensions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, name_zh]
                properties:
                  id: {type: string}
                  name_zh: {type: string}
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, dimension, name_zh, explain_zh, kind, level]
                properties:
                  id: {$ref: "#/components/schemas/TaxonomyItemId"}
                  dimension: {type: string}
                  name_zh: {type: string}
                  explain_zh: {type: string}
                  kind: {enum: [defect, phenomenon, reference, control], description: "control: a legal case that must not be reported"}
                  level: {enum: [episode, dataset]}
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name_zh, summary_zh, level, needs, block, stage, depends_on, codes, covers,
                       param_schema, tables, mergeable]
            properties:
              id: {$ref: "#/components/schemas/ModuleId"}
              name_zh: {type: string}
              summary_zh: {type: string}
              level: {enum: [episode, dataset]}
              needs: {type: array, items: {enum: [timestamps, action, state, video, embodiment_profile, vlm, raw_bytes, eef_input]}}
              block: {enum: [cpu, vlm]}
              stage: {$ref: "#/components/schemas/RegistryStage"}
              depends_on:
                type: array
                items: {enum: [autolabel]}
                description: "data only: the captions autolabel writes for episodes without a task text"
              codes:
                type: array
                minItems: 1
                description: the finding codes the module reports (design doc 17 §2.2)
                items: {$ref: "#/components/schemas/FindingCode"}
              covers:
                type: array
                items: {$ref: "#/components/schemas/TaxonomyItemId"}
                description: >-
                  the items it assesses on an episode it can read: its codes' items plus items it only
                  reports a reading for; a record says which of them it could not assess and why
              param_schema: {type: object}
              tables:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title_zh, sortable, default_sort]
                  properties:
                    id: {type: string}
                    title_zh: {type: string}
                    sortable: {type: array, items: {type: string}}
                    default_sort: {type: string}
              mergeable: {type: boolean}
              rides_on:
                $ref: "#/components/schemas/ModuleId"
                description: >-
                  present on a module answered inside this host module's requests (1.19.0): it runs
                  whenever the host runs, has no request of its own and cannot be selected alone
    RegistryStage:
      enum: [integrity, numeric, frame, dedup, autolabel, vlm, profile]
      description: a stage of a block (registry 2.0); a plan's stage ids are its own (cli/plan.schema.json)
    FindingLevel:
      enum: [blocking, review, info]
    TaxonomyItemId:
      type: string
      pattern: "^[A-Z]+-[0-9]+$"
      description: an item of the taxonomy (C6), e.g. FILE-3, MV-5
    FindingCode:
      type: object
      additionalProperties: false
      required: [code, item, name_zh, severity, level, scope_kind, appealable]
      properties:
        code: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "unique within its module"}
        item:
          oneOf:
            - $ref: "#/components/schemas/TaxonomyItemId"
            - type: "null"
          description: null only for an info-level item of the platform's own
        name_zh: {type: string}
        severity: {enum: [high, medium, low], description: "the default; a module may grade by measure"}
        level: {$ref: "#/components/schemas/FindingLevel"}
        scope_kind: {enum: [episode, camera, channel, dataset]}
        appealable: {type: boolean, description: "blocking codes only: a reject it caused may be appealed (D42)"}
        review_line: {$ref: "#/components/schemas/ReviewLineId"}
    ReviewLineId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: a line of the registry's review_lines; today label, task_verdict, reject_appeal, eef_check, integrity_check
    ReviewLine:
      type: object
      additionalProperties: false
      required: [id, review_kind, title_zh, applies_to, counts_as_pending, decisions]
      properties:
        id: {$ref: "#/components/schemas/ReviewLineId"}
        review_kind: {type: string, description: "the kind of its review.json items (C2); label_conflict for label"}
        title_zh: {type: string}
        applies_to: {enum: [passed, reject], description: "the list its episodes are in when asked"}
        counts_as_pending: {type: boolean, description: "an open item must be decided; false = a person may act (appeals)"}
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [const, title]
            properties:
              const: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              title: {type: string}
        follow_ups:
          type: array
          default: []
          description: >-
            Questions a card gains once its answer on this line is one of `after` - only on a
            card that does not ask that line already. v1: after adopting a new label a person
            may give the task verdict (the machine takes it, no re-judging); left open, the
            episode is judged again with the new label. An optional follow-up never counts as
            pending, and its answer lapses (not executed, not counted) once the answer that
            opened it changes.
          items:
            type: object
            additionalProperties: false
            required: [after, line, decisions, optional]
            properties:
              after: {type: array, minItems: 1, items: {type: string}}
              line: {$ref: "#/components/schemas/ReviewLineId"}
              decisions: {type: array, minItems: 1, items: {type: string}}
              optional: {type: boolean}
    BrowsedDataset:
      type: object
      additionalProperties: false
      required: [name, uri]
      properties:
        name: {type: string}
        uri: {type: string}
        format_hint: {enum: [lerobot_v2, lerobot_v3, mcap, lance, rrd, unknown]}
        episodes: {type: [integer, "null"]}
    DatasetFormat: {enum: [lerobot_v2, lerobot_v3, mcap, lance, unsupported]}
    DatasetItemFields:
      type: object
      required: [id, name, source, uri, region, format, episode_count, robot_type, check_state, checked_at,
                 preflighted_at, created_at, last_task, viz]
      properties:
        id:
          type: string
          pattern: "^(ds-[a-z]{9}|ds_[0-9A-Za-z]+)$"
          description: "ds- and 9 lowercase letters (D45); registrations made before 1.10.0 keep ds_ and their old id"
        name: {type: string}
        source: {enum: [tos, public, local]}
        uri: {type: string}
        region: {type: [string, "null"]}
        format: {$ref: "#/components/schemas/DatasetFormat"}
        episode_count: {type: [integer, "null"], minimum: 0}
        robot_type: {type: [string, "null"]}
        check_state: {enum: [ok, changed], description: "changed: the fingerprints differ from the kept ones; preflight again"}
        checked_at: {type: [integer, "null"]}
        preflighted_at: {type: integer}
        created_at: {type: integer}
        last_task:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskRef"
        viz: {$ref: "#/components/schemas/VizStatus"}
    DatasetItem:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
      unevaluatedProperties: false
    DatasetDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
        - type: object
          required: [note, credential, preflight, meta_fingerprint, listing, checks, tasks, links, viz_mapping, annotations]
          properties:
            note: {type: [string, "null"]}
            viz_mapping:
              description: the mcap field mapping (C7); null for other formats
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/DatasetMappingInfo"
            annotations:
              description: the external annotation file attached to it (a viz_annotations upload), if any
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/DatasetAnnotationsInfo"
            credential: {type: [string, "null"], description: "access key name; null for the public bucket, or once the key is deleted"}
            preflight: {$ref: "./cli/preflight.schema.json"}
            meta_fingerprint: {type: string}
            listing:
              type: object
              description: summary of the file listing kept at the last preflight (source-manifest summary)
              required: [objects, bytes, digest]
              properties:
                objects: {type: integer, minimum: 0, description: "C2 source-manifest summary.count"}
                bytes: {type: integer, minimum: 0}
                digest: {type: string}
            checks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DatasetCheck"}, description: "newest first"}
            tasks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/TaskRef"}, description: "newest first"}
            links: {$ref: "#/components/schemas/Links"}
      unevaluatedProperties: false
    DatasetCreate:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputRef"}
        name: {type: string, minLength: 1, maxLength: 128, description: "defaults to the last path segment"}
        note: {type: string, maxLength: 2000}
        viz_mapping:
          $ref: "#/components/schemas/VizMapping"
          description: mcap only - the field mapping confirmed in the add drawer (kept as version 1)
        annotations_upload:
          $ref: "#/components/schemas/UploadId"
          description: an external annotation file (a viz_annotations upload) to attach
    DatasetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: [string, "null"], maxLength: 2000}
    DatasetCheck:
      type: object
      additionalProperties: false
      required: [at, trigger, result, change]
      properties:
        at: {type: integer}
        trigger: {enum: [add, recheck, task_start, repreflight]}
        result: {enum: [same, changed]}
        change:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SourceChange"
    SourceChange:
      type: object
      additionalProperties: false
      description: what differs from the fingerprints kept at registration or at the last preflight (D37)
      required: [meta_changed, added, removed, modified, sample_keys, preflighted_at]
      properties:
        meta_changed: {type: boolean}
        added: {type: integer, minimum: 0}
        removed: {type: integer, minimum: 0}
        modified: {type: integer, minimum: 0}
        sample_keys: {type: array, maxItems: 20, items: {type: string}, description: "a few affected keys, added ones first"}
        preflighted_at: {type: integer}
    TaskRef:
      type: object
      additionalProperties: false
      required: [id, name, state, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
    RepreflightResult:
      type: object
      additionalProperties: false
      required: [compatible, incompatibilities, task]
      properties:
        compatible: {type: boolean}
        incompatibilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason_code, reason]
            properties:
              field: {type: string, description: "form field to fix, e.g. modules, episodes, embodiment_id"}
              module: {$ref: "#/components/schemas/ModuleId"}
              reason_code: {type: string}
              reason: {type: string, description: "Chinese, shown as is"}
        task: {$ref: "#/components/schemas/Task"}
    Overview:
      type: object
      description: >-
        Soft-deleted tasks never count, except in tokens. running counts what workers are busy
        with - main runs and subtasks in running, pausing or stopping - and queued / paused those
        states; recent covers the period `days` asked for in the site's time zone
        (CURATOR_TZ_OFFSET), cut into buckets that end with the current one (7 or 30 days, 13
        calendar weeks from Monday, or 12 calendar months) and starting at `since`: tasks that
        ended succeeded or completed_with_errors since then, their summary totals, passed / total
        over episodes, and actual-ledger prompt + completion tokens per bucket; credentials_failed
        counts access keys (kind tos) only, a backend's key failing counts in backends_failed.
      additionalProperties: false
      required: [todo, running, recent, datasets, generated_at]
      properties:
        todo:
          type: object
          additionalProperties: false
          required: [error_tasks, adjudication, delivery_pending, datasets_changed, credentials_failed, backends_failed]
          properties:
            error_tasks: {type: integer, minimum: 0, description: "completed_with_errors, can be retried"}
            adjudication:
              type: object
              additionalProperties: false
              required: [tasks, episodes]
              properties:
                tasks: {type: integer, minimum: 0}
                episodes: {type: integer, minimum: 0}
            delivery_pending: {type: integer, minimum: 0, description: "tasks whose delivered dataset is stale or was never exported"}
            datasets_changed: {type: integer, minimum: 0}
            credentials_failed: {type: integer, minimum: 0}
            backends_failed: {type: integer, minimum: 0}
        running:
          type: object
          additionalProperties: false
          required: [running, queued, paused, active]
          properties:
            running: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            paused: {type: integer, minimum: 0}
            active:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [task, stage, done, total]
                properties:
                  task: {$ref: "#/components/schemas/TaskRef"}
                  stage: {type: [string, "null"]}
                  done: {type: integer, minimum: 0}
                  total: {type: integer, minimum: 0}
        recent:
          type: object
          additionalProperties: false
          required: [days, bucket, since, tasks_finished, episodes_checked, pass_rate, tokens_per_bucket]
          properties:
            days: {enum: [7, 30, 90, 365], description: "the period asked for"}
            bucket: {enum: [day, week, month], description: "day for 7 and 30, week for 90, month for 365"}
            since: {type: integer, description: "epoch ms where the first bucket starts; the figures count from here"}
            tasks_finished: {type: integer, minimum: 0}
            episodes_checked: {type: integer, minimum: 0}
            pass_rate: {type: [number, "null"], minimum: 0, maximum: 1}
            tokens_per_bucket:
              type: array
              description: actual-ledger totals only, oldest bucket first, every bucket listed (7, 30, 13 or 12)
              minItems: 7
              maxItems: 30
              items:
                type: object
                additionalProperties: false
                required: [start, label, tokens]
                properties:
                  start: {type: integer, description: "epoch ms, local midnight in the site's time zone"}
                  label: {type: string, description: "09-23 (a day), 09-21 周 (the week from that Monday), 2026-09 (a month)"}
                  tokens: {type: integer, minimum: 0}
        datasets:
          type: object
          additionalProperties: false
          required: [total, changed]
          properties:
            total: {type: integer, minimum: 0}
            changed: {type: integer, minimum: 0}
        generated_at: {type: integer}
    EpisodePreview:
      type: object
      additionalProperties: false
      required: [index, length_s, task, task_source, cameras]
      properties:
        index: {type: integer, minimum: 0}
        length_s: {type: [number, "null"]}
        task: {type: string}
        task_source: {enum: [原始标注, 无]}
        task_unread:
          type: boolean
          description: >-
            mcap (1.12): the episode has a task topic the preview does not read (its text is
            inside the file; the checks read it) - task is empty, but not because there is none
        cameras:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, url]
            properties:
              name: {type: string}
              url: {type: string, description: "presigned, or anonymous for the public bucket"}
              from_ts: {type: number}
              to_ts: {type: number}
    InputRef:
      type: object
      additionalProperties: false
      required: [source, uri]
      properties:
        source: {enum: [tos, public, local]}
        uri: {type: string, minLength: 1}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; not for source=public. Requests name one; responses give null once the key was deleted (see rebind-credentials)"}
      if:
        properties: {source: {const: tos}}
      then:
        required: [credential]
    InputSpec:
      description: a registered dataset (D36), or an input given in full
      oneOf:
        - type: object
          additionalProperties: false
          required: [dataset_id]
          properties:
            dataset_id: {type: string}
        - $ref: "#/components/schemas/InputRef"
    OutputRef:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; null in responses once the key was deleted"}
    UploadKind:
      enum: [eef_trajectory, eef_observation_seeds, eef_gripper_template, eef_record_mapping, viz_annotations]
      description: >-
        the x-upload-kind of a file parameter (registry 1.5); viz_annotations is a dataset's external
        annotation file (design doc 18 §4.5), not a module parameter
    UploadId:
      type: string
      pattern: "^(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
      description: "upl- and 9 lowercase letters (D45); uploads made before 1.10.0 keep upl_ and hex digits"
    UploadIssue:
      type: object
      additionalProperties: false
      required: [problem]
      properties:
        field: {type: [string, "null"], description: JSON path inside the file}
        problem: {type: string}
        code: {type: string}
        severity: {enum: [error, warning]}
        sample_id: {type: string}
        episode_index: {type: integer}
        frame_index: {type: integer}
        camera_id: {type: string}
        point_id: {type: string}
    Upload:
      type: object
      additionalProperties: false
      required: [upload_id, handle, kind, name, sha256, size_bytes, created_at, validation]
      properties:
        upload_id: {$ref: "#/components/schemas/UploadId"}
        handle:
          type: string
          pattern: "^upload:(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
          description: the value of the file parameter in TaskCreate.modules[].params
        kind: {$ref: "#/components/schemas/UploadKind"}
        name: {type: string}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        size_bytes: {type: integer, minimum: 0}
        created_at: {type: integer}
        validation:
          type: object
          additionalProperties: false
          required: [valid, summary, warnings]
          properties:
            valid: {const: true}
            summary:
              type: object
              description: >-
                eef_trajectory: dataset, samples, episodes, frames, cameras, points_checked,
                max_reprojection_difference_px; eef_observation_seeds: rows, samples, cameras, points
            warnings: {type: array, items: {$ref: "#/components/schemas/UploadIssue"}}
    PreflightRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputSpec"}
        vlm_backend: {type: string}
        embodiment_id: {type: string}
    PreflightResponse:
      type: object
      additionalProperties: false
      required: [preflight_id, expires_at, result]
      properties:
        preflight_id: {type: string}
        expires_at: {type: integer}
        result: {$ref: "./cli/preflight.schema.json"}
    DeliveryProbeRequest:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: string}

    # ---------- tasks
    TaskState:
      enum: [created, queued, running, pausing, paused, stopping, stopped, succeeded, completed_with_errors, failed]
    EpisodeSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {const: all}
        - type: object
          additionalProperties: false
          required: [mode, n]
          properties:
            mode: {const: head}
            n: {type: integer, minimum: 1}
        - type: object
          additionalProperties: false
          required: [mode, expr]
          properties:
            mode: {const: explicit}
            expr: {type: string, description: "3,10-12 / @file is CLI only; validated and expanded on the server"}
            indices: {type: array, items: {type: integer, minimum: 0}, readOnly: true}
    ModuleChoice:
      oneOf:
        - $ref: "#/components/schemas/ModuleId"
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {$ref: "#/components/schemas/ModuleId"}
            params: {type: object, description: "validated against the module's param_schema"}
    TaskVlm:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        snapshot: {type: [object, "null"], description: "effective settings frozen at start (P17)"}
    VlmChoice:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
    TaskParams:
      type: object
      additionalProperties: false
      description: task-level parameters (doc 03 §3.1); concurrency values are upper bounds only (D31)
      properties:
        start_now: {type: boolean, default: true}
        export: {type: boolean, default: true}
        batch_size: {type: integer, minimum: 1, maximum: 256, description: "Maximum episodes per funnel dispatch. Persistent workers hand off completed episodes immediately and refill up to the plan concurrency, independently of this size. External CLI wrappers retain batch handoff. If omitted, derived from parallelism (8–64) and reduced for small selections."}
        vlm_retry: {type: integer, minimum: 0, maximum: 5, default: 3}
        vlm_hedge: {type: boolean, default: true}
        vlm_timeouts_s:
          type: object
          additionalProperties: false
          properties:
            probe: {type: number, exclusiveMinimum: 0, default: 60}
            endstate: {type: number, exclusiveMinimum: 0, default: 60}
            arbitration: {type: number, exclusiveMinimum: 0, default: 60}
            caption: {type: number, exclusiveMinimum: 0, default: 60}
            llm: {type: number, exclusiveMinimum: 0, default: 120}
        clips: {type: boolean, default: false}
        policy:
          type: object
          additionalProperties: false
          description: >-
            The verdict policy (design doc 17 §4, D58): which findings reject an episode, which ask a
            person and which are only reported. `default` gives every finding code its registry level
            (today's hard gates reject, today's suspects and abstentions are asked); `report_only`
            rejects nothing and asks nothing. Frozen at start; changing it later re-runs aggregate
            only. The funnel keeps judging by `default` until the policy aggregate replaces it (F12.3).
          properties:
            preset: {enum: [default, report_only], default: default}
        limits:
          type: object
          additionalProperties: false
          properties:
            cpu_concurrency:
              type: integer
              minimum: 1
              description: >-
                At most this many CPU workers for this task; it can only lower the default, which
                is every core of the container but two (P4, D54). Unset: that default. The CPU
                workers of all running tasks come out of one pool of that size in the Daemon, so
                fewer may run at a time while other tasks run too.
            vlm_parallelism: {type: integer, minimum: 1}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [name, input, output, preflight_id, episodes, modules]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: string}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    TaskBatchCreate:
      type: object
      additionalProperties: false
      required: [items, shared]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, input, output, preflight_id]
            properties:
              name: {type: string, minLength: 1, maxLength: 128}
              input: {$ref: "#/components/schemas/InputSpec"}
              output: {$ref: "#/components/schemas/OutputRef"}
              preflight_id: {type: string}
        shared:
          type: object
          additionalProperties: false
          required: [episodes, modules]
          properties:
            note: {type: string, maxLength: 2000}
            episodes: {$ref: "#/components/schemas/EpisodeSelector"}
            modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
            embodiment_id: {type: string}
            vlm: {$ref: "#/components/schemas/VlmChoice"}
            params: {$ref: "#/components/schemas/TaskParams"}
    TaskCreated:
      type: object
      additionalProperties: false
      required: [id, state, created_at, warnings, links]
      properties:
        id: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
        warnings: {type: array, items: {type: string}}
        links: {$ref: "#/components/schemas/Links"}
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: after start only name and note are accepted
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: [string, "null"]}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    StageProgress:
      type: object
      additionalProperties: false
      required: [id, state, done, total]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "two-block plans: integrity, numeric, frame, dedup, autolabel, vlm, profile, final; funnel plans (tasks made before): also verdict and profile_vlm; then report, export, verify; subtasks add adjudicate; new modules may add stages"}
        block: {enum: [cpu, vlm], description: "the block the stage belongs to (two-block plans, design doc 17 §3); absent on funnel plans and on the steps after both blocks"}
        full_set: {type: boolean, description: "a full-set stage: it starts once the earlier stages of its block are done (dedup, profile)"}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped]}
        done: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        eta_s: {type: [number, "null"]}
        note: {type: string, description: "e.g. why total dropped from 50 to 49"}
        pipeline: {$ref: "#/components/schemas/PipelineActivity"}
    PipelineActivity:
      type: object
      additionalProperties: false
      required: [inflight, queued, capacity, dispatches, recent, started_at, finished_at, updated_at]
      description: Current invocation of the persistent funnel. Inflight counts admitted episodes awaiting durable completion, including worker setup. Dispatches are layer-local arrivals, not a barrier shared across layers.
      properties:
        inflight: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        capacity: {type: integer, minimum: 1}
        dispatches: {type: integer, minimum: 0}
        started_at: {type: [integer, "null"], description: Epoch milliseconds}
        finished_at: {type: [integer, "null"], description: Epoch milliseconds}
        updated_at: {type: integer, description: Epoch milliseconds of this snapshot}
        processing:
          type: object
          additionalProperties: false
          required: [count, total_s, mean_s, min_s, max_s]
          description: Per-episode processing durations; excludes dispatch and CPU admission waits. Shared module execution is counted once per episode in this layer.
          properties:
            count: {type: integer, minimum: 0}
            total_s: {type: number, minimum: 0}
            mean_s: {type: [number, "null"]}
            min_s: {type: [number, "null"]}
            max_s: {type: [number, "null"]}
        busy:
          type: array
          maxItems: 64
          description: >-
            Spans (epoch milliseconds) during which this layer had episodes out, oldest first; the
            last one is open (end null) while episodes are out now. Between started_at and
            finished_at (or now) the rest is waiting. Past 64 spans the two separated by the
            shortest wait are merged.
          items:
            type: object
            additionalProperties: false
            required: [start, end]
            properties:
              start: {type: integer}
              end: {type: [integer, "null"]}
        held_by_downstream:
          type: boolean
          description: >-
            The layer has episodes waiting to enter but hands none out because the next layer's
            queue is full (it holds at most max(2 x batch size, that layer's width)).
        recent:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [number, count, episodes, at]
            properties:
              number: {type: integer, minimum: 1}
              count: {type: integer, minimum: 1}
              episodes: {type: array, maxItems: 16, items: {type: integer, minimum: 0}, description: First 16 episode indices of this dispatch}
              at: {type: integer, description: Epoch milliseconds of dispatch}
    ModuleState:
      type: object
      additionalProperties: false
      required: [id, name, selected, availability, state, episodes_total, episodes_error]
      properties:
        id: {$ref: "#/components/schemas/ModuleId"}
        name: {type: string}
        selected: {type: boolean}
        availability: {enum: [available, needs_input, unsupported]}
        unavailable_reason: {type: [string, "null"]}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped, stale]}
        episodes_total: {type: integer, minimum: 0}
        episodes_error: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        error: {type: [string, "null"]}
    Summary:
      type: object
      additionalProperties: false
      required: [total, passed, rejected, held, review, pass_rate]
      properties:
        total: {type: integer, minimum: 0}
        passed: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        held: {type: integer, minimum: 0}
        review: {type: integer, minimum: 0}
        pass_rate: {type: [number, "null"]}
        skipped:
          type: integer
          minimum: 0
          description: >-
            episodes left out because source files are missing (D40, as v1 does): not checked, in
            none of the lists and not part of total; the report lists them
    UsageTotals:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, name, state, dataset, created_at, progress, summary, pending_adjudication, delivery_stale, modules,
                 module_counts, usage]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        dataset: {type: string}
        dataset_id: {type: [string, "null"]}
        created_at: {type: integer}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        pending_adjudication: {type: integer, minimum: 0}
        delivery_stale: {type: boolean}
        active_subtask: {type: [string, "null"]}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}, description: "selected modules, registry order"}
        module_counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: "selected modules per ModuleState state"}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        deleted_at: {type: [integer, "null"]}
    Task:
      type: object
      additionalProperties: false
      required: [id, name, state, input, output, episodes, modules, params, progress, result_rev,
                 pending_adjudication, delivery_stale, usage, created_at, updated_at, links]
      properties:
        id: {type: string}
        name: {type: string}
        note: {type: [string, "null"]}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null]}
        input: {$ref: "#/components/schemas/InputRef"}
        dataset_id: {type: [string, "null"], description: "the registered dataset (D36)"}
        output: {$ref: "#/components/schemas/OutputRef"}
        run_id: {type: [string, "null"]}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        embodiment_id: {type: [string, "null"]}
        vlm:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskVlm"
        params: {$ref: "#/components/schemas/TaskParams"}
        source:
          type: [object, "null"]
          description: source manifest summary frozen at start (D27)
          properties:
            objects: {type: integer}
            bytes: {type: integer}
            digest: {type: string}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleState"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        result_rev: {type: integer, minimum: 0}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        pending_adjudication: {type: integer, minimum: 0}
        delivery_stale: {type: boolean}
        active_subtask: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Subtask"}]}
        created_at: {type: integer}
        updated_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        deleted_at: {type: [integer, "null"]}
        links: {$ref: "#/components/schemas/Links"}
    Subtask:
      type: object
      additionalProperties: false
      required: [id, task_id, kind, scope, state, created_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        kind: {enum: [retry, resume, apply_adjudication, reexport]}
        scope:
          type: object
          properties:
            modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
            episodes: {enum: [errors, all]}
            relabel_rerun: {enum: [v1, full], description: "apply_adjudication only (D39)"}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null], description: "only while pausing or paused"}
        progress: {type: [object, "null"]}
        created_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        result_rev: {type: [integer, "null"], description: "the revision this subtask produced"}
    SubtaskCreated:
      type: object
      additionalProperties: false
      required: [subtask, links]
      properties:
        subtask: {$ref: "#/components/schemas/Subtask"}
        links: {$ref: "#/components/schemas/Links"}
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind, text]
      properties:
        at: {type: integer}
        kind: {enum: [created, started, system_pause, system_resume, user_pause, user_resume, stopped, failed,
                      finished, subtask_started, subtask_finished, revision]}
        subtask_id: {type: [string, "null"]}
        revision: {type: [integer, "null"]}
        state: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/TaskState"}]}
        text: {type: string}
    LogLine:
      type: object
      additionalProperties: false
      required: [ts, stage, level, msg]
      properties:
        ts: {type: integer}
        stage: {type: string}
        subtask_id: {type: [string, "null"]}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
        episode_index: {type: [integer, "null"]}
    UsageRow:
      type: object
      additionalProperties: false
      required: [subtask_id, module_id, call_kind, model_name, prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        subtask_id: {type: string, description: "empty = main run"}
        module_id: {type: string}
        call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
        model_name: {type: string}
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    UsageReport:
      type: object
      additionalProperties: false
      required: [totals, actual, attributed]
      description: totals sum the actual ledger only; attributed splits merged requests across modules and must never be added to it
      properties:
        totals: {$ref: "#/components/schemas/UsageTotals"}
        actual: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}
        attributed: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}

    # ---------- report
    PipelineEpisode:
      type: object
      additionalProperties: false
      required: [episode_index, reason, verdict, verdict_reason]
      properties:
        episode_index: {type: integer, minimum: 0}
        last_stage: {enum: [integrity, numeric, frame, vlm], description: "a funnel run (tasks made before 2.2.0): the last stage it went through"}
        next_stage: {enum: [numeric, frame, vlm, done], description: "a funnel run: where it goes next"}
        reason: {type: [string, "null"], description: "missing: left out, its source files are gone (D40); a funnel run's gate: stopped there"}
        verdict: {type: [string, "null"], enum: [keep, drop, held, null]}
        verdict_reason: {type: [string, "null"]}
        stages:
          type: object
          description: >-
            two-block runs (design doc 17 §5.5): every per-episode stage of both blocks - done (or error, when one
            of its modules failed on the episode), running, or waiting
          propertyNames: {pattern: "^[a-z][a-z0-9_]*$"}
          additionalProperties: {enum: [waiting, running, done, error]}
        provisional:
          type: boolean
          description: >-
            the verdict is the policy applied to the findings so far, not the final one (two-block
            pipelines: the final verdict is only given by aggregate)
        processing_s: {type: [number, "null"], description: Sum of completed layer processing times for this episode; excludes queue and CPU admission waits}
        stage_processing_s:
          type: object
          additionalProperties: false
          properties:
            integrity: {type: number, minimum: 0}
            numeric: {type: number, minimum: 0}
            frame: {type: number, minimum: 0}
            vlm: {type: number, minimum: 0}
        modules:
          type: object
          description: Present on the single-episode endpoint
          additionalProperties: {$ref: "./cli/result-record.schema.json"}
    EpisodeView:
      type: object
      additionalProperties: false
      required: [episode_index, revision, list, modules, videos]
      properties:
        episode_index: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        list: {enum: [passed, reject, held]}
        reasons: {type: array, items: {$ref: "#/components/schemas/EpisodeNote"}, description: "why it is in its list"}
        review:
          type: array
          items: {$ref: "#/components/schemas/EpisodeNote"}
          description: >-
            what a person is asked about it, questions of the adjudication page first; the
            abstentions of other modules follow (shown, never queued)
        task_text:
          type: object
          properties:
            text: {type: string}
            source: {type: string}
        modules:
          type: object
          description: module id -> result record (cli/result-record.schema.json)
          additionalProperties: {$ref: "./cli/result-record.schema.json"}
        evidence:
          type: array
          items:
            type: object
            required: [module, path]
            properties:
              module: {type: string}
              path: {type: string, description: "sign with scope=delivery"}
              kind: {type: string}
        videos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [camera, scope, path]
            properties:
              camera: {type: string}
              scope: {enum: [delivery, input]}
              origin: {enum: [clip, delivery_dataset, source_dataset]}
              path: {type: string}
              from_ts: {type: number}
              to_ts: {type: number}
        findings:
          type: array
          items: {$ref: "#/components/schemas/EpisodeFinding"}
          description: >-
            findings revisions (C2 2.0, 2.3.0): every finding of the episode, every module, with the
            level it has in this revision (its list entry's: the task's policy after the applied human
            decisions)
        fps:
          type: [number, "null"]
          description: >-
            2.4.0: the dataset's fps from the task's preflight, to read a finding's frames as seconds;
            null for mcap (its checks run at each episode's action rate: getTaskEpisodeViz check_clock)
        dataset_id:
          type: [string, "null"]
          description: 2.4.0, the task's registration while it exists (the mini player's 在可视化页打开)
    EpisodeFinding:
      type: object
      additionalProperties: false
      required: [module, level, appealable, finding]
      properties:
        module: {$ref: "#/components/schemas/ModuleId"}
        level: {$ref: "#/components/schemas/FindingLevel"}
        line: {$ref: "#/components/schemas/ReviewLineId", description: "review: the line it is asked on"}
        appealable: {type: boolean, description: "a reject it causes may be appealed (D42)"}
        human: {type: boolean, description: "a person's conclusion (adjudication), not a module's finding"}
        finding: {$ref: "./cli/common.schema.json#/$defs/finding"}
    TaskEpisode:
      type: object
      additionalProperties: false
      required: [episode_index, list, review, reason_modules, review_modules]
      properties:
        episode_index: {type: integer, minimum: 0}
        list: {enum: [passed, reject, held]}
        review: {type: boolean, description: "a person still has to answer something about it (see listTaskEpisodes)"}
        reason_modules:
          type: array
          items: {$ref: "#/components/schemas/ModuleId"}
          description: the modules that put it in its list - the deciding modules of a reject, the failed modules of a held one, none when passed
        review_modules:
          type: array
          items: {$ref: "#/components/schemas/ModuleId"}
          description: the source modules of the open questions
        items:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyItemId"}
          description: findings revisions (C2 2.0) only - the taxonomy items of its findings, every module together, in taxonomy order
        levels:
          type: array
          items: {$ref: "#/components/schemas/FindingLevel"}
          description: findings revisions (C2 2.0) only - the levels its findings have (the task's policy after the applied human decisions), blocking first
    TaskEpisodePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more, total, counts, revision]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskEpisode"}}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
        total: {type: integer, minimum: 0, description: "episodes matching the filters"}
        counts:
          type: object
          additionalProperties: false
          required: [all, passed, reject, held, review]
          description: the whole revision, filters ignored
          properties:
            all: {type: integer, minimum: 0}
            passed: {type: integer, minimum: 0}
            reject: {type: integer, minimum: 0}
            held: {type: integer, minimum: 0}
            review: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
    SyncCurves:
      type: object
      additionalProperties: false
      required: [episode_index, revision, verdict, lag_tol_s, window_s, cameras]
      properties:
        episode_index: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        verdict: {type: [string, "null"], description: "the episode-level reading: aligned, annotated, undecidable, misaligned_all"}
        consensus_lag_s: {type: [number, "null"], description: "the lag every trusted camera agrees on, when they do"}
        lag_tol_s: {type: number, description: "readings within +/- this are aligned (the green band)"}
        window_s: {type: number, description: "the cross-correlation is drawn for lags within +/- this"}
        cameras: {type: array, items: {$ref: "#/components/schemas/SyncCurveCamera"}}
    SyncCurveCamera:
      type: object
      additionalProperties: false
      required: [camera, t, flow, speed, lags, xcorr, peak]
      properties:
        camera: {type: string}
        t: {type: array, items: {type: [number, "null"]}, description: "seconds from the episode start"}
        flow: {type: array, items: {type: [number, "null"]}, description: "picture motion (optical-flow energy) at t"}
        speed: {type: array, items: {type: [number, "null"]}, description: "arm motion (joint speed) at t"}
        lags: {type: array, items: {type: [number, "null"]}, description: "seconds; > 0 = the picture is later than the motion"}
        xcorr: {type: array, items: {type: [number, "null"]}, description: "cross-correlation at each lag"}
        lag_s: {type: [number, "null"], description: "the check's reading"}
        corr_peak: {type: [number, "null"]}
        code: {type: [string, "null"], description: "aligned, misaligned, ambiguous_peak, flat_peak, low_corr, no_motion"}
        trusted: {type: [boolean, "null"]}
        peak:
          description: the reading on the drawn curve; null when there is none or it lies outside the window
          oneOf:
            - {type: "null"}
            - type: object
              additionalProperties: false
              required: [lag_s, corr]
              properties:
                lag_s: {type: number}
                corr: {type: number}
    EpisodeNote:
      type: object
      additionalProperties: false
      required: [module, text]
      description: >-
        one line of an episode's reasons or review, shaped like C2 final-list reasons: kind is a reason kind of C2 final-list
        (2.0: finding, human, execution_error, duplicate; 1.0: hard_gate, soft_score, duplicate, human, execution_error) or a
        review kind; a 2.0 reason names its finding code, the code's taxonomy item and whether it may be appealed
      properties:
        module: {$ref: "#/components/schemas/ModuleId"}
        kind: {type: string}
        text: {type: string}
        priority: {type: string}
        duplicate_of: {type: integer, minimum: 0}
        code: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "2.0: the finding code (registry 2.x)"}
        item: {type: [string, "null"], description: "2.0: the taxonomy item of the code (C6), null for a code without one"}
        appealable: {type: boolean, description: "2.0: the code may be appealed (D42)"}
    Perf:
      type: object
      additionalProperties: false
      required: [revision, scope, latency, stages]
      properties:
        revision: {type: integer, minimum: 1}
        scope: {enum: [all, main, subtask]}
        subtask_id: {type: [string, "null"]}
        backend: {type: object, description: "model service used (v1 perf_backend)"}
        container: {type: object, description: "CPU / memory quota (v1 perf_env)"}
        latency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [call_kind, count, p50_s, p90_s, p99_s, wall_s]
            properties:
              call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
              count: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              hedged: {type: integer, minimum: 0}
              p50_s: {type: number}
              p90_s: {type: number}
              p99_s: {type: number}
              wall_s: {type: number, description: "first sent to last returned - never count x mean"}
        effective_concurrency: {type: [number, "null"]}
        stages:
          type: array
          items:
            type: object
            required: [id, wall_s]
            properties:
              id: {type: string}
              wall_s: {type: number}
              share: {type: number}
        retries:
          type: object
          properties:
            outer_attempts: {type: integer, minimum: 0}
            rescued: {type: integer, minimum: 0}
        merge:
          type: object
          properties:
            requests: {type: integer, minimum: 0}
            estimated_unmerged: {type: integer, minimum: 0}
        redone_after_interruption: {type: integer, minimum: 0, description: "D26"}
    AdjudicationQuestion:
      type: object
      additionalProperties: false
      required: [line, source_module, reason]
      properties:
        line: {$ref: "#/components/schemas/ReviewLineId"}
        source_module: {$ref: "#/components/schemas/ModuleId"}
        reason: {type: string}
        duplicate_of: {type: [integer, "null"], minimum: 0, description: "an appeal of a dedup reject: the episode it duplicates"}
        follow_up_of:
          oneOf: [{type: "null"}, {$ref: "#/components/schemas/ReviewLineId"}]
          description: >-
            set on a question the card gained as a follow-up of its answer on that line
            (registry follow_ups), absent or null on the card's own questions; a follow-up whose
            opening answer changed is left out of the card
        annotation: {type: [string, "null"]}
        caption: {type: [string, "null"]}
        suggestion: {type: [string, "null"], description: "suggested new label"}
        priority: {type: [string, "null"]}
        latest_decision: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Decision"}]}
        codes:
          type: array
          items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
          description: "findings revisions (2.3.0): the finding codes of the source module the question is about"
        items:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyItemId"}
          description: "findings revisions (2.3.0): their taxonomy items"
    AdjudicationCard:
      type: object
      additionalProperties: false
      required: [episode_index, status, questions]
      properties:
        episode_index: {type: integer, minimum: 0}
        status: {enum: [pending, decided, unsure, applied]}
        questions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AdjudicationQuestion"}}
    AdjudicationCounts:
      type: object
      additionalProperties: false
      description: >-
        All three count cards (episodes) over the whole task, not the filtered page. pending and
        decided cover the cards whose questions belong to lines with counts_as_pending - appeal
        candidates are optional and never pending; unapplied covers both tabs: cards with an
        answer that was not executed yet ('unsure' is not one). pending is what the task's
        pending_adjudication shows.
      required: [decided, pending, unapplied]
      properties:
        decided: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        unapplied: {type: integer, minimum: 0}
    DecisionFields:
      type: object
      required: [episode_index, line, decision]
      properties:
        episode_index: {type: integer, minimum: 0}
        line: {$ref: "#/components/schemas/ReviewLineId"}
        decision:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: >-
            one of the line's decisions in the registry, on a question the episode's card has or
            a follow-up the card's answer on another line opened (registry follow_ups); anything
            else is 400 validation_failed. Today: label - adopt_suggestion, custom_label,
            keep_label, unsure, discard; task_verdict - success, failure, unsure, discard;
            reject_appeal - restore, keep_rejected, unsure; eef_check - consistent, inconsistent, unsure; integrity_check - intact, broken, unsure
        new_label: {type: [string, "null"], description: "custom_label: required; adopt_suggestion: may be left out, the question's suggestion is taken"}
        note: {type: [string, "null"]}
    AdjudicationApply:
      type: object
      additionalProperties: false
      properties:
        relabel_rerun:
          enum: [v1, full]
          default: v1
          description: >-
            How task success is judged again for relabelled episodes that have no human task
            verdict (D39). v1: what v1's rejudge runs - multi-view scoring and the per-camera
            end-state vote only, no task-type step, camera hints, reject guard or evidence
            arbitration; verdicts and calls match v1. full: the first run's complete flow, so
            the same decisions may end differently from v1. Episodes a person judged success
            or failure are not judged again either way.
    DecisionInput:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
      unevaluatedProperties: false
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [id, decided_by, decided_at, applied]
          properties:
            id: {type: integer}
            decided_by: {type: string}
            decided_at: {type: integer}
            applied: {type: boolean}
      unevaluatedProperties: false

    # ---------- system
    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: {type: string}
        expires_at: {type: integer}
        from_ts: {type: number, description: "v3 sources: play url#t=from,to"}
        to_ts: {type: number}
    DatasetSignRequest:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        ttl: {type: integer, minimum: 60, maximum: 3600, default: 1800, description: seconds}
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/DatasetSignItem"}
    DatasetSignItem:
      description: >-
        One read to sign: `get` - an object by its full key in the bucket (no leading `/`);
        `list` - one ListObjectsV2 page under `prefix`, `continuation_token` being the previous
        page's `NextContinuationToken`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, key]
          properties:
            op: {const: get}
            key: {type: string, minLength: 1, maxLength: 1024}
        - type: object
          additionalProperties: false
          required: [op, prefix]
          properties:
            op: {const: list}
            prefix: {type: string, minLength: 1, maxLength: 1024}
            delimiter: {const: "/"}
            continuation_token: {type: string, minLength: 1, maxLength: 4096}
            max_keys: {type: integer, minimum: 1, maximum: 1000, default: 1000}
    DatasetSignResponse:
      type: object
      additionalProperties: false
      required: [expires_at, urls]
      properties:
        expires_at: {type: integer, description: "epoch milliseconds, as in SignedUrl"}
        urls:
          type: array
          description: one presigned URL per request, in the same order
          items: {type: string}
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {enum: [ok, not_ready]}
        checks:
          type: object
          additionalProperties: false
          required: [db_writable, master_key, workdir_writable, scratch_writable, reconciled]
          properties:
            db_writable: {type: boolean}
            master_key: {type: boolean}
            workdir_writable: {type: boolean}
            scratch_writable: {type: boolean}
            reconciled: {type: boolean}
    SseState:
      type: object
      required: [state, at]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        subtask_id: {type: [string, "null"], description: "set when the change is a subtask's"}
        reason: {type: [string, "null"], description: "state_reason, Chinese"}
        at: {type: integer}
    SseProgress:
      $ref: "#/components/schemas/StageProgress"
    SseLog:
      type: object
      required: [stage, level, msg]
      properties:
        stage: {type: string}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
    SseUsage:
      $ref: "#/components/schemas/UsageTotals"
    SseDone:
      type: object
      required: [state]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        failed_modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
        subtask_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
    # ---------- the data visualizer (design doc 18, 2.4.0)
    VizStatus:
      type: object
      additionalProperties: false
      required: [state, reason]
      description: whether the visualizer can open the dataset
      properties:
        state:
          enum: [ready, mapping_pending, unsupported]
          description: "mapping_pending: an mcap dataset whose field mapping is not confirmed (映射待确认)"
        reason: {type: [string, "null"], description: "why not, in Chinese"}
    VizFormat:
      type: object
      additionalProperties: false
      required: [kind, version, reader]
      properties:
        kind: {enum: [lerobot, mcap, lance, lancedb, rrd, unknown]}
        version: {enum: [v2, v3, null]}
        reader: {enum: [lerobot, mcap, null], description: "the reader serving it; null = none in this phase (lance: phase two, design doc 18 §10)"}
    VizAccess:
      enum: [direct, local, remux, frames, transcode, unsupported]
      description: |
        How a camera reaches the browser (design doc 18 §4.2, D60). direct: a presigned (or the
        public bucket's) TOS URL; local: the Daemon serves the file of a local dataset; remux: the
        Daemon rewraps the stream into fragmented mp4 without re-encoding; frames: a JPEG frame pack
        drawn on a canvas; transcode: the Daemon re-encodes to H.264 (CURATOR_VIZ_TRANSCODE, the
        player tags it 平台转码); unsupported: cannot be shown, `reason` says why.
    VizCameraKey:
      type: string
      pattern: "^[0-9A-Za-z_-]{1,96}$"
      description: URL-safe camera key (LeRobot short name; mcap topic with / turned into _)
    VizCamera:
      type: object
      additionalProperties: false
      required: [key, name, source, kind, access, codec, codec_string, width, height, fps, transcoded, reason]
      properties:
        key: {$ref: "#/components/schemas/VizCameraKey"}
        name: {type: string}
        source: {type: string, description: "the LeRobot feature key or the mcap topic"}
        kind: {enum: [video, frames], description: "video: an mp4 for <video>; frames: a JPEG frame pack"}
        access: {$ref: "#/components/schemas/VizAccess"}
        codec: {type: [string, "null"], description: "av1, h264, hevc, mpeg4, jpeg, png, raw ..."}
        codec_string: {type: [string, "null"], description: "RFC 6381 codecs parameter for the player's decoding check (av01..., avc1..., hvc1...)"}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        fps: {type: [number, "null"]}
        pix_fmt: {type: [string, "null"]}
        transcoded: {type: boolean, description: "the Daemon re-encodes it (access transcode)"}
        reason: {type: [string, "null"], description: "why transcode or unsupported, in Chinese"}
    VizLine:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: {type: string}
        role: {enum: [state, action, other], description: "state solid, action dashed"}
        source: {type: string, description: "the feature key or topic"}
        dim: {type: [integer, "null"], description: "its position in the source's vector"}
        unit: {type: [string, "null"]}
    VizStream:
      type: object
      additionalProperties: false
      required: [key, kind, name, unit, lines, smart, available, reason, sources]
      properties:
        key: {type: string, pattern: "^[0-9A-Za-z_.-]{1,128}$"}
        kind: {enum: [series, depth, pointcloud, transform, text, event, image_sequence]}
        name: {type: string}
        unit: {type: [string, "null"]}
        lines: {type: array, items: {$ref: "#/components/schemas/VizLine"}, description: "series: one per drawn number, state and action of the same name together"}
        smart: {type: boolean, description: "placed by the smart layout"}
        available: {type: boolean, description: "false: listed (field tree, + menu) but not drawable in this phase"}
        reason: {type: [string, "null"]}
        sources: {type: array, items: {type: string}, description: "feature keys or topics it is read from"}
        rate_hz: {type: [number, "null"]}
    VizAnnotationSource:
      type: object
      additionalProperties: false
      required: [key, kind, name, format, source, supported, reason, primary]
      properties:
        key: {type: string, pattern: "^[0-9A-Za-z_.:-]{1,96}$"}
        kind: {enum: [segments, events, labels]}
        name: {type: string, description: "the track's name (子任务, 机器人分步, 外部标注 ...)"}
        format:
          type: string
          description: >-
            the recognised layout (design doc 18 §4.5): subtask_index, language_persistent,
            language_events, task_index, index_table, string_column, bool_segments, quality,
            episode_labels, argus, mcap_topic, mcap_attachment; open for later readers
        source: {type: string, description: "where it is read from, shown as 来源"}
        supported: {type: boolean, description: "false: something looks like annotations but its layout is unknown (标注格式不支持)"}
        reason: {type: [string, "null"]}
        primary: {type: boolean, description: "the track the subtitle bar shows first"}
    VizFieldNode:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [group, camera, series, depth, text, table, file, topic, metadata, attachment, other]}
        dtype: {type: [string, "null"]}
        shape: {type: [array, "null"], items: {type: integer}}
        names: {type: [array, "null"], items: {type: string}}
        detail:
          type: object
          description: attributes shown in the detail pane
          additionalProperties: {type: [string, number, boolean, "null"]}
        camera: {$ref: "#/components/schemas/VizCameraKey"}
        stream: {type: string, description: "the VizStream it is drawn as"}
        file: {type: string, description: "a metadata file getDatasetVizMeta can read"}
        children: {type: array, items: {$ref: "#/components/schemas/VizFieldNode"}}
    VizMappingState:
      type: object
      additionalProperties: false
      required: [state, version, name]
      properties:
        state:
          enum: [not_needed, none, confirmed, frozen]
          description: "not_needed: not mcap; none: an mcap dataset without a confirmed mapping; frozen: a task's (run.json)"
        version: {type: [integer, "null"], minimum: 1}
        name: {type: [string, "null"]}
    VizWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, description: "Chinese"}
    VizDataset:
      type: object
      additionalProperties: false
      required: [scope, id, dataset_id, name, format, fps, episode_count, episode_indices, total_frames,
                 robot_type, cameras, streams, annotation_sources, field_tree, mapping, transcode, warnings, fingerprint]
      properties:
        scope: {enum: [dataset, task]}
        id: {type: string, description: "the dataset id, or the task id for scope task"}
        dataset_id: {type: [string, "null"], description: "the registration; for scope task the task's, while it exists"}
        name: {type: string}
        format: {$ref: "#/components/schemas/VizFormat"}
        fps: {type: [number, "null"], description: "null for mcap: every topic keeps its own rate"}
        episode_count: {type: integer, minimum: 0}
        episode_indices: {type: [string, "null"], description: "every index in the grammar of --episodes when they are not 0 .. count-1"}
        total_frames: {type: [integer, "null"]}
        robot_type: {type: [string, "null"]}
        bytes: {type: [integer, "null"]}
        cameras: {type: array, items: {$ref: "#/components/schemas/VizCamera"}}
        streams: {type: array, items: {$ref: "#/components/schemas/VizStream"}}
        annotation_sources: {type: array, items: {$ref: "#/components/schemas/VizAnnotationSource"}}
        field_tree: {type: array, items: {$ref: "#/components/schemas/VizFieldNode"}}
        mapping: {$ref: "#/components/schemas/VizMappingState"}
        transcode:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: {type: boolean, description: "CURATOR_VIZ_TRANSCODE"}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
        fingerprint: {type: string, description: "the metadata fingerprint the model and its caches belong to"}
    VizEpisodeItem:
      type: object
      additionalProperties: false
      required: [index, duration_s, frames, task]
      properties:
        index: {type: integer, minimum: 0}
        duration_s: {type: [number, "null"]}
        frames: {type: [integer, "null"]}
        task: {type: string, description: "empty when there is none"}
        steps:
          type: [array, "null"]
          description: the primary track's segments when the episode table has them (not read from the frames)
          items:
            type: object
            additionalProperties: false
            required: [start_s, end_s]
            properties:
              start_s: {type: number}
              end_s: {type: number}
              unqualified: {type: boolean}
    VizEpisodePage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [total]
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/VizEpisodeItem"}}
            total: {type: integer, minimum: 0, description: "matches of the filter"}
    VizTimeline:
      type: object
      additionalProperties: false
      required: [kind, fps, frame_reference, frame_times]
      properties:
        kind: {enum: [frame, timestamp], description: "frame: frame = round(t x fps); timestamp: frame k sits at frame_times[k]"}
        fps: {type: [number, "null"]}
        frame_reference: {type: [string, "null"], description: "mcap: the topic whose messages number the frames"}
        frame_times: {type: [array, "null"], items: {type: number}, description: "mcap: the episode time of every frame"}
    VizCheckClock:
      type: object
      additionalProperties: false
      required: [offset_s, fps]
      description: "the checks' clock on the episode clock (task scope): t = offset_s + time_s, t = offset_s + frame / fps"
      properties:
        offset_s: {type: number}
        fps: {type: [number, "null"]}
    VizEpisodeCamera:
      type: object
      additionalProperties: false
      required: [key, kind, access, url, index_url, transcode_url, from_ts, to_ts, offset_s, transcoded, expires_at, reason]
      properties:
        key: {$ref: "#/components/schemas/VizCameraKey"}
        kind: {enum: [video, frames]}
        access: {$ref: "#/components/schemas/VizAccess"}
        url: {type: [string, "null"], description: "video: what <video> plays; frames: the frame pack; null when unsupported"}
        index_url: {type: [string, "null"], description: "frames: the frame pack's index"}
        transcode_url: {type: [string, "null"], description: "the H.264 transcode to fall back to when the browser cannot decode url; null when transcoding is off or url already is one"}
        from_ts: {type: [number, "null"], description: "LeRobot v3: where the episode starts in the file (play url#t=from_ts,to_ts)"}
        to_ts: {type: [number, "null"]}
        offset_s: {type: number, description: "episode time of the camera's first frame (video time 0 after from_ts)"}
        transcoded: {type: boolean}
        expires_at: {type: [integer, "null"], description: "epoch ms when a presigned url stops working"}
        reason: {type: [string, "null"]}
    VizSegment:
      type: object
      additionalProperties: false
      required: [start_s, end_s, label]
      properties:
        start_s: {type: number}
        end_s: {type: number}
        label: {type: string}
        quality: {enum: [qualified, unqualified, null]}
        contribution: {type: [string, "null"], description: "Argus: advancing / wasteful / idle"}
        arm: {type: [string, "null"]}
        flags: {type: array, items: {type: string}, description: "boolean segment columns that hold (is_intervention_segment ...)"}
    VizTrack:
      type: object
      additionalProperties: false
      required: [key, name, source, primary, segments]
      properties:
        key: {type: string}
        name: {type: string}
        source: {type: string}
        primary: {type: boolean}
        segments: {type: array, items: {$ref: "#/components/schemas/VizSegment"}}
    VizEvent:
      type: object
      additionalProperties: false
      required: [t_s, label, source]
      properties:
        t_s: {type: number}
        label: {type: string}
        outcome: {type: [string, "null"]}
        source: {type: string}
    VizLabel:
      type: object
      additionalProperties: false
      required: [key, name, value, source]
      properties:
        key: {type: string}
        name: {type: string}
        value: {type: string}
        source: {type: string}
    VizAnnotations:
      type: object
      additionalProperties: false
      required: [tracks, events, labels, warnings]
      properties:
        tracks: {type: array, items: {$ref: "#/components/schemas/VizTrack"}}
        events: {type: array, items: {$ref: "#/components/schemas/VizEvent"}}
        labels: {type: array, items: {$ref: "#/components/schemas/VizLabel"}, description: "episode labels: success, rating, task_status ..."}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizEpisode:
      type: object
      additionalProperties: false
      required: [scope, id, index, duration_s, frames, fps, task, timeline, cameras, annotations, check_clock, warnings]
      properties:
        scope: {enum: [dataset, task]}
        id: {type: string}
        index: {type: integer, minimum: 0}
        duration_s: {type: number, minimum: 0}
        frames: {type: integer, minimum: 0}
        fps: {type: [number, "null"]}
        task:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [text, source]
              properties:
                text: {type: string}
                source: {type: string, description: "原始标注 / 人工改标 / 自产描述"}
        timeline: {$ref: "#/components/schemas/VizTimeline"}
        cameras: {type: array, items: {$ref: "#/components/schemas/VizEpisodeCamera"}}
        annotations: {$ref: "#/components/schemas/VizAnnotations"}
        check_clock:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizCheckClock"
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizSeries:
      type: object
      additionalProperties: false
      required: [stream, unit, from_s, to_s, t, lines, total_points, downsampled]
      properties:
        stream: {type: string}
        unit: {type: [string, "null"]}
        from_s: {type: number}
        to_s: {type: number}
        t: {type: array, items: {type: number}, description: "episode seconds, shared by every line"}
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, role, values]
            properties:
              name: {type: string}
              role: {enum: [state, action, other]}
              values: {type: array, items: {type: [number, "null"]}}
        total_points: {type: integer, minimum: 0, description: "raw samples in the window"}
        downsampled: {type: boolean}
    VizFrameIndex:
      type: object
      additionalProperties: false
      required: [camera, codec, width, height, count, t, offset, size, bytes]
      properties:
        camera: {$ref: "#/components/schemas/VizCameraKey"}
        codec: {enum: [jpeg, png]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        count: {type: integer, minimum: 0}
        t: {type: array, items: {type: number}, description: "episode seconds of every frame"}
        offset: {type: array, items: {type: integer}, description: "byte offset of every frame in the pack"}
        size: {type: array, items: {type: integer}}
        bytes: {type: integer, minimum: 0, description: "the pack's size"}
    VizMediaPending:
      type: object
      additionalProperties: false
      required: [state, progress, message]
      properties:
        state: {enum: [pending, failed]}
        progress: {type: [number, "null"], minimum: 0, maximum: 1}
        message: {type: string}
    VizMetaFile:
      type: object
      additionalProperties: false
      required: [path, size, truncated, kind, text]
      properties:
        path: {type: string}
        size: {type: integer, minimum: 0}
        truncated: {type: boolean}
        kind: {enum: [json, jsonl, text, markdown]}
        text: {type: string}
    VizMapping:
      $ref: "./viz-mapping.schema.json"
    DatasetMapping:
      type: object
      additionalProperties: false
      required: [dataset_id, state, mapping, version, updated_at, check_mapping, warnings]
      properties:
        dataset_id: {type: string}
        state: {enum: [none, confirmed]}
        mapping:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizMapping"
        version: {type: integer, minimum: 0, description: "0 = never confirmed"}
        updated_at: {type: [integer, "null"]}
        check_mapping:
          type: [object, "null"]
          description: the check reader's ingest.mcap_mapping derived from it (read-only, design doc 18 §6.2)
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    DatasetMappingPut:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping: {$ref: "#/components/schemas/VizMapping"}
    DatasetMappingInfo:
      type: object
      additionalProperties: false
      required: [state, version, updated_at, name]
      properties:
        state: {enum: [none, confirmed]}
        version: {type: integer, minimum: 0}
        updated_at: {type: [integer, "null"]}
        name: {type: [string, "null"]}
    DatasetAnnotationsInfo:
      type: object
      additionalProperties: false
      required: [upload_id, name, format, episodes, uploaded_at]
      properties:
        upload_id: {$ref: "#/components/schemas/UploadId"}
        name: {type: string}
        format: {type: string, description: "argus"}
        episodes: {type: integer, minimum: 0}
        uploaded_at: {type: integer}
    DatasetAnnotationsPut:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UploadId"
    McapProbeRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputSpec"}
        file: {type: string, minLength: 1, maxLength: 512, description: "an episode file to probe instead of the first"}
        template: {$ref: "#/components/schemas/VizTemplateId"}
    McapTopic:
      type: object
      additionalProperties: false
      required: [topic, schema, schema_encoding, message_encoding, count, rate_hz, start_s, end_s, image, fields, use, role, name, notes]
      properties:
        topic: {type: string}
        schema: {type: [string, "null"]}
        schema_encoding: {type: [string, "null"]}
        message_encoding: {type: [string, "null"]}
        count: {type: [integer, "null"]}
        rate_hz: {type: [number, "null"]}
        start_s: {type: [number, "null"], description: "first message, seconds after the file's first message"}
        end_s: {type: [number, "null"]}
        image:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [codec, width, height]
              properties:
                codec: {type: string}
                width: {type: [integer, "null"]}
                height: {type: [integer, "null"]}
        fields:
          type: [array, "null"]
          description: the numeric leaves of its first message
          items:
            type: object
            additionalProperties: false
            required: [path, size]
            properties:
              path: {type: string}
              size: {type: integer, minimum: 1}
        use: {enum: [camera, series, task, segments, ignore, unmapped], description: "what the draft does with it"}
        role: {enum: [state, action, other, null]}
        name: {type: string}
        notes: {type: array, items: {type: string}, description: "Chinese: high rate, unsupported encoding ..."}
    McapProbe:
      type: object
      additionalProperties: false
      required: [file, files, topics, metadata, attachments, draft, matched, warnings]
      properties:
        file: {type: string}
        files: {type: integer, minimum: 0, description: "episode files in the dataset"}
        topics: {type: array, items: {$ref: "#/components/schemas/McapTopic"}}
        metadata:
          type: object
          description: metadata records, by name, then key
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, media_type, size]
            properties:
              name: {type: string}
              media_type: {type: string}
              size: {type: integer, minimum: 0}
        draft: {$ref: "#/components/schemas/VizMapping"}
        matched:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [template_id, name, coverage]
              properties:
                template_id: {$ref: "#/components/schemas/VizTemplateId"}
                name: {type: string}
                coverage: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizTemplateId:
      type: string
      pattern: "^(builtin:[a-z0-9]+|vt-[a-z]{9})$"
    VizTemplate:
      type: object
      additionalProperties: false
      required: [id, name, description, builtin, mapping, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/VizTemplateId"}
        name: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        mapping:
          description: null for the built-ins, which are rules applied to a probe (design doc 18 §6.3), not a fixed mapping
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizMapping"
        created_at: {type: [integer, "null"]}
        updated_at: {type: [integer, "null"]}
    VizTemplateCreate:
      type: object
      additionalProperties: false
      required: [name, mapping]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2000}
        mapping: {$ref: "#/components/schemas/VizMapping"}
