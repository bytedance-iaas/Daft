  # ---------------------------------------------------------------- system
  /media/sign:
    get:
      tags: [system]
      operationId: signMedia
      summary: A presigned TOS URL for a video or evidence frame (D16); browsers fetch it directly
      parameters:
        - name: task
          in: query
          required: true
          schema: {type: string}
        - name: scope
          in: query
          required: true
          description: delivery (output key) or input (input key; the public cache bucket is not signed)
          schema: {enum: [delivery, input]}
        - name: path
          in: query
          required: true
          description: >-
            relative to the scope's prefix - scope=delivery: the task's run directory
            <delivery>/<run_id>/; scope=input: the dataset root - normalized and checked
            against it. Clip start and end times come from the episode endpoint.
          schema: {type: string}
        - name: ttl
          in: query
          schema: {type: integer, minimum: 60, maximum: 3600, default: 1800}
      responses:
        "200":
          description: signed URL (public endpoint)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedUrl"}
        default: {$ref: "#/components/responses/Error"}
  /events/tasks/{id}:
    servers:
      - url: "{base}"
        variables:
          base: {default: ""}
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [system]
      operationId: taskEvents
      summary: Server-sent events for one task (doc 03 §5)
      description: |
        Events: `state`, `progress`, `log`, `usage`, `done`, `reset`; data payloads are the
        Sse* schemas. Every event has `id: <epoch>-<seq>`. Reconnect with `Last-Event-ID`: same
        epoch and seq still buffered (last 200) resumes; otherwise the server sends `reset`
        and the client reloads GET /api/v1/tasks/{id}. usage and progress carry cumulative
        values. Progress is throttled to 2/s and logs to 20/s; the full log is in /logs.
        Clients must keep working without SSE by polling every 5 s.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: "^[0-9]+-[0-9]+$"}
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /healthz:
    servers:
      - url: "/"
      - url: "{base}"
        variables:
          base: {default: ""}
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness; no authentication, no dependency checks
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
