  # ---------------------------------------------------------------- uploads
  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Store the input file of a module parameter after validating it (registry 1.5)
      description: >-
        The body is the file itself, sent as JSON like every write: a trajectory.json as it is
        (kind eef_trajectory), or the seed rows as a JSON array (kind eef_observation_seeds; the
        console turns a .jsonl file into that array). Kind viz_annotations also takes a zip of
        per-episode JSON files named by episode index, sent as application/zip (still not a
        CORS-safelisted type, so cross-site writes stay refused). Up to 64 MiB. An invalid file is not stored:
        400 validation_failed with details.errors, each located as precisely as the file allows
        (field = JSON path, plus sample_id / episode_index / frame_index / camera_id / point_id).
        The dataset is not known yet, so media are checked when a task uses the file.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: kind
          in: query
          required: true
          schema: {$ref: "#/components/schemas/UploadKind"}
        - name: name
          in: query
          required: true
          description: the file name as picked (kept for display)
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: "the file content (see above)"}
          application/zip:
            schema: {type: string, format: binary, description: "viz_annotations only"}
      responses:
        "201":
          description: stored and validated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}
  /uploads/{upload_id}:
    get:
      tags: [uploads]
      operationId: getUpload
      summary: An upload's metadata and validation summary (the caller's own uploads only)
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/UploadId"}
      responses:
        "200":
          description: the upload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}

  /viz/mcap-probe:
    post:
      tags: [viz]
      operationId: probeMcap
      summary: Probe an mcap dataset and draft its mapping (design doc 18 §6.4) - before registering it or after
      description: |
        Reads the summary section of one episode file (the first, or `file`) and the first message
        of every topic with ranged reads: schema and encodings, rate, count, picture size and
        codec, numeric fields. The draft comes from `template` when given, else from the best
        matching template (site templates and the built-ins, coverage >= 80 %), else from
        builtin:foxglove / builtin:ros2 by the message encoding. A dataset whose files disagree on
        their topics gets a warning.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/McapProbeRequest"}
      responses:
        "200":
          description: the probe and the draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/McapProbe"}
        default: {$ref: "#/components/responses/Error"}
