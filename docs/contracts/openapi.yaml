openapi: 3.1.0
info:
  title: Curator v2 API
  version: 1.10.0
  description: |
    C4 of the frozen contracts (design doc 03). JSON in, JSON out, UTF-8.
    Every route lives under the mount prefix `{base}` (empty by default, `/curation` in
    production; the gateway does not strip it). Write operations are asynchronous: they
    return the resource and its state, progress arrives over SSE or polling.
    Errors use one body, `Error`; `code` is stable for machines, `message` is Chinese for people.
    `precheck_failed` (422, any write that starts work) carries `error.details` shaped as
    `PrecheckDetails`: one entry per pre-start check (D30).
    Responses that point people at a page carry `links` (D22): absolute URLs when
    `server.publicBaseUrl` is configured, otherwise relative paths with `absolute: false`.
    Write endpoints accept only `application/json` - send the header on every write, even without
    a body - and cross-site writes are refused; there is no CORS.
    Ids are opaque strings. Records made since 1.10.0 get `<prefix>-<9 lowercase letters>` (task,
    sub, ds, pf, cred, vb, vm, upl; e.g. `task-kqzmrtbwe`, D45); records made before keep their
    `<prefix>_...` id, and both work everywhere. Ids carry no time: lists sort by creation time.

    1.1.0 (2026-09-21): dataset registry (D36): `/datasets` now lists registered datasets and the
    TOS / cache-bucket listing moved to `/datasets/browse`; `/overview`; starting a task re-checks
    the dataset fingerprints and answers 409 `source_changed` with a `SourceChange`, after which
    `/tasks/{id}/repreflight` re-runs preflight (D37); the task list filters by `module` and
    `dataset_id` and lists the selected modules; request inputs may name a `dataset_id`;
    `dataset_in_use`. No client consumed 1.0.0.

    1.2.0 (2026-09-21): every write request carries `Content-Type: application/json`, a body or
    not, and `Idempotency-Key` is accepted on every write; `method_not_allowed`; `Task.vlm`
    has its own schema with `snapshot`; access-key names are null in responses once the key
    was deleted; SSE `state` and `done` carry `subtask_id` and `reason`; the log order and the
    `subtask` filter are spelled out; call kinds and stage ids are open like in C2/C3 1.1.

    1.3.0 (2026-09-21): `Idempotency-Key` is declared on every write; `Decision` and
    `DatasetDetail` validate (shared fields plus `unevaluatedProperties: false` instead of an
    allOf over a closed base); `precheck_failed` details (`PrecheckDetails`), probe error codes,
    the confirmation rule for deleting keys and backends that finished tasks used, the media
    signing prefix, optional session tokens on access keys, `Subtask.pause_reason`, `rel:
    dataset` links, dataset ids and the overview's counting rules are spelled out.

    1.4.0 (2026-09-21): applying an adjudication takes an optional `AdjudicationApply` body -
    `relabel_rerun` picks how relabelled episodes are judged again, v1's two layers by default
    or the first run's full flow (D39) - and the subtask's `scope` records the choice;
    `Summary.skipped` counts episodes left out because source files are missing (D40), which
    the report lists under `integrity.skipped_episodes`.

    1.5.0 (2026-09-21): review kinds are declared by the registry (D43): `ModuleRegistry`
    carries the `review_lines` catalog (id, title, the list its episodes are in, whether an
    open item counts as pending, the decisions with their titles) and every module its
    `review_lines` and `appealable`; adjudication `line` and `decision` are open strings the
    Daemon checks against that catalog. Rejects attributed to dedup may be appealed and a
    question can name `duplicate_of`; already-rejected episodes get no task-verdict question
    (D42). Appeal candidates never count as pending.

    1.5.1 (2026-09-22): v1's optional task verdict after a relabel is back as a catalog
    `follow_ups` entry (a card gains the question once its label answer adopts a new label;
    answered, the machine takes it and does not judge again); the `status` filter, the label an
    adopted suggestion gets without `new_label`, the episode view's `reasons` / `review` items
    and the 404 reasons of the result readers are spelled out.

    1.5.2 (2026-09-22): a question a card gained as a follow-up says so (`follow_up_of`), and
    a follow-up whose opening answer changed is left out of the card.

    1.6.0 (2026-09-22): a model may be the default one (`VlmModel.is_default`, set through
    `VlmModelPatch`): the new-task form starts with it instead of asking, and there is at most
    one per owner across all backends.

    1.7.0 (2026-09-23): the module registry 1.4 (design doc 12): every module says its
    `input_scope` (funnel / all_selected) and whether it `affects_dataset_verdict`; the need
    `eef_input` and a module id as `depends_on` (eef_video_review on eef_video_consistency).
    The two EEF-video consistency modules are advisory: they never change keep / drop / held.

    1.8.0 (2026-09-23): file parameters (registry 1.5). `POST /uploads` stores an input file of a
    module parameter after validating it (errors located to sample / frame / camera / point /
    JSON path) and returns an `Upload` whose `handle` (`upload:<upload_id>`) is the parameter's
    value in `TaskCreate.modules[].params`; `GET /uploads/{upload_id}` reads it back. Creating a
    task that selects a module needing `eef_input` preflights that module against the dataset with
    the uploaded file; the task's preflight snapshot carries that entry.

    1.10.0 (2026-09-23): new ids are `<prefix>-<9 lowercase letters>` (D45): the patterns of
    dataset ids, `UploadId` and upload handles take both formats. `GET /overview?days=7|30|90|365`
    picks the period of `recent`, which says its `bucket` (day / week / month) and `since`;
    `recent.tokens_per_bucket` (`start`, `label`, `tokens`) replaces `tokens_per_day`.
servers:
  - url: "{base}/api/v1"
    variables:
      base:
        default: ""
        description: mount prefix, e.g. /curation
security:
  - basicAuth: []
tags:
  - name: credentials
    description: TOS access keys (VLM API keys are stored with their backend)
  - name: vlm
    description: VLM backends and models
  - name: datasets
    description: modules, dataset registry and browsing, episodes, preflight, delivery probe
  - name: overview
    description: the overview page
  - name: tasks
    description: tasks and subtasks
  - name: report
    description: >-
      report, detail tables, episodes, performance, adjudication. They read a committed result
      revision; when its files are not on the Daemon's disk and cannot be fetched back from the
      delivery directory, the answer is 404 not_found with details.reason run_dir_missing or
      revision_missing.
  - name: system
    description: media signing, events, probes
  - name: uploads
    description: input files of module parameters (registry 1.5, format upload), validated on arrival

paths:
  # ---------------------------------------------------------------- credentials
  /credentials:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: List TOS access keys (never returns secrets)
      responses:
        "200":
          description: all access keys of the owner
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Credential"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [credentials]
      operationId: createCredential
      summary: Save an access key; verifies identity only (D30, doc 08 §4)
      description: |
        Saving never fails because verification failed: the key is stored and marked
        `failed` or `unverified`. Read and write permissions are checked against concrete
        buckets when a task starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [credentials]
      operationId: updateCredential
      summary: Update; a secret left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Delete (409 credential_in_use while a non-terminal task uses it)
      description: |
        Referenced only by finished tasks: requires `confirm=true`. Those tasks keep their
        reports, which then say the key is gone; rebind-credentials gives them another one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [credentials]
      operationId: verifyCredential
      summary: Verify identity again
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: verification result (also stored on the key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- vlm backends
  /vlm-backends:
    get:
      tags: [vlm]
      operationId: listVlmBackends
      summary: List backends with their models
      responses:
        "200":
          description: backends
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/VlmBackend"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [vlm]
      operationId: createVlmBackend
      summary: Add a backend with its API key; then try GET {endpoint}/models once (D8)
      description: Not listing any models is not an error; the user adds model IDs by hand.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [vlm]
      operationId: updateVlmBackend
      summary: Update; an API key left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [vlm]
      operationId: deleteVlmBackend
      summary: Delete with its models and key (409 backend_in_use while a non-terminal task uses it)
      description: |
        An unfinished task using it answers 409 in_use. When only finished (or deleted) tasks
        use it, the 409 carries `error.details.confirm_required: true`; repeating the call
        with `confirm=true` deletes it and those tasks lose the reference.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: verifyVlmBackend
      summary: Probe the endpoint (GET /models, else a minimal chat call)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/refresh-models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: refreshVlmModels
      summary: List models again; an empty result means "enter them by hand"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: listing result
          content:
            application/json:
              schema:
                type: object
                required: [listed, models]
                properties:
                  listed: {type: boolean, description: "false when GET /models is not available"}
                  models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
                  note: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: addVlmModel
      summary: Add a model ID or inference endpoint ID (ep-...), checked with one minimal call
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmModelCreate"}
      responses:
        "201":
          description: added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmModel"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: model_id
        in: path
        required: true
        schema: {type: string}
    patch:
      tags: [vlm]
      operationId: updateVlmModel
      summary: Set reasoning effort and parallelism
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmModelPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmModel"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [vlm]
      operationId: deleteVlmModel
      summary: Remove a model (409 backend_in_use while a non-terminal task uses it)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: removed}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- datasets
  /modules:
    get:
      tags: [datasets]
      operationId: getModules
      summary: The module registry (C1); the frontend's module list comes only from here
      responses:
        "200":
          description: registry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModuleRegistry"}
        default: {$ref: "#/components/responses/Error"}
  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: The overview page in one call - what needs attention, what runs, the chosen period (D36)
      parameters:
        - name: days
          in: query
          description: >-
            the period of `recent`: 7 or 30 days (by day), 90 = the 13 calendar weeks up to this one
            (by week), 365 = the 12 calendar months up to this one (by month); anything else is 400
          schema: {enum: [7, 30, 90, 365], default: 7}
      responses:
        "200":
          description: overview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}
        default: {$ref: "#/components/responses/Error"}
  /datasets:
    get:
      tags: [datasets]
      operationId: listDatasets
      summary: Registered datasets, page-number pagination, newest first (D36)
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {enum: [10, 20, 50, 100], default: 20}
        - name: q
          in: query
          description: search by name or address
          schema: {type: string}
        - name: format
          in: query
          schema: {$ref: "#/components/schemas/DatasetFormat"}
        - name: check_state
          in: query
          schema: {enum: [ok, changed]}
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/DatasetItem"}}
                  page: {type: integer, minimum: 1}
                  page_size: {type: integer}
                  total: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [datasets]
      operationId: createDataset
      summary: Register a dataset - preflight plus the full file listing, both fingerprints kept (D36)
      description: |
        Registering the same source + address + region again returns the existing registration
        with 200 instead of creating a second one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetCreate"}
      responses:
        "201":
          description: registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        "200":
          description: already registered
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/browse:
    get:
      tags: [datasets]
      operationId: browseDatasets
      summary: List datasets under a private TOS prefix or in the HuggingFace cache bucket, to pick one to register
      parameters:
        - $ref: "#/components/parameters/Source"
        - name: uri
          in: query
          description: tos:// prefix to list (source=tos)
          schema: {type: string}
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CredentialName"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: datasets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/BrowsedDataset"}}
        default: {$ref: "#/components/responses/Error"}
  /datasets/episodes:
    get:
      tags: [datasets]
      operationId: listDatasetEpisodes
      summary: Episodes for the preview grid; metadata only, no decoding on the server (doc 03 §10)
      description: Give `dataset_id`, or `source` + `uri` (+ `region`, `credential`).
      parameters:
        - name: dataset_id
          in: query
          schema: {type: string}
        - name: source
          in: query
          schema: {enum: [tos, public, local]}
        - name: uri
          in: query
          schema: {type: string}
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/CredentialName"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: episodes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/EpisodePreview"}}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [datasets]
      operationId: getDataset
      summary: One registration with its preflight result, recent fingerprint checks and tasks
      responses:
        "200":
          description: dataset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [datasets]
      operationId: updateDataset
      summary: Rename, or change the note
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DatasetPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [datasets]
      operationId: deleteDataset
      summary: Remove the registration; the data on TOS is untouched. In use by an unfinished task -> 409 dataset_in_use
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: removed}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/recheck:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [datasets]
      operationId: recheckDataset
      summary: Recompute both fingerprints and compare, nothing else changes; a difference sets check_state=changed
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: the check
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetCheck"}
        default: {$ref: "#/components/responses/Error"}
  /datasets/{id}/repreflight:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [datasets]
      operationId: repreflightDataset
      summary: Run preflight again and keep the new result and fingerprints; check_state returns to ok
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: refreshed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DatasetDetail"}
        default: {$ref: "#/components/responses/Error"}
  /preflight:
    post:
      tags: [datasets]
      operationId: preflight
      summary: Preflight a dataset (metadata only, seconds); the result is kept 30 minutes
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PreflightRequest"}
      responses:
        "200":
          description: preflight result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PreflightResponse"}
        default: {$ref: "#/components/responses/Error"}
  /deliveries/probe:
    post:
      tags: [datasets]
      operationId: probeDelivery
      summary: Write and delete one object under the delivery directory with the given key
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeliveryProbeRequest"}
      responses:
        "200":
          description: probe result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProbeResult"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- uploads
  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Store the input file of a module parameter after validating it (registry 1.5)
      description: >-
        The body is the file itself, sent as JSON like every write: a trajectory.json as it is
        (kind eef_trajectory), or the seed rows as a JSON array (kind eef_observation_seeds; the
        console turns a .jsonl file into that array). Up to 64 MiB. An invalid file is not stored:
        400 validation_failed with details.errors, each located as precisely as the file allows
        (field = JSON path, plus sample_id / episode_index / frame_index / camera_id / point_id).
        The dataset is not known yet, so media are checked when a task uses the file.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: kind
          in: query
          required: true
          schema: {$ref: "#/components/schemas/UploadKind"}
        - name: name
          in: query
          required: true
          description: the file name as picked (kept for display)
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {description: "the file content (see above)"}
      responses:
        "201":
          description: stored and validated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}
  /uploads/{upload_id}:
    get:
      tags: [uploads]
      operationId: getUpload
      summary: An upload's metadata and validation summary (the caller's own uploads only)
      parameters:
        - name: upload_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/UploadId"}
      responses:
        "200":
          description: the upload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Upload"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tasks
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Task list, page-number pagination (D21), newest first
      parameters:
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: page_size
          in: query
          schema: {enum: [10, 20, 50, 100], default: 20}
        - name: state
          in: query
          description: a task state, or `deleted` for soft-deleted tasks (restorable for 30 days)
          schema:
            oneOf:
              - $ref: "#/components/schemas/TaskState"
              - const: deleted
        - name: q
          in: query
          description: search by name or id
          schema: {type: string}
        - name: delivery
          in: query
          description: tasks writing to this delivery directory
          schema: {type: string}
        - name: module
          in: query
          description: comma-separated module ids; only tasks that selected every one of them (an unknown id is 400 validation_failed)
          schema: {type: string}
        - name: dataset_id
          in: query
          description: tasks on this registered dataset
          schema: {type: string}
      responses:
        "200":
          description: one page
          content:
            application/json:
              schema:
                type: object
                required: [items, page, page_size, total]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TaskListItem"}}
                  page: {type: integer, minimum: 1}
                  page_size: {type: integer}
                  total: {type: integer, minimum: 0}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task - the requirement's run_modules() (D5)
      description: |
        The only way to submit work. The Daemon always plans internally; callers may only give
        upper bounds (D31). With `start_now` the three pre-start checks run first (D30): input
        readable, delivery writable, VLM callable; any failure returns `precheck_failed` with
        a per-check reason and nothing starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskCreate"}
      responses:
        "201":
          description: created (state queued, or created when start_now=false)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/batch:
    post:
      tags: [tasks]
      operationId: createTasksBatch
      summary: One configuration, several datasets, one task each (deep link with many datasets)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskBatchCreate"}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks: {type: array, items: {$ref: "#/components/schemas/TaskCreated"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTask
      responses:
        "200":
          description: task detail (doc 03 §3.3)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: created - any field; after start - only name and note (D20)
      description: Other fields after start return task_state_conflict. Concurrent edits are guarded by If-Match.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: true
          description: the task's updated_at as returned by GET; a stale value returns 412
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskPatch"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [tasks]
      operationId: deleteTask
      summary: Soft-delete the platform record; TOS is untouched (D28); created or terminal only
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204": {description: "deleted; restorable for 30 days"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: restoreTask
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: restored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/purge-artifacts:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: purgeTaskArtifacts
      summary: Delete this task's run directory on TOS; the exact path must be echoed back (D28)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_path]
              properties:
                confirm_path: {type: string, description: "tos://.../<run_id>/ exactly as the server computes it"}
      responses:
        "202":
          description: purge started
          content:
            application/json:
              schema:
                type: object
                required: [path, bytes]
                properties:
                  path: {type: string}
                  bytes: {type: integer, minimum: 0}
                  latest_removed: {type: boolean}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/rebind-credentials:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: rebindTaskCredentials
      summary: Give a finished task a new access key after the old one was deleted
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                input_credential: {type: string}
                output_credential: {type: string}
      responses:
        "200":
          description: rebound
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: action
        in: path
        required: true
        schema: {enum: [start, pause, resume, stop]}
    post:
      tags: [tasks]
      operationId: taskAction
      summary: start / pause / resume / stop; illegal transitions return 409 task_state_conflict
      description: |
        `start` first re-checks the dataset fingerprints against its registration (D37). On a
        mismatch nothing starts: 409 `source_changed` whose `error.details` is a `SourceChange`;
        after the user confirms, call `POST /tasks/{id}/repreflight`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: new state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/repreflight:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: repreflightTask
      summary: After a source_changed at start, run preflight again and start if the task still fits (D37)
      description: |
        Refreshes the dataset registration. Compatible (selected modules still available, explicit
        episodes still in range, needed inputs present) -> the task starts as with `start`; otherwise
        it stays `created` and `incompatibilities` says what to change in the form.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RepreflightResult"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: retryTask
      summary: Re-run only the error episodes, from the stage they failed in (D25, D33)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                modules:
                  type: array
                  items: {$ref: "#/components/schemas/ModuleId"}
                  description: omitted = every module with error episodes or a whole-module failure
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/continue:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: continueTask
      summary: Resume a stopped or failed task from its checkpoints (not after source_changed)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/reexport:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [tasks]
      operationId: reexportTask
      summary: Incremental re-export of the delivered dataset (also the first export when export=false)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/subtasks:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: listSubtasks
      responses:
        "200":
          description: subtasks, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Subtask"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskTimeline
      summary: Execution timeline - main run, subtasks, pauses and resumes, result revisions
      responses:
        "200":
          description: timeline, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/TimelineEntry"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/plan:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskPlan
      summary: The execution plan, read only (404 before the task starts)
      responses:
        "200":
          description: plan
          content:
            application/json:
              schema: {$ref: "./cli/plan.schema.json"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskLogs
      summary: Full logs, cursor paginated; SSE only carries what is happening now
      description: Newest first; the next page goes back in time. Without `subtask` the main run and every
        subtask are listed, `subtask=` (empty) keeps the main run only, `subtask=<id>` that subtask only.
      parameters:
        - name: stage
          in: query
          schema: {type: string}
        - name: subtask
          in: query
          description: absent = everything, empty = main run only, an id = that subtask only
          schema: {type: string}
        - name: level
          in: query
          schema: {enum: [error, warn, info, debug]}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: log lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/LogLine"}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/usage:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [tasks]
      operationId: getTaskUsage
      summary: Token usage by module, call kind, model and subtask; totals use the actual ledger only
      responses:
        "200":
          description: usage
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageReport"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- report
  /tasks/{id}/report:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getReport
      summary: Report of the current (or given) result revision
      responses:
        "200":
          description: report
          content:
            application/json:
              schema:
                type: object
                required: [revision, report, links]
                properties:
                  revision: {type: integer, minimum: 1}
                  report: {$ref: "./cli/report.schema.json"}
                  links: {$ref: "#/components/schemas/Links"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/report/tables/{table}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: table
        in: path
        required: true
        description: a table id declared in the module registry
        schema: {type: string}
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getReportTable
      summary: One slice of a detail table, read from Parquet by the Daemon (doc 03 §6)
      description: |
        The cursor carries the revision; if the revision changed since the cursor was issued the
        server returns result_changed and the client starts again from the first page.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: sort
          in: query
          description: a column from the table's sortable whitelist
          schema: {type: string}
        - name: order
          in: query
          schema: {enum: [asc, desc], default: asc}
      responses:
        "200":
          description: rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [columns, revision]
                    properties:
                      columns: {type: array, items: {type: string}}
                      revision: {type: integer, minimum: 1}
                      items: {type: array, items: {type: object}}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/episodes/{index}:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - name: index
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getEpisode
      summary: One episode across all modules (the v1 trajectory page)
      responses:
        "200":
          description: episode view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EpisodeView"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/perf:
    parameters:
      - $ref: "#/components/parameters/PathId"
      - $ref: "#/components/parameters/Rev"
    get:
      tags: [report]
      operationId: getPerf
      summary: Performance profile - all calls, main run only, or one subtask
      parameters:
        - name: scope
          in: query
          schema: {enum: [all, main, subtask], default: all}
        - name: subtask
          in: query
          schema: {type: string}
      responses:
        "200":
          description: profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Perf"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/adjudication:
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [report]
      operationId: listAdjudication
      summary: The adjudication queue, one card per episode, grouped by source module
      parameters:
        - name: source
          in: query
          schema: {$ref: "#/components/schemas/ModuleId"}
        - name: status
          in: query
          description: >-
            by card status, the same on both tabs: pending = not answered yet (on the appeals tab
            too, although appeals never count in AdjudicationCounts.pending) or answered unsure;
            decided; unapplied = answered but not executed yet
          schema: {enum: [pending, decided, unapplied, all], default: pending}
        - name: tab
          in: query
          description: >-
            appeals lists rejects attributed to an appealable module (registry `appealable`;
            today task_success alone and dedup); physical and structural gates and soft scores
            are final
          schema: {enum: [review, appeals], default: review}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: cards
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorPage"
                  - type: object
                    required: [counts]
                    properties:
                      items: {type: array, items: {$ref: "#/components/schemas/AdjudicationCard"}}
                      counts: {$ref: "#/components/schemas/AdjudicationCounts"}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [report]
      operationId: submitAdjudication
      summary: Record decisions (append only, last one wins, nothing is executed)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  items: {$ref: "#/components/schemas/DecisionInput"}
      responses:
        "200":
          description: recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdjudicationCounts"}
        default: {$ref: "#/components/responses/Error"}
  /tasks/{id}/adjudication/apply:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [report]
      operationId: applyAdjudication
      summary: Execute the recorded decisions as a subtask (D10); never exports (D9)
      description: |
        The body is optional; without one (or with `{}`) relabelled episodes are judged again the
        way v1 does (D39). The choice is kept in the subtask's `scope.relabel_rerun`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdjudicationApply"}
      responses:
        "202":
          description: subtask created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubtaskCreated"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- system
  /media/sign:
    get:
      tags: [system]
      operationId: signMedia
      summary: A presigned TOS URL for a video or evidence frame (D16); browsers fetch it directly
      parameters:
        - name: task
          in: query
          required: true
          schema: {type: string}
        - name: scope
          in: query
          required: true
          description: delivery (output key) or input (input key; the public cache bucket is not signed)
          schema: {enum: [delivery, input]}
        - name: path
          in: query
          required: true
          description: >-
            relative to the scope's prefix - scope=delivery: the task's run directory
            <delivery>/<run_id>/; scope=input: the dataset root - normalized and checked
            against it. Clip start and end times come from the episode endpoint.
          schema: {type: string}
        - name: ttl
          in: query
          schema: {type: integer, minimum: 60, maximum: 3600, default: 1800}
      responses:
        "200":
          description: signed URL (public endpoint)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SignedUrl"}
        default: {$ref: "#/components/responses/Error"}
  /events/tasks/{id}:
    servers:
      - url: "{base}"
        variables:
          base: {default: ""}
    parameters:
      - $ref: "#/components/parameters/PathId"
    get:
      tags: [system]
      operationId: taskEvents
      summary: Server-sent events for one task (doc 03 §5)
      description: |
        Events: `state`, `progress`, `log`, `usage`, `done`, `reset`; data payloads are the
        Sse* schemas. Every event has `id: <epoch>-<seq>`. Reconnect with `Last-Event-ID`: same
        epoch and seq still buffered (last 200) resumes; otherwise the server sends `reset`
        and the client reloads GET /api/v1/tasks/{id}. usage and progress carry cumulative
        values. Progress is throttled to 2/s and logs to 20/s; the full log is in /logs.
        Clients must keep working without SSE by polling every 5 s.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: "^[0-9]+-[0-9]+$"}
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /healthz:
    servers:
      - url: "/"
      - url: "{base}"
        variables:
          base: {default: ""}
    get:
      tags: [system]
      operationId: healthz
      summary: Liveness; no authentication, no dependency checks
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {const: ok}
  /readyz:
    servers:
      - url: "/"
      - url: "{base}"
        variables:
          base: {default: ""}
    get:
      tags: [system]
      operationId: readyz
      summary: Readiness; no authentication (doc 09 §2.2)
      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: not ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic against htpasswd (bcrypt / apr1), realm "Robot Data Curation" (doc 08 §5)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: the same key within 24 hours returns the first response (doc 03 §8)
      schema: {type: string, minLength: 8, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      description: opaque, from next_cursor
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Rev:
      name: rev
      in: query
      description: result revision; omitted = the current one (task.result_rev)
      schema: {type: integer, minimum: 1}
    Source:
      name: source
      in: query
      required: true
      schema: {enum: [tos, public, local]}
    Region:
      name: region
      in: query
      schema: {$ref: "#/components/schemas/Region"}
    CredentialName:
      name: credential
      in: query
      description: access key name (not needed for source=public)
      schema: {type: string}

  responses:
    Error:
      description: |
        400 validation_failed, 401 unauthorized, 404 not_found, 409 task_state_conflict /
        subtask_active / credential_in_use / backend_in_use / name_taken / preflight_expired /
        source_changed / result_changed / idempotency_conflict, 412 precondition_failed,
        422 precheck_failed / confirm_path_mismatch / model_check_failed, 500 internal
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    # ---------- common
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [validation_failed, unauthorized, not_found, task_state_conflict, subtask_active,
                     credential_in_use, backend_in_use, dataset_in_use, name_taken, preflight_expired, precheck_failed,
                     source_changed, result_changed, confirm_path_mismatch, model_check_failed,
                     idempotency_conflict, precondition_failed, method_not_allowed, internal]
            message: {type: string, description: "Chinese, shown to people as is"}
            details: {type: object}
    Link:
      type: object
      additionalProperties: false
      required: [rel, title, url]
      properties:
        rel: {enum: [task, report, adjudication, plan, logs, credentials, dataset]}
        title: {type: string}
        url: {type: string}
        absolute: {type: boolean, default: true, description: "false when publicBaseUrl is not configured"}
    Links:
      type: array
      items: {$ref: "#/components/schemas/Link"}
    CursorPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
    Region:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ModuleId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    ReasoningEffort:
      description: Ark's native values; null = the field is not sent (the model's default, and the parity setting)
      enum: [none, minimal, low, medium, high, xhigh, max, null]
    VerifyState:
      enum: [unverified, ok, failed]
    VerifyResult:
      type: object
      additionalProperties: false
      required: [verify_state, last_verified_at]
      properties:
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: integer}
        error: {type: [string, "null"]}
    PrecheckDetails:
      type: object
      description: error.details of precheck_failed - one entry per pre-start check (D30)
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, ok, code, reason]
            properties:
              id: {enum: [input, output, vlm]}
              ok: {type: boolean}
              code: {type: string, description: "stable reason of a failed check, e.g. forbidden, not_found, unreachable"}
              reason: {type: string, description: "Chinese, shown under the form field"}
              target: {type: string, description: "what was checked: a tos:// path or the model"}
              elapsed_ms: {type: integer, minimum: 0}
    ProbeResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}
        error:
          type: object
          description: >-
            Why it failed; with ok true only leftover appears (written, but the probe object
            could not be removed), which deserves a warning.
          properties:
            code: {enum: [forbidden, not_found, auth_failed, unreachable, server_error, failed, leftover]}
            message: {type: string}

    # ---------- credentials
    Credential:
      type: object
      additionalProperties: false
      required: [id, name, kind, meta, verify_state, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {const: tos}
        meta:
          type: object
          additionalProperties: false
          required: [region]
          properties:
            region: {$ref: "#/components/schemas/Region"}
            endpoint: {type: string}
            test_bucket: {type: string, description: "HeadBucket target when the key cannot ListBuckets"}
            access_key_id_hint: {type: string, description: "last 4 characters only"}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        references:
          type: object
          properties:
            active_tasks: {type: integer, minimum: 0}
            historical_tasks: {type: integer, minimum: 0}
        created_at: {type: integer}
        updated_at: {type: integer}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [name, access_key_id, secret_access_key, region]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string, minLength: 1}
        secret_access_key: {type: string, minLength: 1, writeOnly: true}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}
    CredentialUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string}
        secret_access_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}

    # ---------- vlm
    VlmModel:
      type: object
      additionalProperties: false
      required: [id, model_name, reasoning_effort, max_concurrency, capabilities, source, is_default]
      properties:
        id: {type: string}
        is_default:
          type: boolean
          description: >-
            the model a new task starts with; at most one per owner across every backend. Without
            one the form asks, as before. Deleting the model or its backend leaves none.
        model_name: {type: string, description: "Model ID or inference endpoint ID (ep-...)"}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1, description: "null = the backend's"}
        capabilities:
          type: object
          additionalProperties: false
          properties:
            vision: {type: [boolean, "null"]}
            reasoning_effort_levels:
              type: array
              description: effective levels to offer (from the site's mapping table; all 7 when unknown)
              items: {enum: [none, minimal, low, medium, high, xhigh, max]}
        source: {enum: [listed, manual]}
    VlmModelCreate:
      type: object
      additionalProperties: false
      required: [model_name]
      properties:
        model_name: {type: string, minLength: 1}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
    VlmModelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
        is_default:
          type: boolean
          description: >-
            true makes it the one default and clears the flag on every other model of every
            backend; false clears it and leaves none
    VlmBackend:
      type: object
      additionalProperties: false
      required: [id, name, kind, endpoint, max_concurrency, has_api_key, verify_state, models, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [ark, custom]}
        endpoint: {type: string}
        max_concurrency: {type: integer, minimum: 1, default: 64}
        has_api_key: {type: boolean}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
        models_listed: {type: boolean, description: "whether GET /models worked last time"}
        created_at: {type: integer}
        updated_at: {type: integer}
    VlmBackendCreate:
      type: object
      additionalProperties: false
      required: [name, kind, endpoint]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {enum: [ark, custom]}
        endpoint: {type: string, minLength: 1}
        api_key: {type: string, writeOnly: true, description: "required for ark"}
        max_concurrency: {type: integer, minimum: 1}
      if:
        properties: {kind: {const: ark}}
      then:
        required: [api_key]
    VlmBackendUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        endpoint: {type: string}
        api_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        max_concurrency: {type: integer, minimum: 1}

    # ---------- datasets
    ModuleRegistry:
      type: object
      additionalProperties: false
      required: [registry_version, stages, review_lines, modules]
      properties:
        registry_version: {type: string}
        stages: {type: array, items: {enum: [numeric, frame, vlm, post_verdict]}}
        review_lines:
          type: array
          description: >-
            The questions a person can be asked on the adjudication page (D43). A page shows a
            line it has no dedicated view for from this entry: its title, the question's reason
            and one button per decision.
          items: {$ref: "#/components/schemas/ReviewLine"}
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name_zh, summary_zh, level, gate, needs, stage, depends_on, produces_adjudication, review_lines,
                       appealable, input_scope, affects_dataset_verdict, param_schema, tables, mergeable]
            properties:
              id: {$ref: "#/components/schemas/ModuleId"}
              name_zh: {type: string}
              summary_zh: {type: string}
              level: {enum: [episode, dataset]}
              gate: {enum: [hard, soft, dedup, none]}
              needs: {type: array, items: {enum: [timestamps, action, state, video, embodiment_profile, vlm, raw_bytes, eef_input]}}
              stage: {enum: [numeric, frame, vlm, post_verdict]}
              depends_on:
                type: array
                items: {enum: [numeric_gates, frame_gates, autolabel, funnel_verdict, dedup, eef_video_consistency]}
                description: "a module id (registry 1.4) means that module's own results"
              input_scope:
                enum: [funnel, all_selected]
                description: "funnel: the survivors of the stages before; all_selected: every selected episode (1.4)"
              affects_dataset_verdict:
                type: boolean
                description: >-
                  false: an advisory module (1.4); aggregate never counts it, keep / drop / held and the delivered
                  lists do not depend on it, and its records carry passed = score = null with the sub-item
                  statuses in details (shown as advisory, not as an abstention)
              produces_adjudication: {type: boolean, description: "raises review items or its rejects may be appealed"}
              review_lines: {type: array, items: {$ref: "#/components/schemas/ReviewLineId"}, description: "the lines it raises"}
              appealable: {type: boolean, description: "a reject attributed to it may be appealed (D42)"}
              param_schema: {type: object}
              tables:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title_zh, sortable, default_sort]
                  properties:
                    id: {type: string}
                    title_zh: {type: string}
                    sortable: {type: array, items: {type: string}}
                    default_sort: {type: string}
              mergeable: {type: boolean}
    ReviewLineId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: a line of the registry's review_lines; today label, task_verdict, reject_appeal
    ReviewLine:
      type: object
      additionalProperties: false
      required: [id, review_kind, title_zh, applies_to, counts_as_pending, decisions]
      properties:
        id: {$ref: "#/components/schemas/ReviewLineId"}
        review_kind: {type: string, description: "the kind of its review.json items (C2); label_conflict for label"}
        title_zh: {type: string}
        applies_to: {enum: [passed, reject], description: "the list its episodes are in when asked"}
        counts_as_pending: {type: boolean, description: "an open item must be decided; false = a person may act (appeals)"}
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [const, title]
            properties:
              const: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              title: {type: string}
        follow_ups:
          type: array
          default: []
          description: >-
            Questions a card gains once its answer on this line is one of `after` - only on a
            card that does not ask that line already. v1: after adopting a new label a person
            may give the task verdict (the machine takes it, no re-judging); left open, the
            episode is judged again with the new label. An optional follow-up never counts as
            pending, and its answer lapses (not executed, not counted) once the answer that
            opened it changes.
          items:
            type: object
            additionalProperties: false
            required: [after, line, decisions, optional]
            properties:
              after: {type: array, minItems: 1, items: {type: string}}
              line: {$ref: "#/components/schemas/ReviewLineId"}
              decisions: {type: array, minItems: 1, items: {type: string}}
              optional: {type: boolean}
    BrowsedDataset:
      type: object
      additionalProperties: false
      required: [name, uri]
      properties:
        name: {type: string}
        uri: {type: string}
        format_hint: {enum: [lerobot_v2, lerobot_v3, rrd, unknown]}
        episodes: {type: [integer, "null"]}
    DatasetFormat: {enum: [lerobot_v2, lerobot_v3, unsupported]}
    DatasetItemFields:
      type: object
      required: [id, name, source, uri, region, format, episode_count, robot_type, check_state, checked_at,
                 preflighted_at, created_at, last_task]
      properties:
        id:
          type: string
          pattern: "^(ds-[a-z]{9}|ds_[0-9A-Za-z]+)$"
          description: "ds- and 9 lowercase letters (D45); registrations made before 1.10.0 keep ds_ and their old id"
        name: {type: string}
        source: {enum: [tos, public, local]}
        uri: {type: string}
        region: {type: [string, "null"]}
        format: {$ref: "#/components/schemas/DatasetFormat"}
        episode_count: {type: [integer, "null"], minimum: 0}
        robot_type: {type: [string, "null"]}
        check_state: {enum: [ok, changed], description: "changed: the fingerprints differ from the kept ones; preflight again"}
        checked_at: {type: [integer, "null"]}
        preflighted_at: {type: integer}
        created_at: {type: integer}
        last_task:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskRef"
    DatasetItem:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
      unevaluatedProperties: false
    DatasetDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
        - type: object
          required: [note, credential, preflight, meta_fingerprint, listing, checks, tasks, links]
          properties:
            note: {type: [string, "null"]}
            credential: {type: [string, "null"], description: "access key name; null for the public bucket, or once the key is deleted"}
            preflight: {$ref: "./cli/preflight.schema.json"}
            meta_fingerprint: {type: string}
            listing:
              type: object
              description: summary of the file listing kept at the last preflight (source-manifest summary)
              required: [objects, bytes, digest]
              properties:
                objects: {type: integer, minimum: 0, description: "C2 source-manifest summary.count"}
                bytes: {type: integer, minimum: 0}
                digest: {type: string}
            checks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DatasetCheck"}, description: "newest first"}
            tasks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/TaskRef"}, description: "newest first"}
            links: {$ref: "#/components/schemas/Links"}
      unevaluatedProperties: false
    DatasetCreate:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputRef"}
        name: {type: string, minLength: 1, maxLength: 128, description: "defaults to the last path segment"}
        note: {type: string, maxLength: 2000}
    DatasetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: [string, "null"], maxLength: 2000}
    DatasetCheck:
      type: object
      additionalProperties: false
      required: [at, trigger, result, change]
      properties:
        at: {type: integer}
        trigger: {enum: [add, recheck, task_start, repreflight]}
        result: {enum: [same, changed]}
        change:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SourceChange"
    SourceChange:
      type: object
      additionalProperties: false
      description: what differs from the fingerprints kept at registration or at the last preflight (D37)
      required: [meta_changed, added, removed, modified, sample_keys, preflighted_at]
      properties:
        meta_changed: {type: boolean}
        added: {type: integer, minimum: 0}
        removed: {type: integer, minimum: 0}
        modified: {type: integer, minimum: 0}
        sample_keys: {type: array, maxItems: 20, items: {type: string}, description: "a few affected keys, added ones first"}
        preflighted_at: {type: integer}
    TaskRef:
      type: object
      additionalProperties: false
      required: [id, name, state, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
    RepreflightResult:
      type: object
      additionalProperties: false
      required: [compatible, incompatibilities, task]
      properties:
        compatible: {type: boolean}
        incompatibilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason_code, reason]
            properties:
              field: {type: string, description: "form field to fix, e.g. modules, episodes, embodiment_id"}
              module: {$ref: "#/components/schemas/ModuleId"}
              reason_code: {type: string}
              reason: {type: string, description: "Chinese, shown as is"}
        task: {$ref: "#/components/schemas/Task"}
    Overview:
      type: object
      description: >-
        Soft-deleted tasks never count, except in tokens. running counts what workers are busy
        with - main runs and subtasks in running, pausing or stopping - and queued / paused those
        states; recent covers the period `days` asked for in the site's time zone
        (CURATOR_TZ_OFFSET), cut into buckets that end with the current one (7 or 30 days, 13
        calendar weeks from Monday, or 12 calendar months) and starting at `since`: tasks that
        ended succeeded or completed_with_errors since then, their summary totals, passed / total
        over episodes, and actual-ledger prompt + completion tokens per bucket; credentials_failed
        counts access keys (kind tos) only, a backend's key failing counts in backends_failed.
      additionalProperties: false
      required: [todo, running, recent, datasets, generated_at]
      properties:
        todo:
          type: object
          additionalProperties: false
          required: [error_tasks, adjudication, delivery_pending, datasets_changed, credentials_failed, backends_failed]
          properties:
            error_tasks: {type: integer, minimum: 0, description: "completed_with_errors, can be retried"}
            adjudication:
              type: object
              additionalProperties: false
              required: [tasks, episodes]
              properties:
                tasks: {type: integer, minimum: 0}
                episodes: {type: integer, minimum: 0}
            delivery_pending: {type: integer, minimum: 0, description: "tasks whose delivered dataset is stale or was never exported"}
            datasets_changed: {type: integer, minimum: 0}
            credentials_failed: {type: integer, minimum: 0}
            backends_failed: {type: integer, minimum: 0}
        running:
          type: object
          additionalProperties: false
          required: [running, queued, paused, active]
          properties:
            running: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            paused: {type: integer, minimum: 0}
            active:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [task, stage, done, total]
                properties:
                  task: {$ref: "#/components/schemas/TaskRef"}
                  stage: {type: [string, "null"]}
                  done: {type: integer, minimum: 0}
                  total: {type: integer, minimum: 0}
        recent:
          type: object
          additionalProperties: false
          required: [days, bucket, since, tasks_finished, episodes_checked, pass_rate, tokens_per_bucket]
          properties:
            days: {enum: [7, 30, 90, 365], description: "the period asked for"}
            bucket: {enum: [day, week, month], description: "day for 7 and 30, week for 90, month for 365"}
            since: {type: integer, description: "epoch ms where the first bucket starts; the figures count from here"}
            tasks_finished: {type: integer, minimum: 0}
            episodes_checked: {type: integer, minimum: 0}
            pass_rate: {type: [number, "null"], minimum: 0, maximum: 1}
            tokens_per_bucket:
              type: array
              description: actual-ledger totals only, oldest bucket first, every bucket listed (7, 30, 13 or 12)
              minItems: 7
              maxItems: 30
              items:
                type: object
                additionalProperties: false
                required: [start, label, tokens]
                properties:
                  start: {type: integer, description: "epoch ms, local midnight in the site's time zone"}
                  label: {type: string, description: "09-23 (a day), 09-21 周 (the week from that Monday), 2026-09 (a month)"}
                  tokens: {type: integer, minimum: 0}
        datasets:
          type: object
          additionalProperties: false
          required: [total, changed]
          properties:
            total: {type: integer, minimum: 0}
            changed: {type: integer, minimum: 0}
        generated_at: {type: integer}
    EpisodePreview:
      type: object
      additionalProperties: false
      required: [index, length_s, task, task_source, cameras]
      properties:
        index: {type: integer, minimum: 0}
        length_s: {type: [number, "null"]}
        task: {type: string}
        task_source: {enum: [原始标注, 无]}
        cameras:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, url]
            properties:
              name: {type: string}
              url: {type: string, description: "presigned, or anonymous for the public bucket"}
              from_ts: {type: number}
              to_ts: {type: number}
    InputRef:
      type: object
      additionalProperties: false
      required: [source, uri]
      properties:
        source: {enum: [tos, public, local]}
        uri: {type: string, minLength: 1}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; not for source=public. Requests name one; responses give null once the key was deleted (see rebind-credentials)"}
      if:
        properties: {source: {const: tos}}
      then:
        required: [credential]
    InputSpec:
      description: a registered dataset (D36), or an input given in full
      oneOf:
        - type: object
          additionalProperties: false
          required: [dataset_id]
          properties:
            dataset_id: {type: string}
        - $ref: "#/components/schemas/InputRef"
    OutputRef:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; null in responses once the key was deleted"}
    UploadKind:
      enum: [eef_trajectory, eef_observation_seeds]
      description: the x-upload-kind of a file parameter (registry 1.5)
    UploadId:
      type: string
      pattern: "^(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
      description: "upl- and 9 lowercase letters (D45); uploads made before 1.10.0 keep upl_ and hex digits"
    UploadIssue:
      type: object
      additionalProperties: false
      required: [problem]
      properties:
        field: {type: [string, "null"], description: JSON path inside the file}
        problem: {type: string}
        code: {type: string}
        severity: {enum: [error, warning]}
        sample_id: {type: string}
        episode_index: {type: integer}
        frame_index: {type: integer}
        camera_id: {type: string}
        point_id: {type: string}
    Upload:
      type: object
      additionalProperties: false
      required: [upload_id, handle, kind, name, sha256, size_bytes, created_at, validation]
      properties:
        upload_id: {$ref: "#/components/schemas/UploadId"}
        handle:
          type: string
          pattern: "^upload:(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
          description: the value of the file parameter in TaskCreate.modules[].params
        kind: {$ref: "#/components/schemas/UploadKind"}
        name: {type: string}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        size_bytes: {type: integer, minimum: 0}
        created_at: {type: integer}
        validation:
          type: object
          additionalProperties: false
          required: [valid, summary, warnings]
          properties:
            valid: {const: true}
            summary:
              type: object
              description: >-
                eef_trajectory: dataset, samples, episodes, frames, cameras, points_checked,
                max_reprojection_difference_px; eef_observation_seeds: rows, samples, cameras, points
            warnings: {type: array, items: {$ref: "#/components/schemas/UploadIssue"}}
    PreflightRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputSpec"}
        vlm_backend: {type: string}
        embodiment_id: {type: string}
    PreflightResponse:
      type: object
      additionalProperties: false
      required: [preflight_id, expires_at, result]
      properties:
        preflight_id: {type: string}
        expires_at: {type: integer}
        result: {$ref: "./cli/preflight.schema.json"}
    DeliveryProbeRequest:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: string}

    # ---------- tasks
    TaskState:
      enum: [created, queued, running, pausing, paused, stopping, stopped, succeeded, completed_with_errors, failed]
    EpisodeSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {const: all}
        - type: object
          additionalProperties: false
          required: [mode, n]
          properties:
            mode: {const: head}
            n: {type: integer, minimum: 1}
        - type: object
          additionalProperties: false
          required: [mode, expr]
          properties:
            mode: {const: explicit}
            expr: {type: string, description: "3,10-12 / @file is CLI only; validated and expanded on the server"}
            indices: {type: array, items: {type: integer, minimum: 0}, readOnly: true}
    ModuleChoice:
      oneOf:
        - $ref: "#/components/schemas/ModuleId"
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {$ref: "#/components/schemas/ModuleId"}
            params: {type: object, description: "validated against the module's param_schema"}
    TaskVlm:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        snapshot: {type: [object, "null"], description: "effective settings frozen at start (P17)"}
    VlmChoice:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
    TaskParams:
      type: object
      additionalProperties: false
      description: task-level parameters (doc 03 §3.1); concurrency values are upper bounds only (D31)
      properties:
        start_now: {type: boolean, default: true}
        export: {type: boolean, default: true}
        vlm_retry: {type: integer, minimum: 0, maximum: 5, default: 3}
        vlm_hedge: {type: boolean, default: true}
        vlm_timeouts_s:
          type: object
          additionalProperties: false
          properties:
            probe: {type: number, exclusiveMinimum: 0, default: 60}
            endstate: {type: number, exclusiveMinimum: 0, default: 60}
            arbitration: {type: number, exclusiveMinimum: 0, default: 60}
            caption: {type: number, exclusiveMinimum: 0, default: 60}
            llm: {type: number, exclusiveMinimum: 0, default: 120}
        clips: {type: boolean, default: false}
        limits:
          type: object
          additionalProperties: false
          properties:
            cpu_concurrency: {type: integer, minimum: 1}
            vlm_parallelism: {type: integer, minimum: 1}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [name, input, output, preflight_id, episodes, modules]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: string}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    TaskBatchCreate:
      type: object
      additionalProperties: false
      required: [items, shared]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, input, output, preflight_id]
            properties:
              name: {type: string, minLength: 1, maxLength: 128}
              input: {$ref: "#/components/schemas/InputSpec"}
              output: {$ref: "#/components/schemas/OutputRef"}
              preflight_id: {type: string}
        shared:
          type: object
          additionalProperties: false
          required: [episodes, modules]
          properties:
            note: {type: string, maxLength: 2000}
            episodes: {$ref: "#/components/schemas/EpisodeSelector"}
            modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
            embodiment_id: {type: string}
            vlm: {$ref: "#/components/schemas/VlmChoice"}
            params: {$ref: "#/components/schemas/TaskParams"}
    TaskCreated:
      type: object
      additionalProperties: false
      required: [id, state, created_at, warnings, links]
      properties:
        id: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
        warnings: {type: array, items: {type: string}}
        links: {$ref: "#/components/schemas/Links"}
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: after start only name and note are accepted
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: [string, "null"]}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    StageProgress:
      type: object
      additionalProperties: false
      required: [id, state, done, total]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: autolabel, numeric, frame, vlm, verdict, dedup, profile, final; then export, report, verify; new modules may add stages"}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped]}
        done: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        eta_s: {type: [number, "null"]}
        note: {type: string, description: "e.g. why total dropped from 50 to 49"}
    ModuleState:
      type: object
      additionalProperties: false
      required: [id, name, selected, availability, state, episodes_total, episodes_error]
      properties:
        id: {$ref: "#/components/schemas/ModuleId"}
        name: {type: string}
        selected: {type: boolean}
        availability: {enum: [available, needs_input, unsupported]}
        unavailable_reason: {type: [string, "null"]}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped, stale]}
        episodes_total: {type: integer, minimum: 0}
        episodes_error: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        error: {type: [string, "null"]}
    Summary:
      type: object
      additionalProperties: false
      required: [total, passed, rejected, held, review, pass_rate]
      properties:
        total: {type: integer, minimum: 0}
        passed: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        held: {type: integer, minimum: 0}
        review: {type: integer, minimum: 0}
        pass_rate: {type: [number, "null"]}
        skipped:
          type: integer
          minimum: 0
          description: >-
            episodes left out because source files are missing (D40, as v1 does): not checked, in
            none of the lists and not part of total; the report lists them
    UsageTotals:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, name, state, dataset, created_at, progress, summary, pending_adjudication, delivery_stale, modules,
                 module_counts, usage]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        dataset: {type: string}
        dataset_id: {type: [string, "null"]}
        created_at: {type: integer}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        pending_adjudication: {type: integer, minimum: 0}
        delivery_stale: {type: boolean}
        active_subtask: {type: [string, "null"]}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}, description: "selected modules, registry order"}
        module_counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: "selected modules per ModuleState state"}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        deleted_at: {type: [integer, "null"]}
    Task:
      type: object
      additionalProperties: false
      required: [id, name, state, input, output, episodes, modules, params, progress, result_rev,
                 pending_adjudication, delivery_stale, usage, created_at, updated_at, links]
      properties:
        id: {type: string}
        name: {type: string}
        note: {type: [string, "null"]}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null]}
        input: {$ref: "#/components/schemas/InputRef"}
        dataset_id: {type: [string, "null"], description: "the registered dataset (D36)"}
        output: {$ref: "#/components/schemas/OutputRef"}
        run_id: {type: [string, "null"]}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        embodiment_id: {type: [string, "null"]}
        vlm:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskVlm"
        params: {$ref: "#/components/schemas/TaskParams"}
        source:
          type: [object, "null"]
          description: source manifest summary frozen at start (D27)
          properties:
            objects: {type: integer}
            bytes: {type: integer}
            digest: {type: string}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleState"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        result_rev: {type: integer, minimum: 0}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        pending_adjudication: {type: integer, minimum: 0}
        delivery_stale: {type: boolean}
        active_subtask: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Subtask"}]}
        created_at: {type: integer}
        updated_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        deleted_at: {type: [integer, "null"]}
        links: {$ref: "#/components/schemas/Links"}
    Subtask:
      type: object
      additionalProperties: false
      required: [id, task_id, kind, scope, state, created_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        kind: {enum: [retry, resume, apply_adjudication, reexport]}
        scope:
          type: object
          properties:
            modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
            episodes: {enum: [errors, all]}
            relabel_rerun: {enum: [v1, full], description: "apply_adjudication only (D39)"}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null], description: "only while pausing or paused"}
        progress: {type: [object, "null"]}
        created_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        result_rev: {type: [integer, "null"], description: "the revision this subtask produced"}
    SubtaskCreated:
      type: object
      additionalProperties: false
      required: [subtask, links]
      properties:
        subtask: {$ref: "#/components/schemas/Subtask"}
        links: {$ref: "#/components/schemas/Links"}
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind, text]
      properties:
        at: {type: integer}
        kind: {enum: [created, started, system_pause, system_resume, user_pause, user_resume, stopped, failed,
                      finished, subtask_started, subtask_finished, revision]}
        subtask_id: {type: [string, "null"]}
        revision: {type: [integer, "null"]}
        state: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/TaskState"}]}
        text: {type: string}
    LogLine:
      type: object
      additionalProperties: false
      required: [ts, stage, level, msg]
      properties:
        ts: {type: integer}
        stage: {type: string}
        subtask_id: {type: [string, "null"]}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
        episode_index: {type: [integer, "null"]}
    UsageRow:
      type: object
      additionalProperties: false
      required: [subtask_id, module_id, call_kind, model_name, prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        subtask_id: {type: string, description: "empty = main run"}
        module_id: {type: string}
        call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
        model_name: {type: string}
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    UsageReport:
      type: object
      additionalProperties: false
      required: [totals, actual, attributed]
      description: totals sum the actual ledger only; attributed splits merged requests across modules and must never be added to it
      properties:
        totals: {$ref: "#/components/schemas/UsageTotals"}
        actual: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}
        attributed: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}

    # ---------- report
    EpisodeView:
      type: object
      additionalProperties: false
      required: [episode_index, revision, list, modules, videos]
      properties:
        episode_index: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        list: {enum: [passed, reject, held]}
        reasons: {type: array, items: {$ref: "#/components/schemas/EpisodeNote"}, description: "why it is in its list"}
        review:
          type: array
          items: {$ref: "#/components/schemas/EpisodeNote"}
          description: >-
            what a person is asked about it, questions of the adjudication page first; the
            abstentions of other modules follow (shown, never queued)
        task_text:
          type: object
          properties:
            text: {type: string}
            source: {type: string}
        modules:
          type: object
          description: module id -> result record (cli/result-record.schema.json)
          additionalProperties: {$ref: "./cli/result-record.schema.json"}
        evidence:
          type: array
          items:
            type: object
            required: [module, path]
            properties:
              module: {type: string}
              path: {type: string, description: "sign with scope=delivery"}
              kind: {type: string}
        videos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [camera, scope, path]
            properties:
              camera: {type: string}
              scope: {enum: [delivery, input]}
              origin: {enum: [clip, delivery_dataset, source_dataset]}
              path: {type: string}
              from_ts: {type: number}
              to_ts: {type: number}
    EpisodeNote:
      type: object
      additionalProperties: false
      required: [module, text]
      description: >-
        one line of an episode's reasons or review, shaped like C2 final-list reasons: kind is a reason kind of C2 final-list
        (hard_gate, soft_score, duplicate, human, execution_error) or a review kind
      properties:
        module: {$ref: "#/components/schemas/ModuleId"}
        kind: {type: string}
        text: {type: string}
        priority: {type: string}
        duplicate_of: {type: integer, minimum: 0}
    Perf:
      type: object
      additionalProperties: false
      required: [revision, scope, latency, stages]
      properties:
        revision: {type: integer, minimum: 1}
        scope: {enum: [all, main, subtask]}
        subtask_id: {type: [string, "null"]}
        backend: {type: object, description: "model service used (v1 perf_backend)"}
        container: {type: object, description: "CPU / memory quota (v1 perf_env)"}
        latency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [call_kind, count, p50_s, p90_s, p99_s, wall_s]
            properties:
              call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
              count: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              hedged: {type: integer, minimum: 0}
              p50_s: {type: number}
              p90_s: {type: number}
              p99_s: {type: number}
              wall_s: {type: number, description: "first sent to last returned - never count x mean"}
        effective_concurrency: {type: [number, "null"]}
        stages:
          type: array
          items:
            type: object
            required: [id, wall_s]
            properties:
              id: {type: string}
              wall_s: {type: number}
              share: {type: number}
        retries:
          type: object
          properties:
            outer_attempts: {type: integer, minimum: 0}
            rescued: {type: integer, minimum: 0}
        merge:
          type: object
          properties:
            requests: {type: integer, minimum: 0}
            estimated_unmerged: {type: integer, minimum: 0}
        redone_after_interruption: {type: integer, minimum: 0, description: "D26"}
    AdjudicationQuestion:
      type: object
      additionalProperties: false
      required: [line, source_module, reason]
      properties:
        line: {$ref: "#/components/schemas/ReviewLineId"}
        source_module: {$ref: "#/components/schemas/ModuleId"}
        reason: {type: string}
        duplicate_of: {type: [integer, "null"], minimum: 0, description: "an appeal of a dedup reject: the episode it duplicates"}
        follow_up_of:
          oneOf: [{type: "null"}, {$ref: "#/components/schemas/ReviewLineId"}]
          description: >-
            set on a question the card gained as a follow-up of its answer on that line
            (registry follow_ups), absent or null on the card's own questions; a follow-up whose
            opening answer changed is left out of the card
        annotation: {type: [string, "null"]}
        caption: {type: [string, "null"]}
        suggestion: {type: [string, "null"], description: "suggested new label"}
        priority: {type: [string, "null"]}
        latest_decision: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Decision"}]}
    AdjudicationCard:
      type: object
      additionalProperties: false
      required: [episode_index, status, questions]
      properties:
        episode_index: {type: integer, minimum: 0}
        status: {enum: [pending, decided, unsure, applied]}
        questions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AdjudicationQuestion"}}
    AdjudicationCounts:
      type: object
      additionalProperties: false
      description: >-
        All three count cards (episodes) over the whole task, not the filtered page. pending and
        decided cover the cards whose questions belong to lines with counts_as_pending - appeal
        candidates are optional and never pending; unapplied covers both tabs: cards with an
        answer that was not executed yet ('unsure' is not one). pending is what the task's
        pending_adjudication shows.
      required: [decided, pending, unapplied]
      properties:
        decided: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        unapplied: {type: integer, minimum: 0}
    DecisionFields:
      type: object
      required: [episode_index, line, decision]
      properties:
        episode_index: {type: integer, minimum: 0}
        line: {$ref: "#/components/schemas/ReviewLineId"}
        decision:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: >-
            one of the line's decisions in the registry, on a question the episode's card has or
            a follow-up the card's answer on another line opened (registry follow_ups); anything
            else is 400 validation_failed. Today: label - adopt_suggestion, custom_label,
            keep_label, unsure, discard; task_verdict - success, failure, unsure, discard;
            reject_appeal - restore, keep_rejected, unsure
        new_label: {type: [string, "null"], description: "custom_label: required; adopt_suggestion: may be left out, the question's suggestion is taken"}
        note: {type: [string, "null"]}
    AdjudicationApply:
      type: object
      additionalProperties: false
      properties:
        relabel_rerun:
          enum: [v1, full]
          default: v1
          description: >-
            How task success is judged again for relabelled episodes that have no human task
            verdict (D39). v1: what v1's rejudge runs - multi-view scoring and the per-camera
            end-state vote only, no task-type step, camera hints, reject guard or evidence
            arbitration; verdicts and calls match v1. full: the first run's complete flow, so
            the same decisions may end differently from v1. Episodes a person judged success
            or failure are not judged again either way.
    DecisionInput:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
      unevaluatedProperties: false
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [id, decided_by, decided_at, applied]
          properties:
            id: {type: integer}
            decided_by: {type: string}
            decided_at: {type: integer}
            applied: {type: boolean}
      unevaluatedProperties: false

    # ---------- system
    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: {type: string}
        expires_at: {type: integer}
        from_ts: {type: number, description: "v3 sources: play url#t=from,to"}
        to_ts: {type: number}
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {enum: [ok, not_ready]}
        checks:
          type: object
          additionalProperties: false
          required: [db_writable, master_key, workdir_writable, scratch_writable, reconciled]
          properties:
            db_writable: {type: boolean}
            master_key: {type: boolean}
            workdir_writable: {type: boolean}
            scratch_writable: {type: boolean}
            reconciled: {type: boolean}
    SseState:
      type: object
      required: [state, at]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        subtask_id: {type: [string, "null"], description: "set when the change is a subtask's"}
        reason: {type: [string, "null"], description: "state_reason, Chinese"}
        at: {type: integer}
    SseProgress:
      $ref: "#/components/schemas/StageProgress"
    SseLog:
      type: object
      required: [stage, level, msg]
      properties:
        stage: {type: string}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
    SseUsage:
      $ref: "#/components/schemas/UsageTotals"
    SseDone:
      type: object
      required: [state]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        failed_modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
        subtask_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
