      security: []
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}
        "503":
          description: not ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Readiness"}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic against htpasswd (bcrypt / apr1), realm "Robot Data Curation" (doc 08 §5)

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: the same key within 24 hours returns the first response (doc 03 §8)
      schema: {type: string, minLength: 8, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      description: opaque, from next_cursor
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Rev:
      name: rev
      in: query
      description: result revision; omitted = the current one (task.result_rev)
      schema: {type: integer, minimum: 1}
    Source:
      name: source
      in: query
      required: true
      schema: {enum: [tos, public, local]}
    Region:
      name: region
      in: query
      schema: {$ref: "#/components/schemas/Region"}
    CredentialName:
      name: credential
      in: query
      description: access key name (not needed for source=public)
      schema: {type: string}
    PathIndex:
      name: index
      in: path
      required: true
      description: the episode's own index (preflight `episode_indices`)
      schema: {type: integer, minimum: 0}
    PathCamera:
      name: camera
      in: path
      required: true
      description: the camera's `key` in the presentation model
      schema: {$ref: "#/components/schemas/VizCameraKey"}
    RangeHeader:
      name: Range
      in: header
      description: one byte range (`bytes=a-b`, `bytes=a-`, `bytes=-n`)
      schema: {type: string}
    VizTranscode:
      name: transcode
      in: query
      description: >-
        true: the H.264 transcode of the camera, for a browser that cannot decode the original
        (AV1 without hardware decoding, HEVC); 404 with details.reason transcode_disabled when
        CURATOR_VIZ_TRANSCODE is off
      schema: {type: boolean, default: false}
    VizStream:
      name: stream
      in: query
      required: true
      description: the curve group's `key` (VizStream.key)
      schema: {type: string, minLength: 1, maxLength: 128}
    VizFrom:
      name: from
      in: query
      description: start of the window in episode seconds (default 0)
      schema: {type: number, minimum: 0}
    VizTo:
      name: to
      in: query
      description: end of the window in episode seconds (default the episode's end)
      schema: {type: number, minimum: 0}
    VizPoints:
      name: points
      in: query
      description: at most this many points per line; more raw points are thinned by min / max per bucket
      schema: {type: integer, minimum: 100, maximum: 20000, default: 2000}

  responses:
    Error:
      description: |
        400 validation_failed, 401 unauthorized, 404 not_found, 409 task_state_conflict /
        subtask_active / credential_in_use / backend_in_use / name_taken / preflight_expired /
        source_changed / result_changed / idempotency_conflict, 412 precondition_failed,
        422 precheck_failed / confirm_path_mismatch / model_check_failed, 500 internal
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
          examples:
            state_conflict:
              summary: '409: the write does not fit the task''s state'
              x-summary-zh: 409：任务当前的状态不允许这个写操作
              value:
                error:
                  code: task_state_conflict
                  message: 任务正在运行，请先停止再删除
                  details: {state: running}
            not_json:
              summary: '400: a write without Content-Type: application/json'
              x-summary-zh: '400：写请求没带 Content-Type: application/json'
              value:
                error: {code: validation_failed, message: '写接口只接受 JSON：请带上 Content-Type: application/json（没有请求体也要带）'}
            precheck_failed:
              summary: '422: a pre-start check failed (details: PrecheckDetails)'
              x-summary-zh: 422：开始前的检查没通过（details 是 PrecheckDetails）
              value:
                error:
                  code: precheck_failed
                  message: 开始前的检查没有通过：交付目录写不进去，访问密钥「prod-tos」没有写入 tos://bucket/deliveries/droid-50 的权限
                  details:
                    checks:
                      - id: input
                        ok: true
                        code: ok
                        reason: 用访问密钥「prod-tos」读到了 meta/info.json
                        target: tos://bucket/datasets/droid_lerobot
                        elapsed_ms: 180
                      - id: output
                        ok: false
                        code: forbidden
                        reason: 访问密钥「prod-tos」没有写入 tos://bucket/deliveries/droid-50 的权限
                        target: tos://bucket/deliveries/droid-50
                        elapsed_ms: 240
                      - id: vlm
                        ok: true
                        code: ok
                        reason: doubao-seed-2-0-pro-260215 完成了一次最小调用
                        target: ark-prod / doubao-seed-2-0-pro-260215
                        elapsed_ms: 1350
            source_changed:
              summary: '409: the dataset changed since its preflight (details: SourceChange)'
              x-summary-zh: 409：数据集在预检之后变了（details 是 SourceChange）
              value:
                error:
                  code: source_changed
                  message: 数据集和登记时（或上次预检时）不一样了：确认后重新预检，相容就接着开始
                  details:
                    meta_changed: true
                    added: 12
                    removed: 0
                    modified: 1
                    sample_keys: [data/chunk-000/episode_000200.parquet, meta/info.json]
                    preflighted_at: 1758300000000
            not_found:
              summary: '404: no such object'
              x-summary-zh: 404：对象不存在
              value:
                error: {code: not_found, message: 要找的对象不存在，可能已被删除}
            unauthorized:
              summary: '401: not signed in'
              x-summary-zh: 401：没有登录
              value:
                error: {code: unauthorized, message: 需要登录：请输入质检平台的账号和密码}
    VizVideo:
      description: the whole video (Accept-Ranges bytes)
      content:
        video/mp4:
          schema: {type: string, format: binary}
    VizVideoRange:
      description: the requested byte range (Content-Range)
      content:
        video/mp4:
          schema: {type: string, format: binary}
    VizFrames:
      description: the whole frame pack (Accept-Ranges bytes)
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    VizFramesRange:
      description: the requested byte range of the frame pack (Content-Range)
      content:
        application/octet-stream:
          schema: {type: string, format: binary}
    VizPending:
      description: still being prepared (transcoding, building the frame pack); ask again shortly
      content:
        application/json:
          schema: {$ref: "#/components/schemas/VizMediaPending"}

  schemas:
    # ---------- common
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [validation_failed, unauthorized, not_found, task_state_conflict, subtask_active,
                     credential_in_use, backend_in_use, dataset_in_use, name_taken, preflight_expired, precheck_failed,
                     source_changed, result_changed, confirm_path_mismatch, model_check_failed,
                     idempotency_conflict, precondition_failed, method_not_allowed, internal]
            message: {type: string, description: "Chinese, shown to people as is"}
            details: {type: object}
    Link:
      type: object
      additionalProperties: false
      required: [rel, title, url]
      properties:
        rel: {enum: [task, report, adjudication, plan, logs, credentials, dataset]}
        title: {type: string}
        url: {type: string}
        absolute: {type: boolean, default: true, description: "false when publicBaseUrl is not configured"}
    Links:
      type: array
      items: {$ref: "#/components/schemas/Link"}
    CursorPage:
      type: object
      required: [items, next_cursor, has_more]
      properties:
        items: {type: array}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
    Region:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{1,31}$"
    ModuleId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
    ReasoningEffort:
      description: Ark's native values; null = the field is not sent (the model's default, and the parity setting)
      enum: [none, minimal, low, medium, high, xhigh, max, null]
    VerifyState:
      enum: [unverified, ok, failed]
    VerifyResult:
      type: object
      additionalProperties: false
      required: [verify_state, last_verified_at]
      properties:
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: integer}
        error: {type: [string, "null"]}
    PrecheckDetails:
      type: object
      description: error.details of precheck_failed - one entry per pre-start check (D30)
      required: [checks]
      properties:
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, ok, code, reason]
            properties:
              id: {enum: [input, output, vlm]}
              ok: {type: boolean}
              code: {type: string, description: "stable reason of a failed check, e.g. forbidden, not_found, unreachable"}
              reason: {type: string, description: "Chinese, shown under the form field"}
              target: {type: string, description: "what was checked: a tos:// path or the model"}
              elapsed_ms: {type: integer, minimum: 0}
    ProbeResult:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: {type: boolean}
        error:
          type: object
          description: >-
            Why it failed; with ok true only leftover appears (written, but the probe object
            could not be removed), which deserves a warning.
          properties:
            code: {enum: [forbidden, not_found, auth_failed, unreachable, server_error, failed, leftover]}
            message: {type: string}

    # ---------- credentials
    Credential:
      type: object
      additionalProperties: false
      required: [id, name, kind, meta, verify_state, is_default, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {const: tos}
        meta:
          type: object
          additionalProperties: false
          required: [region]
          properties:
            region: {$ref: "#/components/schemas/Region"}
            endpoint: {type: string}
            test_bucket: {type: string, description: "HeadBucket target when the key cannot ListBuckets"}
            access_key_id_hint: {type: string, description: "last 4 characters only"}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        references:
          type: object
          properties:
            active_tasks: {type: integer, minimum: 0}
            historical_tasks: {type: integer, minimum: 0}
        is_default:
          type: boolean
          description: >-
            the key a new task starts with; at most one per owner. Without one the form picks as
            before (the only key, or the one used last). Deleting the key leaves none.
        created_at: {type: integer}
        updated_at: {type: integer}
    CredentialCreate:
      type: object
      additionalProperties: false
      required: [name, access_key_id, secret_access_key, region]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string, minLength: 1}
        secret_access_key: {type: string, minLength: 1, writeOnly: true}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}
    CredentialUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        access_key_id: {type: string}
        secret_access_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        region: {$ref: "#/components/schemas/Region"}
        endpoint: {type: string}
        test_bucket: {type: string}
        session_token: {type: string, writeOnly: true, description: "temporary credentials only; empty = none"}
        is_default:
          type: boolean
          description: >-
            true makes this key the default and takes the flag from any other key; false clears it
            when this key has it. Neither verifies the key again.

    # ---------- vlm
    VlmModel:
      type: object
      additionalProperties: false
      required: [id, model_name, reasoning_effort, max_concurrency, capabilities, source, is_default]
      properties:
        id: {type: string}
        is_default:
          type: boolean
          description: >-
            the model a new task starts with; at most one per owner across every backend. Without
            one the form asks, as before. Deleting the model or its backend leaves none.
        model_name: {type: string, description: "Model ID or inference endpoint ID (ep-...)"}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1, description: "null = the backend's"}
        capabilities:
          type: object
          additionalProperties: false
          properties:
            vision: {type: [boolean, "null"]}
            reasoning_effort_levels:
              type: array
              description: effective levels to offer (from the site's mapping table; all 7 when unknown)
              items: {enum: [none, minimal, low, medium, high, xhigh, max]}
        source: {enum: [listed, manual]}
    VlmModelCreate:
      type: object
      additionalProperties: false
      required: [model_name]
      properties:
        model_name: {type: string, minLength: 1}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
    VlmModelPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        max_concurrency: {type: [integer, "null"], minimum: 1}
        is_default:
          type: boolean
          description: >-
            true makes it the one default and clears the flag on every other model of every
            backend; false clears it and leaves none
    VlmBackend:
      type: object
      additionalProperties: false
      required: [id, name, kind, endpoint, max_concurrency, has_api_key, verify_state, models, created_at, updated_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [ark, custom]}
        endpoint: {type: string}
        max_concurrency: {type: integer, minimum: 1, default: 64}
        has_api_key: {type: boolean}
        verify_state: {$ref: "#/components/schemas/VerifyState"}
        last_verified_at: {type: [integer, "null"]}
        last_verify_error: {type: [string, "null"]}
        models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
        models_listed: {type: boolean, description: "whether GET /models worked last time"}
        created_at: {type: integer}
        updated_at: {type: integer}
    VlmBackendCreate:
      type: object
      additionalProperties: false
      required: [name, kind, endpoint]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        kind: {enum: [ark, custom]}
        endpoint: {type: string, minLength: 1}
        api_key: {type: string, writeOnly: true, description: "required for ark"}
        max_concurrency: {type: integer, minimum: 1}
      if:
        properties: {kind: {const: ark}}
      then:
        required: [api_key]
    VlmBackendUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        endpoint: {type: string}
        api_key: {type: string, writeOnly: true, description: "empty = unchanged"}
        max_concurrency: {type: integer, minimum: 1}

    # ---------- datasets
    ModuleRegistry:
      type: object
      additionalProperties: false
      required: [registry_version, taxonomy_version, blocks, stages, full_set_stages, finding_levels,
                 unassessable_reasons, review_lines, taxonomy, modules]
      description: >-
        C1 2.0 (design doc 17 §2): where every module runs, what it can find and what it covers. The
        console takes every module, code and item name from here.
      properties:
        registry_version: {type: string}
        taxonomy_version: {type: string, description: "the taxonomy (C6) every code maps into"}
        blocks:
          type: array
          description: >-
            The two blocks that run side by side and never filter each other (D57); inside a block every
            stage gets every selected episode
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh, stages]
            properties:
              id: {enum: [cpu, vlm]}
              title_zh: {type: string}
              stages: {type: array, minItems: 1, items: {$ref: "#/components/schemas/RegistryStage"}}
        stages: {type: array, items: {$ref: "#/components/schemas/RegistryStage"}, description: "every stage, the CPU block's first"}
        full_set_stages:
          type: array
          items: {$ref: "#/components/schemas/RegistryStage"}
          description: stages that need the whole selection and start once the earlier stages of their block are done
        finding_levels:
          type: array
          description: blocking (rejects), review (asks a person), info (reported only), with the console's titles
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh]
            properties:
              id: {$ref: "#/components/schemas/FindingLevel"}
              title_zh: {type: string}
        unassessable_reasons:
          type: array
          description: why a module could not assess an item on an episode (design doc 17 §1.4)
          items:
            type: object
            additionalProperties: false
            required: [id, title_zh]
            properties:
              id: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              title_zh: {type: string}
        review_lines:
          type: array
          description: >-
            The questions a person can be asked on the adjudication page (D43). A page shows a
            line it has no dedicated view for from this entry: its title, the question's reason
            and one button per decision.
          items: {$ref: "#/components/schemas/ReviewLine"}
        taxonomy:
          type: object
          additionalProperties: false
          required: [dimensions, items]
          description: the bound taxonomy (C6, docs/contracts/taxonomy.json) without its sample-set notes
          properties:
            dimensions:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, name_zh]
                properties:
                  id: {type: string}
                  name_zh: {type: string}
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [id, dimension, name_zh, explain_zh, kind, level]
                properties:
                  id: {$ref: "#/components/schemas/TaxonomyItemId"}
                  dimension: {type: string}
                  name_zh: {type: string}
                  explain_zh: {type: string}
                  kind: {enum: [defect, phenomenon, reference, control], description: "control: a legal case that must not be reported"}
                  level: {enum: [episode, dataset]}
        modules:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name_zh, summary_zh, level, needs, block, stage, depends_on, codes, covers,
                       param_schema, tables, mergeable]
            properties:
              id: {$ref: "#/components/schemas/ModuleId"}
              name_zh: {type: string}
              summary_zh: {type: string}
              level: {enum: [episode, dataset]}
              needs: {type: array, items: {enum: [timestamps, action, state, video, embodiment_profile, vlm, raw_bytes, eef_input]}}
              block: {enum: [cpu, vlm]}
              stage: {$ref: "#/components/schemas/RegistryStage"}
              depends_on:
                type: array
                items: {enum: [autolabel]}
                description: "data only: the captions autolabel writes for episodes without a task text"
              codes:
                type: array
                minItems: 1
                description: the finding codes the module reports (design doc 17 §2.2)
                items: {$ref: "#/components/schemas/FindingCode"}
              covers:
                type: array
                items: {$ref: "#/components/schemas/TaxonomyItemId"}
                description: >-
                  the items it assesses on an episode it can read: its codes' items plus items it only
                  reports a reading for; a record says which of them it could not assess and why
              param_schema: {type: object}
              tables:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [id, title_zh, sortable, default_sort]
                  properties:
                    id: {type: string}
                    title_zh: {type: string}
                    sortable: {type: array, items: {type: string}}
                    default_sort: {type: string}
              mergeable: {type: boolean}
              rides_on:
                $ref: "#/components/schemas/ModuleId"
                description: >-
                  present on a module answered inside this host module's requests (1.19.0): it runs
                  whenever the host runs, has no request of its own and cannot be selected alone
    RegistryStage:
      enum: [integrity, numeric, frame, dedup, autolabel, vlm, profile]
      description: a stage of a block (registry 2.0); a plan's stage ids are its own (cli/plan.schema.json)
    FindingLevel:
      enum: [blocking, review, info]
    TaxonomyItemId:
      type: string
      pattern: "^[A-Z]+-[0-9]+$"
      description: an item of the taxonomy (C6), e.g. FILE-3, MV-5
    FindingCode:
      type: object
      additionalProperties: false
      required: [code, item, name_zh, severity, level, scope_kind, appealable]
      properties:
        code: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "unique within its module"}
        item:
          oneOf:
            - $ref: "#/components/schemas/TaxonomyItemId"
            - type: "null"
          description: null only for an info-level item of the platform's own
        name_zh: {type: string}
        severity: {enum: [high, medium, low], description: "the default; a module may grade by measure"}
        level: {$ref: "#/components/schemas/FindingLevel"}
        scope_kind: {enum: [episode, camera, channel, dataset]}
        appealable: {type: boolean, description: "blocking codes only: a reject it caused may be appealed (D42)"}
        review_line: {$ref: "#/components/schemas/ReviewLineId"}
    ReviewLineId:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"
      description: a line of the registry's review_lines; today task_verdict, reject_appeal, eef_check, integrity_check
    ReviewLine:
      type: object
      additionalProperties: false
      required: [id, review_kind, title_zh, applies_to, counts_as_pending, decisions]
      properties:
        id: {$ref: "#/components/schemas/ReviewLineId"}
        review_kind: {type: string, description: "the kind of its review.json items (C2)"}
        title_zh: {type: string}
        applies_to: {enum: [passed, reject], description: "the list its episodes are in when asked"}
        counts_as_pending: {type: boolean, description: "an open item must be decided; false = a person may act (appeals)"}
        decisions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [const, title]
            properties:
              const: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
              title: {type: string}
    BrowsedDataset:
      type: object
      additionalProperties: false
      required: [name, uri]
      properties:
        name: {type: string}
        uri: {type: string}
        format_hint: {enum: [lerobot_v2, lerobot_v3, mcap, lance, rrd, unknown]}
        episodes: {type: [integer, "null"]}
    DatasetFormat: {enum: [lerobot_v2, lerobot_v3, mcap, lance, unsupported]}
    DatasetItemFields:
      type: object
      required: [id, name, source, uri, region, format, episode_count, robot_type, check_state, checked_at,
                 preflighted_at, created_at, last_task, viz, viz_mapping]
      properties:
        id:
          type: string
          pattern: "^(ds-[a-z]{9}|ds_[0-9A-Za-z]+)$"
          description: "ds- and 9 lowercase letters (D45); registrations made before 1.10.0 keep ds_ and their old id"
        name: {type: string}
        source: {enum: [tos, public, local]}
        uri: {type: string}
        region: {type: [string, "null"]}
        format: {$ref: "#/components/schemas/DatasetFormat"}
        episode_count: {type: [integer, "null"], minimum: 0}
        robot_type: {type: [string, "null"]}
        check_state: {enum: [ok, changed], description: "changed: the fingerprints differ from the kept ones; preflight again"}
        checked_at: {type: [integer, "null"]}
        preflighted_at: {type: integer}
        created_at: {type: integer}
        last_task:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskRef"
        viz: {$ref: "#/components/schemas/VizStatus"}
        viz_mapping:
          description: the mcap field mapping (C7) - its state, version and name, shown under the format in the list; null for other formats
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DatasetMappingInfo"
    DatasetItem:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
      unevaluatedProperties: false
    DatasetDetail:
      allOf:
        - $ref: "#/components/schemas/DatasetItemFields"
        - type: object
          required: [note, credential, preflight, meta_fingerprint, listing, checks, tasks, links, annotations]
          properties:
            note: {type: [string, "null"]}
            annotations:
              description: the external annotation file attached to it (a viz_annotations upload), if any
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/DatasetAnnotationsInfo"
            credential: {type: [string, "null"], description: "access key name; null for the public bucket, or once the key is deleted"}
            preflight: {$ref: "./cli/preflight.schema.json"}
            meta_fingerprint: {type: string}
            listing:
              type: object
              description: summary of the file listing kept at the last preflight (source-manifest summary)
              required: [objects, bytes, digest]
              properties:
                objects: {type: integer, minimum: 0, description: "C2 source-manifest summary.count"}
                bytes: {type: integer, minimum: 0}
                digest: {type: string}
            checks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/DatasetCheck"}, description: "newest first"}
            tasks: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/TaskRef"}, description: "newest first"}
            links: {$ref: "#/components/schemas/Links"}
      unevaluatedProperties: false
    DatasetCreate:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputRef"}
        name: {type: string, minLength: 1, maxLength: 128, description: "defaults to the last path segment"}
        note: {type: string, maxLength: 2000}
        viz_mapping:
          $ref: "#/components/schemas/VizMapping"
          description: mcap only - the field mapping confirmed in the add drawer (kept as version 1)
        annotations_upload:
          $ref: "#/components/schemas/UploadId"
          description: an external annotation file (a viz_annotations upload) to attach
    DatasetPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: [string, "null"], maxLength: 2000}
    DatasetCheck:
      type: object
      additionalProperties: false
      required: [at, trigger, result, change]
      properties:
        at: {type: integer}
        trigger: {enum: [add, recheck, task_start, repreflight]}
        result: {enum: [same, changed]}
        change:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SourceChange"
    SourceChange:
      type: object
      additionalProperties: false
      description: what differs from the fingerprints kept at registration or at the last preflight (D37)
      required: [meta_changed, added, removed, modified, sample_keys, preflighted_at]
      properties:
        meta_changed: {type: boolean}
        added: {type: integer, minimum: 0}
        removed: {type: integer, minimum: 0}
        modified: {type: integer, minimum: 0}
        sample_keys: {type: array, maxItems: 20, items: {type: string}, description: "a few affected keys, added ones first"}
        preflighted_at: {type: integer}
    TaskRef:
      type: object
      additionalProperties: false
      required: [id, name, state, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
    RepreflightResult:
      type: object
      additionalProperties: false
      required: [compatible, incompatibilities, task]
      properties:
        compatible: {type: boolean}
        incompatibilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, reason_code, reason]
            properties:
              field: {type: string, description: "form field to fix, e.g. modules, episodes, embodiment_id"}
              module: {$ref: "#/components/schemas/ModuleId"}
              reason_code: {type: string}
              reason: {type: string, description: "Chinese, shown as is"}
        task: {$ref: "#/components/schemas/Task"}
    Overview:
      type: object
      description: >-
        Soft-deleted tasks never count, except in tokens. running counts what workers are busy
        with - main runs and subtasks in running, pausing or stopping - and queued / paused those
        states; recent covers the period `days` asked for in the site's time zone
        (CURATOR_TZ_OFFSET), cut into buckets that end with the current one (7 or 30 days, 13
        calendar weeks from Monday, or 12 calendar months) and starting at `since`: tasks that
        ended succeeded or completed_with_errors since then, their summary totals, passed / total
        over episodes, and actual-ledger prompt + completion tokens per bucket; credentials_failed
        counts access keys (kind tos) only, a backend's key failing counts in backends_failed.
      additionalProperties: false
      required: [todo, running, recent, datasets, generated_at]
      properties:
        todo:
          type: object
          additionalProperties: false
          required: [error_tasks, adjudication, datasets_changed, credentials_failed, backends_failed]
          properties:
            error_tasks: {type: integer, minimum: 0, description: "completed_with_errors, can be retried"}
            adjudication:
              type: object
              additionalProperties: false
              required: [tasks, episodes]
              properties:
                tasks: {type: integer, minimum: 0}
                episodes: {type: integer, minimum: 0}
            datasets_changed: {type: integer, minimum: 0}
            credentials_failed: {type: integer, minimum: 0}
            backends_failed: {type: integer, minimum: 0}
        running:
          type: object
          additionalProperties: false
          required: [running, queued, paused, active]
          properties:
            running: {type: integer, minimum: 0}
            queued: {type: integer, minimum: 0}
            paused: {type: integer, minimum: 0}
            active:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [task, stage, done, total]
                properties:
                  task: {$ref: "#/components/schemas/TaskRef"}
                  stage: {type: [string, "null"]}
                  done: {type: integer, minimum: 0}
                  total: {type: integer, minimum: 0}
        recent:
          type: object
          additionalProperties: false
          required: [days, bucket, since, tasks_finished, episodes_checked, pass_rate, tokens_per_bucket]
          properties:
            days: {enum: [7, 30, 90, 365], description: "the period asked for"}
            bucket: {enum: [day, week, month], description: "day for 7 and 30, week for 90, month for 365"}
            since: {type: integer, description: "epoch ms where the first bucket starts; the figures count from here"}
            tasks_finished: {type: integer, minimum: 0}
            episodes_checked: {type: integer, minimum: 0}
            pass_rate: {type: [number, "null"], minimum: 0, maximum: 1}
            tokens_per_bucket:
              type: array
              description: actual-ledger totals only, oldest bucket first, every bucket listed (7, 30, 13 or 12)
              minItems: 7
              maxItems: 30
              items:
                type: object
                additionalProperties: false
                required: [start, label, tokens]
                properties:
                  start: {type: integer, description: "epoch ms, local midnight in the site's time zone"}
                  label: {type: string, description: "09-23 (a day), 09-21 周 (the week from that Monday), 2026-09 (a month)"}
                  tokens: {type: integer, minimum: 0}
        datasets:
          type: object
          additionalProperties: false
          required: [total, changed]
          properties:
            total: {type: integer, minimum: 0}
            changed: {type: integer, minimum: 0}
        generated_at: {type: integer}
    EpisodePreview:
      type: object
      additionalProperties: false
      required: [index, length_s, task, task_source, cameras]
      properties:
        index: {type: integer, minimum: 0}
        length_s: {type: [number, "null"]}
        task: {type: string}
        task_source: {enum: [原始标注, 无]}
        task_unread:
          type: boolean
          description: >-
            mcap (1.12): the episode has a task topic the preview does not read (its text is
            inside the file; the checks read it) - task is empty, but not because there is none
        cameras:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, url]
            properties:
              name: {type: string}
              url: {type: string, description: "presigned, or anonymous for the public bucket"}
              from_ts: {type: number}
              to_ts: {type: number}
    InputRef:
      type: object
      additionalProperties: false
      required: [source, uri]
      properties:
        source: {enum: [tos, public, local]}
        uri: {type: string, minLength: 1}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; not for source=public. Requests name one; responses give null once the key was deleted (see rebind-credentials)"}
      if:
        properties: {source: {const: tos}}
      then:
        required: [credential]
    InputSpec:
      description: a registered dataset (D36), or an input given in full
      oneOf:
        - type: object
          additionalProperties: false
          required: [dataset_id]
          properties:
            dataset_id: {type: string}
        - $ref: "#/components/schemas/InputRef"
    OutputRef:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: [string, "null"], description: "access key name; null in responses once the key was deleted"}
    UploadKind:
      enum: [eef_trajectory, eef_observation_seeds, eef_gripper_template, eef_record_mapping, viz_annotations]
      description: >-
        the x-upload-kind of a file parameter (registry 1.5); viz_annotations is a dataset's external
        annotation file (design doc 18 §4.5), not a module parameter
    UploadId:
      type: string
      pattern: "^(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
      description: "upl- and 9 lowercase letters (D45); uploads made before 1.10.0 keep upl_ and hex digits"
    UploadIssue:
      type: object
      additionalProperties: false
      required: [problem]
      properties:
        field: {type: [string, "null"], description: JSON path inside the file}
        problem: {type: string}
        code: {type: string}
        severity: {enum: [error, warning]}
        sample_id: {type: string}
        episode_index: {type: integer}
        frame_index: {type: integer}
        camera_id: {type: string}
        point_id: {type: string}
    Upload:
      type: object
      additionalProperties: false
      required: [upload_id, handle, kind, name, sha256, size_bytes, created_at, validation]
      properties:
        upload_id: {$ref: "#/components/schemas/UploadId"}
        handle:
          type: string
          pattern: "^upload:(upl-[a-z]{9}|upl_[0-9a-z]{10,40})$"
          description: the value of the file parameter in TaskCreate.modules[].params
        kind: {$ref: "#/components/schemas/UploadKind"}
        name: {type: string}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        size_bytes: {type: integer, minimum: 0}
        created_at: {type: integer}
        validation:
          type: object
          additionalProperties: false
          required: [valid, summary, warnings]
          properties:
            valid: {const: true}
            summary:
              type: object
              description: >-
                eef_trajectory: dataset, samples, episodes, frames, cameras, points_checked,
                max_reprojection_difference_px; eef_observation_seeds: rows, samples, cameras, points
            warnings: {type: array, items: {$ref: "#/components/schemas/UploadIssue"}}
    PreflightRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputSpec"}
        vlm_backend: {type: string}
        embodiment_id: {type: string}
    PreflightResponse:
      type: object
      additionalProperties: false
      required: [preflight_id, expires_at, result]
      properties:
        preflight_id: {type: string}
        expires_at: {type: integer}
        result: {$ref: "./cli/preflight.schema.json"}
    DeliveryProbeRequest:
      type: object
      additionalProperties: false
      required: [uri, credential]
      properties:
        uri: {type: string, pattern: "^tos://"}
        region: {$ref: "#/components/schemas/Region"}
        credential: {type: string}

    # ---------- tasks
    TaskState:
      enum: [created, queued, running, pausing, paused, stopping, stopped, succeeded, completed_with_errors, failed]
    EpisodeSelector:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: {const: all}
        - type: object
          additionalProperties: false
          required: [mode, n]
          properties:
            mode: {const: head}
            n: {type: integer, minimum: 1}
        - type: object
          additionalProperties: false
          required: [mode, expr]
          properties:
            mode: {const: explicit}
            expr: {type: string, description: "3,10-12 / @file is CLI only; validated and expanded on the server"}
            indices: {type: array, items: {type: integer, minimum: 0}, readOnly: true}
    ModuleChoice:
      oneOf:
        - $ref: "#/components/schemas/ModuleId"
        - type: object
          additionalProperties: false
          required: [id]
          properties:
            id: {$ref: "#/components/schemas/ModuleId"}
            params: {type: object, description: "validated against the module's param_schema"}
    TaskVlm:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
        snapshot: {type: [object, "null"], description: "effective settings frozen at start (P17)"}
    VlmChoice:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string}
        model: {type: string}
        reasoning_effort: {$ref: "#/components/schemas/ReasoningEffort"}
    TaskParams:
      type: object
      additionalProperties: false
      description: task-level parameters (doc 03 §3.1); concurrency values are upper bounds only (D31)
      properties:
        start_now: {type: boolean, default: true}
        batch_size: {type: integer, minimum: 1, maximum: 256, description: "Maximum episodes per funnel dispatch. Persistent workers hand off completed episodes immediately and refill up to the plan concurrency, independently of this size. External CLI wrappers retain batch handoff. If omitted, derived from parallelism (8–64) and reduced for small selections."}
        vlm_retry: {type: integer, minimum: 0, maximum: 5, default: 3}
        vlm_hedge: {type: boolean, default: true}
        vlm_timeouts_s:
          type: object
          additionalProperties: false
          properties:
            probe: {type: number, exclusiveMinimum: 0, default: 60}
            endstate: {type: number, exclusiveMinimum: 0, default: 60}
            arbitration: {type: number, exclusiveMinimum: 0, default: 60}
            caption: {type: number, exclusiveMinimum: 0, default: 60}
            llm: {type: number, exclusiveMinimum: 0, default: 120}
        clips: {type: boolean, default: false}
        policy:
          type: object
          additionalProperties: false
          description: >-
            The verdict policy (design doc 17 §4, D58): which findings reject an episode, which ask a
            person and which are only reported. `default` gives every finding code its registry level
            (today's hard gates reject, today's suspects and abstentions are asked); `report_only`
            asks nothing and rejects only on data integrity's blocking findings (an empty, cut or
            unreadable file leaves nothing for the modules after it; policy version 2, 2026-10-05 -
            version 1 rejected nothing). Frozen at start; changing it later re-runs aggregate
            only. The funnel keeps judging by `default` until the policy aggregate replaces it (F12.3).
          properties:
            preset: {enum: [default, report_only], default: default}
        limits:
          type: object
          additionalProperties: false
          properties:
            cpu_concurrency:
              type: integer
              minimum: 1
              description: >-
                At most this many CPU workers for this task; it can only lower the default, which
                is every core of the container but two (P4, D54). Unset: that default. The CPU
                workers of all running tasks come out of one pool of that size in the Daemon, so
                fewer may run at a time while other tasks run too.
            vlm_parallelism: {type: integer, minimum: 1}
    TaskCreate:
      type: object
      additionalProperties: false
      required: [name, input, output, preflight_id, episodes, modules]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: string}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    TaskBatchCreate:
      type: object
      additionalProperties: false
      required: [items, shared]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, input, output, preflight_id]
            properties:
              name: {type: string, minLength: 1, maxLength: 128}
              input: {$ref: "#/components/schemas/InputSpec"}
              output: {$ref: "#/components/schemas/OutputRef"}
              preflight_id: {type: string}
        shared:
          type: object
          additionalProperties: false
          required: [episodes, modules]
          properties:
            note: {type: string, maxLength: 2000}
            episodes: {$ref: "#/components/schemas/EpisodeSelector"}
            modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
            embodiment_id: {type: string}
            vlm: {$ref: "#/components/schemas/VlmChoice"}
            params: {$ref: "#/components/schemas/TaskParams"}
    TaskCreated:
      type: object
      additionalProperties: false
      required: [id, state, created_at, warnings, links]
      properties:
        id: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        created_at: {type: integer}
        warnings: {type: array, items: {type: string}}
        links: {$ref: "#/components/schemas/Links"}
    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: after start only name and note are accepted
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        note: {type: string, maxLength: 2000}
        input: {$ref: "#/components/schemas/InputSpec"}
        output: {$ref: "#/components/schemas/OutputRef"}
        preflight_id: {type: string}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        modules: {type: array, minItems: 1, items: {$ref: "#/components/schemas/ModuleChoice"}}
        embodiment_id: {type: [string, "null"]}
        vlm: {$ref: "#/components/schemas/VlmChoice"}
        params: {$ref: "#/components/schemas/TaskParams"}
    StageProgress:
      type: object
      additionalProperties: false
      required: [id, state, done, total]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "two-block plans: integrity, numeric, frame, dedup, autolabel, vlm, final; funnel plans (tasks made before): also verdict, and profile_vlm for a task made before the skill profile was retired; then report and verify (a task that ran before the export was retired also has export); subtasks add adjudicate; new modules may add stages"}
        block: {enum: [cpu, vlm], description: "the block the stage belongs to (two-block plans, design doc 17 §3); absent on funnel plans and on the steps after both blocks"}
        full_set: {type: boolean, description: "a full-set stage: it starts once the earlier stages of its block are done (dedup, profile)"}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped]}
        done: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        eta_s: {type: [number, "null"]}
        note: {type: string, description: "e.g. why total dropped from 50 to 49"}
        pipeline: {$ref: "#/components/schemas/PipelineActivity"}
    PipelineActivity:
      type: object
      additionalProperties: false
      required: [inflight, queued, capacity, dispatches, recent, started_at, finished_at, updated_at]
      description: Current invocation of the persistent funnel. Inflight counts admitted episodes awaiting durable completion, including worker setup. Dispatches are layer-local arrivals, not a barrier shared across layers.
      properties:
        inflight: {type: integer, minimum: 0}
        queued: {type: integer, minimum: 0}
        capacity: {type: integer, minimum: 1}
        dispatches: {type: integer, minimum: 0}
        started_at: {type: [integer, "null"], description: Epoch milliseconds}
        finished_at: {type: [integer, "null"], description: Epoch milliseconds}
        updated_at: {type: integer, description: Epoch milliseconds of this snapshot}
        processing:
          type: object
          additionalProperties: false
          required: [count, total_s, mean_s, min_s, max_s]
          description: Per-episode processing durations; excludes dispatch and CPU admission waits. Shared module execution is counted once per episode in this layer.
          properties:
            count: {type: integer, minimum: 0}
            total_s: {type: number, minimum: 0}
            mean_s: {type: [number, "null"]}
            min_s: {type: [number, "null"]}
            max_s: {type: [number, "null"]}
        busy:
          type: array
          maxItems: 64
          description: >-
            Spans (epoch milliseconds) during which this layer had episodes out, oldest first; the
            last one is open (end null) while episodes are out now. Between started_at and
            finished_at (or now) the rest is waiting. Past 64 spans the two separated by the
            shortest wait are merged.
          items:
            type: object
            additionalProperties: false
            required: [start, end]
            properties:
              start: {type: integer}
              end: {type: [integer, "null"]}
        held_by_downstream:
          type: boolean
          description: >-
            The layer has episodes waiting to enter but hands none out because the next layer's
            queue is full (it holds at most max(2 x batch size, that layer's width)).
        recent:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [number, count, episodes, at]
            properties:
              number: {type: integer, minimum: 1}
              count: {type: integer, minimum: 1}
              episodes: {type: array, maxItems: 16, items: {type: integer, minimum: 0}, description: First 16 episode indices of this dispatch}
              at: {type: integer, description: Epoch milliseconds of dispatch}
    ModuleState:
      type: object
      additionalProperties: false
      required: [id, name, selected, availability, state, episodes_total, episodes_error]
      properties:
        id: {$ref: "#/components/schemas/ModuleId"}
        name: {type: string}
        selected: {type: boolean}
        availability: {enum: [available, needs_input, unsupported]}
        unavailable_reason: {type: [string, "null"]}
        state: {enum: [pending, running, succeeded, completed_with_errors, failed, skipped, stale]}
        episodes_total: {type: integer, minimum: 0}
        episodes_error: {type: integer, minimum: 0}
        elapsed_s: {type: [number, "null"]}
        error: {type: [string, "null"]}
    Summary:
      type: object
      additionalProperties: false
      required: [total, passed, rejected, held, review, pass_rate]
      properties:
        total: {type: integer, minimum: 0}
        passed: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        held: {type: integer, minimum: 0}
        review: {type: integer, minimum: 0}
        pass_rate: {type: [number, "null"]}
        skipped:
          type: integer
          minimum: 0
          description: >-
            episodes left out because source files are missing (D40, as v1 does): not checked, in
            none of the lists and not part of total; the report lists them
    UsageTotals:
      type: object
      additionalProperties: false
      required: [prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    TaskListItem:
      type: object
      additionalProperties: false
      required: [id, name, state, dataset, created_at, progress, summary, pending_adjudication, modules,
                 module_counts, usage]
      properties:
        id: {type: string}
        name: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        dataset: {type: string}
        dataset_id: {type: [string, "null"]}
        created_at: {type: integer}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        pending_adjudication: {type: integer, minimum: 0}
        active_subtask: {type: [string, "null"]}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}, description: "selected modules, registry order"}
        module_counts: {type: object, additionalProperties: {type: integer, minimum: 0}, description: "selected modules per ModuleState state"}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        deleted_at: {type: [integer, "null"]}
    Task:
      type: object
      additionalProperties: false
      required: [id, name, state, input, output, episodes, modules, params, progress, result_rev,
                 pending_adjudication, usage, created_at, updated_at, links]
      properties:
        id: {type: string}
        name: {type: string}
        note: {type: [string, "null"]}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null]}
        input: {$ref: "#/components/schemas/InputRef"}
        dataset_id: {type: [string, "null"], description: "the registered dataset (D36)"}
        output: {$ref: "#/components/schemas/OutputRef"}
        run_id: {type: [string, "null"]}
        episodes: {$ref: "#/components/schemas/EpisodeSelector"}
        embodiment_id: {type: [string, "null"]}
        vlm:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/TaskVlm"
        params: {$ref: "#/components/schemas/TaskParams"}
        source:
          type: [object, "null"]
          description: source manifest summary frozen at start (D27)
          properties:
            objects: {type: integer}
            bytes: {type: integer}
            digest: {type: string}
        progress:
          type: object
          required: [stages]
          properties:
            stages: {type: array, items: {$ref: "#/components/schemas/StageProgress"}}
        modules: {type: array, items: {$ref: "#/components/schemas/ModuleState"}}
        summary: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Summary"}]}
        result_rev: {type: integer, minimum: 0}
        usage: {$ref: "#/components/schemas/UsageTotals"}
        pending_adjudication: {type: integer, minimum: 0}
        active_subtask: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Subtask"}]}
        created_at: {type: integer}
        updated_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        deleted_at: {type: [integer, "null"]}
        links: {$ref: "#/components/schemas/Links"}
    Subtask:
      type: object
      additionalProperties: false
      required: [id, task_id, kind, scope, state, created_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        kind: {enum: [retry, resume, apply_adjudication]}
        scope:
          type: object
          properties:
            modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
            episodes: {enum: [errors, all]}
            relabel_rerun: {enum: [v1, full], description: "apply_adjudication only (D39)"}
        state: {$ref: "#/components/schemas/TaskState"}
        state_reason: {type: [string, "null"]}
        pause_reason: {enum: [user, system, null], description: "only while pausing or paused"}
        progress: {type: [object, "null"]}
        created_at: {type: integer}
        started_at: {type: [integer, "null"]}
        finished_at: {type: [integer, "null"]}
        result_rev: {type: [integer, "null"], description: "the revision this subtask produced"}
    SubtaskCreated:
      type: object
      additionalProperties: false
      required: [subtask, links]
      properties:
        subtask: {$ref: "#/components/schemas/Subtask"}
        links: {$ref: "#/components/schemas/Links"}
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [at, kind, text]
      properties:
        at: {type: integer}
        kind: {enum: [created, started, system_pause, system_resume, user_pause, user_resume, stopped, failed,
                      finished, subtask_started, subtask_finished, revision]}
        subtask_id: {type: [string, "null"]}
        revision: {type: [integer, "null"]}
        state: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/TaskState"}]}
        text: {type: string}
    LogLine:
      type: object
      additionalProperties: false
      required: [ts, stage, level, msg]
      properties:
        ts: {type: integer}
        stage: {type: string}
        subtask_id: {type: [string, "null"]}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
        episode_index: {type: [integer, "null"]}
    UsageRow:
      type: object
      additionalProperties: false
      required: [subtask_id, module_id, call_kind, model_name, prompt_tokens, completion_tokens, reasoning_tokens, cached_tokens, requests, requests_unknown_usage]
      properties:
        subtask_id: {type: string, description: "empty = main run"}
        module_id: {type: string}
        call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
        model_name: {type: string}
        prompt_tokens: {type: integer, minimum: 0}
        completion_tokens: {type: integer, minimum: 0}
        reasoning_tokens: {type: integer, minimum: 0}
        cached_tokens: {type: integer, minimum: 0}
        requests: {type: integer, minimum: 0}
        requests_unknown_usage: {type: integer, minimum: 0}
    UsageReport:
      type: object
      additionalProperties: false
      required: [totals, actual, attributed]
      description: totals sum the actual ledger only; attributed splits merged requests across modules and must never be added to it
      properties:
        totals: {$ref: "#/components/schemas/UsageTotals"}
        actual: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}
        attributed: {type: array, items: {$ref: "#/components/schemas/UsageRow"}}

    # ---------- report
    PipelineEpisode:
      type: object
      additionalProperties: false
      required: [episode_index, reason, verdict, verdict_reason]
      properties:
        episode_index: {type: integer, minimum: 0}
        last_stage: {enum: [integrity, numeric, frame, vlm], description: "a funnel run (tasks made before 2.2.0): the last stage it went through"}
        next_stage: {enum: [numeric, frame, vlm, done], description: "a funnel run: where it goes next"}
        reason: {type: [string, "null"], description: "missing: left out, its source files are gone (D40); a funnel run's gate: stopped there"}
        verdict: {type: [string, "null"], enum: [keep, drop, held, null]}
        verdict_reason: {type: [string, "null"]}
        stages:
          type: object
          description: >-
            two-block runs (design doc 17 §5.5): every per-episode stage of both blocks - done (or error, when one
            of its modules failed on the episode), running, or waiting
          propertyNames: {pattern: "^[a-z][a-z0-9_]*$"}
          additionalProperties: {enum: [waiting, running, done, error]}
        provisional:
          type: boolean
          description: >-
            the verdict is the policy applied to the findings so far, not the final one (two-block
            pipelines: the final verdict is only given by aggregate)
        processing_s: {type: [number, "null"], description: Sum of completed layer processing times for this episode; excludes queue and CPU admission waits}
        stage_processing_s:
          type: object
          additionalProperties: false
          properties:
            integrity: {type: number, minimum: 0}
            numeric: {type: number, minimum: 0}
            frame: {type: number, minimum: 0}
            vlm: {type: number, minimum: 0}
        modules:
          type: object
          description: Present on the single-episode endpoint
          additionalProperties: {$ref: "./cli/result-record.schema.json"}
    EpisodeView:
      type: object
      additionalProperties: false
      required: [episode_index, revision, list, modules, videos]
      properties:
        episode_index: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        list: {enum: [passed, reject, held]}
        reasons: {type: array, items: {$ref: "#/components/schemas/EpisodeNote"}, description: "why it is in its list"}
        review:
          type: array
          items: {$ref: "#/components/schemas/EpisodeNote"}
          description: >-
            what a person is asked about it, questions of the adjudication page first; the
            abstentions of other modules follow (shown, never queued)
        task_text:
          type: object
          properties:
            text: {type: string}
            source: {type: string}
        modules:
          type: object
          description: module id -> result record (cli/result-record.schema.json)
          additionalProperties: {$ref: "./cli/result-record.schema.json"}
        evidence:
          type: array
          items:
            type: object
            required: [module, path]
            properties:
              module: {type: string}
              path: {type: string, description: "sign with scope=delivery"}
              kind: {type: string}
        videos:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [camera, scope, path]
            properties:
              camera: {type: string}
              scope: {enum: [delivery, input]}
              origin: {enum: [clip, source_dataset]}
              path: {type: string}
              from_ts: {type: number}
              to_ts: {type: number}
        findings:
          type: array
          items: {$ref: "#/components/schemas/EpisodeFinding"}
          description: >-
            findings revisions (C2 2.0, 2.3.0): every finding of the episode, every module, with the
            level it has in this revision (its list entry's: the task's policy after the applied human
            decisions)
        fps:
          type: [number, "null"]
          description: >-
            2.4.0: the dataset's fps from the task's preflight, to read a finding's frames as seconds;
            null for mcap (its checks run at each episode's action rate: getTaskEpisodeViz check_clock)
        dataset_id:
          type: [string, "null"]
          description: 2.4.0, the task's registration while it exists (the mini player's 在可视化页打开)
    EpisodeFinding:
      type: object
      additionalProperties: false
      required: [module, level, appealable, finding]
      properties:
        module: {$ref: "#/components/schemas/ModuleId"}
        level: {$ref: "#/components/schemas/FindingLevel"}
        line: {$ref: "#/components/schemas/ReviewLineId", description: "review: the line it is asked on"}
        appealable: {type: boolean, description: "a reject it causes may be appealed (D42)"}
        human: {type: boolean, description: "a person's conclusion (adjudication), not a module's finding"}
        finding: {$ref: "./cli/common.schema.json#/$defs/finding"}
    TaskEpisode:
      type: object
      additionalProperties: false
      required: [episode_index, list, review, reason_modules, review_modules]
      properties:
        episode_index: {type: integer, minimum: 0}
        list: {enum: [passed, reject, held]}
        review: {type: boolean, description: "a person still has to answer something about it (see listTaskEpisodes)"}
        reason_modules:
          type: array
          items: {$ref: "#/components/schemas/ModuleId"}
          description: the modules that put it in its list - the deciding modules of a reject, the failed modules of a held one, none when passed
        review_modules:
          type: array
          items: {$ref: "#/components/schemas/ModuleId"}
          description: the source modules of the open questions
        items:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyItemId"}
          description: findings revisions (C2 2.0) only - the taxonomy items of its findings, every module together, in taxonomy order
        levels:
          type: array
          items: {$ref: "#/components/schemas/FindingLevel"}
          description: findings revisions (C2 2.0) only - the levels its findings have (the task's policy after the applied human decisions), blocking first
    TaskEpisodePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more, total, counts, revision]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/TaskEpisode"}}
        next_cursor: {type: [string, "null"]}
        has_more: {type: boolean}
        total: {type: integer, minimum: 0, description: "episodes matching the filters"}
        counts:
          type: object
          additionalProperties: false
          required: [all, passed, reject, held, review]
          description: the whole revision, filters ignored
          properties:
            all: {type: integer, minimum: 0}
            passed: {type: integer, minimum: 0}
            reject: {type: integer, minimum: 0}
            held: {type: integer, minimum: 0}
            review: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
    SyncCurves:
      type: object
      additionalProperties: false
      required: [episode_index, revision, verdict, lag_tol_s, window_s, cameras]
      properties:
        episode_index: {type: integer, minimum: 0}
        revision: {type: integer, minimum: 1}
        verdict: {type: [string, "null"], description: "the episode-level reading: aligned, annotated, undecidable, misaligned_all"}
        consensus_lag_s: {type: [number, "null"], description: "the lag every trusted camera agrees on, when they do"}
        lag_tol_s: {type: number, description: "readings within +/- this are aligned (the green band)"}
        window_s: {type: number, description: "the cross-correlation is drawn for lags within +/- this"}
        cameras: {type: array, items: {$ref: "#/components/schemas/SyncCurveCamera"}}
    SyncCurveCamera:
      type: object
      additionalProperties: false
      required: [camera, t, flow, speed, lags, xcorr, peak]
      properties:
        camera: {type: string}
        t: {type: array, items: {type: [number, "null"]}, description: "seconds from the episode start"}
        flow: {type: array, items: {type: [number, "null"]}, description: "picture motion (optical-flow energy) at t"}
        speed: {type: array, items: {type: [number, "null"]}, description: "arm motion (joint speed) at t"}
        lags: {type: array, items: {type: [number, "null"]}, description: "seconds; > 0 = the picture is later than the motion"}
        xcorr: {type: array, items: {type: [number, "null"]}, description: "cross-correlation at each lag"}
        lag_s: {type: [number, "null"], description: "the check's reading"}
        corr_peak: {type: [number, "null"]}
        code: {type: [string, "null"], description: "aligned, misaligned, ambiguous_peak, flat_peak, low_corr, no_motion"}
        trusted: {type: [boolean, "null"]}
        peak:
          description: the reading on the drawn curve; null when there is none or it lies outside the window
          oneOf:
            - {type: "null"}
            - type: object
              additionalProperties: false
              required: [lag_s, corr]
              properties:
                lag_s: {type: number}
                corr: {type: number}
    EpisodeNote:
      type: object
      additionalProperties: false
      required: [module, text]
      description: >-
        one line of an episode's reasons or review, shaped like C2 final-list reasons: kind is a reason kind of C2 final-list
        (2.0: finding, human, execution_error, duplicate; 1.0: hard_gate, soft_score, duplicate, human, execution_error) or a
        review kind; a 2.0 reason names its finding code, the code's taxonomy item and whether it may be appealed
      properties:
        module: {$ref: "#/components/schemas/ModuleId"}
        kind: {type: string}
        text: {type: string}
        priority: {type: string}
        duplicate_of: {type: integer, minimum: 0}
        code: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "2.0: the finding code (registry 2.x)"}
        item: {type: [string, "null"], description: "2.0: the taxonomy item of the code (C6), null for a code without one"}
        appealable: {type: boolean, description: "2.0: the code may be appealed (D42)"}
    Perf:
      type: object
      additionalProperties: false
      required: [revision, scope, latency, stages]
      properties:
        revision: {type: integer, minimum: 1}
        scope: {enum: [all, main, subtask]}
        subtask_id: {type: [string, "null"]}
        backend: {type: object, description: "model service used (v1 perf_backend)"}
        container: {type: object, description: "CPU / memory quota (v1 perf_env)"}
        latency:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [call_kind, count, p50_s, p90_s, p99_s, wall_s]
            properties:
              call_kind: {type: string, pattern: "^[a-z][a-z0-9_]*$", description: "v1: probe, endstate, arbitration, caption, llm; merged; new modules name their own"}
              count: {type: integer, minimum: 0}
              failed: {type: integer, minimum: 0}
              hedged: {type: integer, minimum: 0}
              p50_s: {type: number}
              p90_s: {type: number}
              p99_s: {type: number}
              wall_s: {type: number, description: "first sent to last returned - never count x mean"}
        effective_concurrency: {type: [number, "null"]}
        stages:
          type: array
          items:
            type: object
            required: [id, wall_s]
            properties:
              id: {type: string}
              wall_s: {type: number}
              share: {type: number}
        retries:
          type: object
          properties:
            outer_attempts: {type: integer, minimum: 0}
            rescued: {type: integer, minimum: 0}
        merge:
          type: object
          properties:
            requests: {type: integer, minimum: 0}
            estimated_unmerged: {type: integer, minimum: 0}
        redone_after_interruption: {type: integer, minimum: 0, description: "D26"}
    AdjudicationQuestion:
      type: object
      additionalProperties: false
      required: [line, source_module, reason]
      properties:
        line: {$ref: "#/components/schemas/ReviewLineId"}
        source_module: {$ref: "#/components/schemas/ModuleId"}
        reason: {type: string}
        duplicate_of: {type: [integer, "null"], minimum: 0, description: "an appeal of a dedup reject: the episode it duplicates"}
        annotation: {type: [string, "null"]}
        caption: {type: [string, "null"]}
        suggestion: {type: [string, "null"], description: "a task text the model read off the video: what a person may send back as new_label"}
        priority: {type: [string, "null"]}
        latest_decision: {oneOf: [{type: "null"}, {$ref: "#/components/schemas/Decision"}]}
        codes:
          type: array
          items: {type: string, pattern: "^[a-z][a-z0-9_]*$"}
          description: "findings revisions (2.3.0): the finding codes of the source module the question is about"
        items:
          type: array
          items: {$ref: "#/components/schemas/TaxonomyItemId"}
          description: "findings revisions (2.3.0): their taxonomy items"
    AdjudicationCard:
      type: object
      additionalProperties: false
      required: [episode_index, status, questions]
      properties:
        episode_index: {type: integer, minimum: 0}
        status: {enum: [pending, decided, unsure, applied]}
        questions: {type: array, minItems: 1, items: {$ref: "#/components/schemas/AdjudicationQuestion"}}
    AdjudicationCounts:
      type: object
      additionalProperties: false
      description: >-
        All three count cards (episodes) over the whole task, not the filtered page. pending and
        decided cover the cards whose questions belong to lines with counts_as_pending - appeal
        candidates are optional and never pending; unapplied covers both tabs: cards with an
        answer that was not executed yet ('unsure' is not one). pending is what the task's
        pending_adjudication shows.
      required: [decided, pending, unapplied]
      properties:
        decided: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        unapplied: {type: integer, minimum: 0}
    DecisionFields:
      type: object
      required: [episode_index, line, decision]
      properties:
        episode_index: {type: integer, minimum: 0}
        line: {$ref: "#/components/schemas/ReviewLineId"}
        decision:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          description: >-
            one of the line's decisions in the registry, on a question the episode's card has;
            anything else is 400 validation_failed. One card asks one question. Today:
            task_verdict - success, failure, unsure, discard;
            reject_appeal - restore, keep_rejected, unsure; eef_check - consistent, inconsistent, unsure; integrity_check - intact, broken, unsure
        new_label: {type: [string, "null"], description: "task_verdict only, optional: a task text the person rewrote while judging the episode; the episode is judged again under it"}
        note: {type: [string, "null"]}
    AdjudicationApply:
      type: object
      additionalProperties: false
      properties:
        relabel_rerun:
          enum: [v1, full]
          default: v1
          description: >-
            How task success is judged again for relabelled episodes that have no human task
            verdict (D39). v1: what v1's rejudge runs - multi-view scoring and the per-camera
            end-state vote only, no task-type step, camera hints, reject guard or evidence
            arbitration; verdicts and calls match v1. full: the first run's complete flow, so
            the same decisions may end differently from v1. Episodes a person judged success
            or failure are not judged again either way.
    DecisionInput:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
      unevaluatedProperties: false
    Decision:
      allOf:
        - $ref: "#/components/schemas/DecisionFields"
        - type: object
          required: [id, decided_by, decided_at, applied]
          properties:
            id: {type: integer}
            decided_by: {type: string}
            decided_at: {type: integer}
            applied: {type: boolean}
      unevaluatedProperties: false

    # ---------- system
    SignedUrl:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: {type: string}
        expires_at: {type: integer}
        from_ts: {type: number, description: "v3 sources: play url#t=from,to"}
        to_ts: {type: number}
    DatasetSignRequest:
      type: object
      additionalProperties: false
      required: [requests]
      properties:
        ttl: {type: integer, minimum: 60, maximum: 3600, default: 1800, description: seconds}
        requests:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/DatasetSignItem"}
    DatasetSignItem:
      description: >-
        One read to sign: `get` - an object by its full key in the bucket (no leading `/`);
        `list` - one ListObjectsV2 page under `prefix`, `continuation_token` being the previous
        page's `NextContinuationToken`.
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, key]
          properties:
            op: {const: get}
            key: {type: string, minLength: 1, maxLength: 1024}
        - type: object
          additionalProperties: false
          required: [op, prefix]
          properties:
            op: {const: list}
            prefix: {type: string, minLength: 1, maxLength: 1024}
            delimiter: {const: "/"}
            continuation_token: {type: string, minLength: 1, maxLength: 4096}
            max_keys: {type: integer, minimum: 1, maximum: 1000, default: 1000}
    DatasetSignResponse:
      type: object
      additionalProperties: false
      required: [expires_at, urls]
      properties:
        expires_at: {type: integer, description: "epoch milliseconds, as in SignedUrl"}
        urls:
          type: array
          description: one presigned URL per request, in the same order
          items: {type: string}
    Readiness:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: {enum: [ok, not_ready]}
        checks:
          type: object
          additionalProperties: false
          required: [db_writable, master_key, workdir_writable, scratch_writable, reconciled]
          properties:
            db_writable: {type: boolean}
            master_key: {type: boolean}
            workdir_writable: {type: boolean}
            scratch_writable: {type: boolean}
            reconciled: {type: boolean}
    SseState:
      type: object
      required: [state, at]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        pause_reason: {enum: [user, system, null]}
        subtask_id: {type: [string, "null"], description: "set when the change is a subtask's"}
        reason: {type: [string, "null"], description: "state_reason, Chinese"}
        at: {type: integer}
    SseProgress:
      $ref: "#/components/schemas/StageProgress"
    SseLog:
      type: object
      required: [stage, level, msg]
      properties:
        stage: {type: string}
        level: {enum: [error, warn, info, debug]}
        msg: {type: string}
    SseUsage:
      $ref: "#/components/schemas/UsageTotals"
    SseDone:
      type: object
      required: [state]
      properties:
        state: {$ref: "#/components/schemas/TaskState"}
        failed_modules: {type: array, items: {$ref: "#/components/schemas/ModuleId"}}
        subtask_id: {type: [string, "null"]}
        reason: {type: [string, "null"]}
    # ---------- the data visualizer (design doc 18, 2.4.0)
    VizStatus:
      type: object
      additionalProperties: false
      required: [state, reason]
      description: whether the visualizer can open the dataset
      properties:
        state:
          enum: [ready, mapping_pending, unsupported]
          description: "mapping_pending: an mcap dataset whose field mapping is not confirmed (映射待确认)"
        reason: {type: [string, "null"], description: "why not, in Chinese"}
    VizFormat:
      type: object
      additionalProperties: false
      required: [kind, version, reader, layout]
      properties:
        kind: {enum: [lerobot, mcap, lance, lancedb, rrd, unknown], description: "as the visualizer reads it: a lerobot-lancedb 0.1-0.2 dataset (which the preflight takes for LeRobot) is lance"}
        version: {enum: [v2, v3, null]}
        reader: {enum: [lerobot, mcap, lance, null], description: "the reader serving it; null = none (Lance tables without LeRobot metadata, rrd ...)"}
        layout:
          enum: [lance-0.3, lance-0.2-video, lance-0.2-frames, null]
          description: |
            Lance: which lerobot-lancedb layout (design doc 19 §4.2) - 0.3's frames / videos / meta
            tables, 0.1-0.2's frames table with a videos table beside it, or with a JPEG column per
            camera; null for the other formats. 2.5.0
    VizAccess:
      enum: [direct, local, remux, frames, transcode, blob, unsupported]
      description: |
        How a camera reaches the browser (design doc 18 §4.2, D60). direct: a presigned (or the
        public bucket's) TOS URL; local: the Daemon serves the file of a local dataset; remux: the
        Daemon rewraps the stream into fragmented mp4 without re-encoding; frames: a JPEG frame pack
        drawn on a canvas; transcode: the Daemon re-encodes to H.264 (CURATOR_VIZ_TRANSCODE, the
        player tags it 平台转码); blob: the Daemon serves, by Range, the mp4 kept in a Lance table's
        blob column (2.5.0, design doc 19 §4.3); unsupported: cannot be shown, `reason` says why.
    VizCameraKey:
      type: string
      pattern: "^[0-9A-Za-z_-]{1,96}$"
      description: URL-safe camera key (LeRobot short name; mcap topic with / turned into _)
    VizCamera:
      type: object
      additionalProperties: false
      required: [key, name, source, kind, access, codec, codec_string, width, height, fps, transcoded, reason]
      properties:
        key: {$ref: "#/components/schemas/VizCameraKey"}
        name: {type: string}
        source: {type: string, description: "the LeRobot feature key or the mcap topic"}
        kind: {enum: [video, frames], description: "video: an mp4 for <video>; frames: a JPEG frame pack"}
        access: {$ref: "#/components/schemas/VizAccess"}
        codec: {type: [string, "null"], description: "av1, h264, hevc, mpeg4, jpeg, png, raw ..."}
        codec_string: {type: [string, "null"], description: "RFC 6381 codecs parameter for the player's decoding check (av01..., avc1..., hvc1...)"}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        fps: {type: [number, "null"]}
        pix_fmt: {type: [string, "null"]}
        transcoded: {type: boolean, description: "the Daemon re-encodes it (access transcode)"}
        reason: {type: [string, "null"], description: "why transcode or unsupported, in Chinese"}
    VizLine:
      type: object
      additionalProperties: false
      required: [name, role]
      properties:
        name: {type: string}
        role: {enum: [state, action, other], description: "state solid, action dashed"}
        source: {type: string, description: "the feature key or topic"}
        dim: {type: [integer, "null"], description: "its position in the source's vector"}
        unit: {type: [string, "null"]}
    VizStream:
      type: object
      additionalProperties: false
      required: [key, kind, name, unit, lines, smart, available, reason, sources]
      properties:
        key: {type: string, pattern: "^[0-9A-Za-z_.-]{1,128}$"}
        kind: {enum: [series, depth, pointcloud, transform, text, event, image_sequence]}
        name: {type: string}
        unit: {type: [string, "null"]}
        lines: {type: array, items: {$ref: "#/components/schemas/VizLine"}, description: "series: one per drawn number, state and action of the same name together"}
        smart: {type: boolean, description: "placed by the smart layout"}
        available: {type: boolean, description: "false: listed (field tree, + menu) but not drawable in this phase"}
        reason: {type: [string, "null"]}
        sources: {type: array, items: {type: string}, description: "feature keys or topics it is read from"}
        rate_hz: {type: [number, "null"]}
    VizAnnotationSource:
      type: object
      additionalProperties: false
      required: [key, kind, name, format, source, supported, reason, primary]
      properties:
        key: {type: string, pattern: "^[0-9A-Za-z_.:-]{1,96}$"}
        kind: {enum: [segments, events, labels]}
        name: {type: string, description: "the track's name (子任务, 机器人分步, 外部标注 ...)"}
        format:
          type: string
          description: >-
            the recognised layout (design doc 18 §4.5): subtask_index, language_persistent,
            language_events, task_index, index_table, string_column, bool_segments, quality,
            episode_labels, argus, mcap_topic, mcap_attachment; open for later readers
        source: {type: string, description: "where it is read from, shown as 来源"}
        supported: {type: boolean, description: "false: something looks like annotations but its layout is unknown (标注格式不支持)"}
        reason: {type: [string, "null"]}
        primary: {type: boolean, description: "the track the subtitle bar shows first"}
    VizFieldNode:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {enum: [group, camera, series, depth, text, table, file, topic, metadata, attachment, other]}
        dtype: {type: [string, "null"]}
        shape: {type: [array, "null"], items: {type: integer}}
        names: {type: [array, "null"], items: {type: string}}
        detail:
          type: object
          description: attributes shown in the detail pane
          additionalProperties: {type: [string, number, boolean, "null"]}
        camera: {$ref: "#/components/schemas/VizCameraKey"}
        stream: {type: string, description: "the VizStream it is drawn as"}
        file: {type: string, description: "a metadata file getDatasetVizMeta can read"}
        children: {type: array, items: {$ref: "#/components/schemas/VizFieldNode"}}
    VizMappingState:
      type: object
      additionalProperties: false
      required: [state, version, name]
      properties:
        state:
          enum: [not_needed, none, confirmed, frozen]
          description: "not_needed: not mcap; none: an mcap dataset without a confirmed mapping; frozen: a task's (run.json)"
        version: {type: [integer, "null"], minimum: 1}
        name: {type: [string, "null"]}
    VizWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, description: "Chinese"}
    VizDataset:
      type: object
      additionalProperties: false
      required: [scope, id, dataset_id, name, format, fps, episode_count, episode_indices, total_frames,
                 robot_type, cameras, streams, annotation_sources, field_tree, mapping, transcode, warnings, fingerprint]
      properties:
        scope: {enum: [dataset, task]}
        id: {type: string, description: "the dataset id, or the task id for scope task"}
        dataset_id: {type: [string, "null"], description: "the registration; for scope task the task's, while it exists"}
        name: {type: string}
        format: {$ref: "#/components/schemas/VizFormat"}
        fps: {type: [number, "null"], description: "null for mcap: every topic keeps its own rate"}
        episode_count: {type: integer, minimum: 0}
        episode_indices: {type: [string, "null"], description: "every index in the grammar of --episodes when they are not 0 .. count-1"}
        total_frames: {type: [integer, "null"]}
        robot_type: {type: [string, "null"]}
        bytes: {type: [integer, "null"]}
        cameras: {type: array, items: {$ref: "#/components/schemas/VizCamera"}}
        streams: {type: array, items: {$ref: "#/components/schemas/VizStream"}}
        annotation_sources: {type: array, items: {$ref: "#/components/schemas/VizAnnotationSource"}}
        field_tree: {type: array, items: {$ref: "#/components/schemas/VizFieldNode"}}
        mapping: {$ref: "#/components/schemas/VizMappingState"}
        transcode:
          type: object
          additionalProperties: false
          required: [enabled]
          properties:
            enabled: {type: boolean, description: "CURATOR_VIZ_TRANSCODE"}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
        fingerprint: {type: string, description: "the metadata fingerprint the model and its caches belong to"}
    VizEpisodeItem:
      type: object
      additionalProperties: false
      required: [index, duration_s, frames, task]
      properties:
        index: {type: integer, minimum: 0}
        duration_s: {type: [number, "null"]}
        frames: {type: [integer, "null"]}
        task: {type: string, description: "empty when there is none"}
        steps:
          type: [array, "null"]
          description: the primary track's segments when the episode table has them (not read from the frames)
          items:
            type: object
            additionalProperties: false
            required: [start_s, end_s]
            properties:
              start_s: {type: number}
              end_s: {type: number}
              unqualified: {type: boolean}
    VizEpisodePage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [total]
          properties:
            items: {type: array, items: {$ref: "#/components/schemas/VizEpisodeItem"}}
            total: {type: integer, minimum: 0, description: "matches of the filter"}
    VizTimeline:
      type: object
      additionalProperties: false
      required: [kind, fps, frame_reference, frame_times]
      properties:
        kind: {enum: [frame, timestamp], description: "frame: frame = round(t x fps); timestamp: frame k sits at frame_times[k]"}
        fps: {type: [number, "null"]}
        frame_reference: {type: [string, "null"], description: "mcap: the topic whose messages number the frames"}
        frame_times: {type: [array, "null"], items: {type: number}, description: "mcap: the episode time of every frame"}
    VizCheckClock:
      type: object
      additionalProperties: false
      required: [offset_s, fps]
      description: "the checks' clock on the episode clock (task scope): t = offset_s + time_s, t = offset_s + frame / fps"
      properties:
        offset_s: {type: number}
        fps: {type: [number, "null"]}
    VizEpisodeCamera:
      type: object
      additionalProperties: false
      required: [key, kind, access, url, index_url, samples_url, transcode_url, from_ts, to_ts, offset_s, transcoded, expires_at, reason]
      properties:
        key: {$ref: "#/components/schemas/VizCameraKey"}
        kind: {enum: [video, frames]}
        access: {$ref: "#/components/schemas/VizAccess"}
        url: {type: [string, "null"], description: "video: what <video> plays; frames: the frame pack; null when unsupported"}
        index_url: {type: [string, "null"], description: "frames: the frame pack's index; with samples_url, the sample pack's (VizFrameIndex with key and codec_string)"}
        samples_url:
          type: [string, "null"]
          description: |
            2.5.0 (design doc 19 §3): an mcap H.264 / H.265 camera's sample pack - one Annex-B access
            unit per message back to back as the recording has them, indexed from the first keyframe
            with the stream's parameter sets (`VizFrameIndex.config`) - for the browser to decode
            itself (WebCodecs); it falls back to `url`. Null when CURATOR_VIZ_CLIENT_DECODE is off,
            for any other camera, or a stream without a keyframe, without parameter sets or with B
            slices.
        transcode_url: {type: [string, "null"], description: "the H.264 transcode to fall back to when the browser cannot decode url; null when transcoding is off or url already is one"}
        from_ts: {type: [number, "null"], description: "LeRobot v3: where the episode starts in the file (play url#t=from_ts,to_ts)"}
        to_ts: {type: [number, "null"]}
        offset_s: {type: number, description: "episode time of the camera's first frame (video time 0 after from_ts)"}
        transcoded: {type: boolean}
        expires_at: {type: [integer, "null"], description: "epoch ms when a presigned url stops working"}
        reason: {type: [string, "null"]}
    VizSegment:
      type: object
      additionalProperties: false
      required: [start_s, end_s, label]
      properties:
        start_s: {type: number}
        end_s: {type: number}
        label: {type: string}
        quality: {enum: [qualified, unqualified, null]}
        contribution: {type: [string, "null"], description: "Argus: advancing / wasteful / idle"}
        arm: {type: [string, "null"]}
        flags: {type: array, items: {type: string}, description: "boolean segment columns that hold (is_intervention_segment ...)"}
    VizTrack:
      type: object
      additionalProperties: false
      required: [key, name, source, primary, segments]
      properties:
        key: {type: string}
        name: {type: string}
        source: {type: string}
        primary: {type: boolean}
        segments: {type: array, items: {$ref: "#/components/schemas/VizSegment"}}
    VizEvent:
      type: object
      additionalProperties: false
      required: [t_s, label, source]
      properties:
        t_s: {type: number}
        label: {type: string}
        outcome: {type: [string, "null"]}
        source: {type: string}
    VizLabel:
      type: object
      additionalProperties: false
      required: [key, name, value, source]
      properties:
        key: {type: string}
        name: {type: string}
        value: {type: string}
        source: {type: string}
    VizAnnotations:
      type: object
      additionalProperties: false
      required: [tracks, events, labels, warnings]
      properties:
        tracks: {type: array, items: {$ref: "#/components/schemas/VizTrack"}}
        events: {type: array, items: {$ref: "#/components/schemas/VizEvent"}}
        labels: {type: array, items: {$ref: "#/components/schemas/VizLabel"}, description: "episode labels: success, rating, task_status ..."}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizEpisode:
      type: object
      additionalProperties: false
      required: [scope, id, index, duration_s, frames, fps, task, timeline, cameras, annotations, check_clock, warnings]
      properties:
        scope: {enum: [dataset, task]}
        id: {type: string}
        index: {type: integer, minimum: 0}
        duration_s: {type: number, minimum: 0}
        frames: {type: integer, minimum: 0}
        fps: {type: [number, "null"]}
        task:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [text, source]
              properties:
                text: {type: string}
                source: {type: string, description: "原始标注 / 人工改标 / 自产描述"}
        timeline: {$ref: "#/components/schemas/VizTimeline"}
        cameras: {type: array, items: {$ref: "#/components/schemas/VizEpisodeCamera"}}
        annotations: {$ref: "#/components/schemas/VizAnnotations"}
        check_clock:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizCheckClock"
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizSeries:
      type: object
      additionalProperties: false
      required: [stream, unit, from_s, to_s, t, lines, total_points, downsampled]
      properties:
        stream: {type: string}
        unit: {type: [string, "null"]}
        from_s: {type: number}
        to_s: {type: number}
        t: {type: array, items: {type: number}, description: "episode seconds, shared by every line"}
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, role, values]
            properties:
              name: {type: string}
              role: {enum: [state, action, other]}
              values: {type: array, items: {type: [number, "null"]}}
        total_points: {type: integer, minimum: 0, description: "raw samples in the window"}
        downsampled: {type: boolean}
    VizFrameIndex:
      type: object
      additionalProperties: false
      required: [camera, codec, width, height, count, t, offset, size, bytes]
      properties:
        camera: {$ref: "#/components/schemas/VizCameraKey"}
        codec: {enum: [jpeg, png, h264, h265], description: "h264 / h265: a sample pack (2.5.0)"}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        count: {type: integer, minimum: 0}
        t: {type: array, items: {type: number}, description: "episode seconds of every frame"}
        key: {type: array, items: {type: boolean}, description: "sample packs: whether each frame is a keyframe (decoding starts at one); 2.5.0"}
        codec_string: {type: [string, "null"], description: "sample packs: RFC 6381 codec string from the stream's own parameter sets (avc1.PPCCLL, hvc1....), for VideoDecoder.configure; 2.5.0"}
        config: {type: [string, "null"], description: "sample packs: the stream's parameter sets (H.264 SPS / PPS, H.265 VPS / SPS / PPS) as Annex-B, base64 - put in front of the keyframe decoding starts at, since a recording may send them only once; 2.5.0"}
        offset: {type: array, items: {type: integer}, description: "byte offset of every frame in the pack"}
        size: {type: array, items: {type: integer}}
        bytes: {type: integer, minimum: 0, description: "the pack's size"}
    VizMediaPending:
      type: object
      additionalProperties: false
      required: [state, progress, message]
      properties:
        state: {enum: [pending, failed]}
        progress: {type: [number, "null"], minimum: 0, maximum: 1}
        message: {type: string}
    VizMetaFile:
      type: object
      additionalProperties: false
      required: [path, size, truncated, kind, text]
      properties:
        path: {type: string}
        size: {type: integer, minimum: 0}
        truncated: {type: boolean}
        kind: {enum: [json, jsonl, text, markdown]}
        text: {type: string}
    VizMapping:
      $ref: "./viz-mapping.schema.json"
    DatasetMapping:
      type: object
      additionalProperties: false
      required: [dataset_id, state, mapping, version, updated_at, check_mapping, warnings]
      properties:
        dataset_id: {type: string}
        state: {enum: [none, confirmed]}
        mapping:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizMapping"
        version: {type: integer, minimum: 0, description: "0 = never confirmed"}
        updated_at: {type: [integer, "null"]}
        check_mapping:
          type: [object, "null"]
          description: the check reader's ingest.mcap_mapping derived from it (read-only, design doc 18 §6.2)
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    DatasetMappingPut:
      type: object
      additionalProperties: false
      required: [mapping]
      properties:
        mapping: {$ref: "#/components/schemas/VizMapping"}
    DatasetMappingInfo:
      type: object
      additionalProperties: false
      required: [state, version, updated_at, name]
      properties:
        state: {enum: [none, confirmed]}
        version: {type: integer, minimum: 0}
        updated_at: {type: [integer, "null"]}
        name: {type: [string, "null"]}
    DatasetAnnotationsInfo:
      type: object
      additionalProperties: false
      required: [upload_id, name, format, episodes, uploaded_at]
      properties:
        upload_id: {$ref: "#/components/schemas/UploadId"}
        name: {type: string}
        format: {type: string, description: "argus"}
        episodes: {type: integer, minimum: 0}
        uploaded_at: {type: integer}
    DatasetAnnotationsPut:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UploadId"
    McapProbeRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: {$ref: "#/components/schemas/InputSpec"}
        file: {type: string, minLength: 1, maxLength: 512, description: "an episode file to probe instead of the first"}
        template: {$ref: "#/components/schemas/VizTemplateId"}
    McapTopic:
      type: object
      additionalProperties: false
      required: [topic, schema, schema_encoding, message_encoding, count, rate_hz, start_s, end_s, image, fields, use, role, name, notes]
      properties:
        topic: {type: string}
        schema: {type: [string, "null"]}
        schema_encoding: {type: [string, "null"]}
        message_encoding: {type: [string, "null"]}
        count: {type: [integer, "null"]}
        rate_hz: {type: [number, "null"]}
        start_s: {type: [number, "null"], description: "first message, seconds after the file's first message"}
        end_s: {type: [number, "null"]}
        image:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [codec, width, height]
              properties:
                codec: {type: string}
                width: {type: [integer, "null"]}
                height: {type: [integer, "null"]}
        fields:
          type: [array, "null"]
          description: the numeric leaves of its first message
          items:
            type: object
            additionalProperties: false
            required: [path, size]
            properties:
              path: {type: string}
              size: {type: integer, minimum: 1}
        use: {enum: [camera, series, task, segments, ignore, unmapped], description: "what the draft does with it"}
        role: {enum: [state, action, other, null]}
        name: {type: string}
        notes: {type: array, items: {type: string}, description: "Chinese: high rate, unsupported encoding ..."}
    McapProbe:
      type: object
      additionalProperties: false
      required: [file, files, topics, metadata, attachments, draft, matched, warnings]
      properties:
        file: {type: string}
        files: {type: integer, minimum: 0, description: "episode files in the dataset"}
        topics: {type: array, items: {$ref: "#/components/schemas/McapTopic"}}
        metadata:
          type: object
          description: metadata records, by name, then key
          additionalProperties:
            type: object
            additionalProperties: {type: string}
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, media_type, size]
            properties:
              name: {type: string}
              media_type: {type: string}
              size: {type: integer, minimum: 0}
        draft: {$ref: "#/components/schemas/VizMapping"}
        matched:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [template_id, name, coverage]
              properties:
                template_id: {$ref: "#/components/schemas/VizTemplateId"}
                name: {type: string}
                coverage: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, items: {$ref: "#/components/schemas/VizWarning"}}
    VizTemplateId:
      type: string
      pattern: "^(builtin:[a-z0-9]+|vt-[a-z]{9})$"
    VizTemplate:
      type: object
      additionalProperties: false
      required: [id, name, description, builtin, mapping, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/VizTemplateId"}
        name: {type: string}
        description: {type: string}
        builtin: {type: boolean}
        mapping:
          description: null for the built-ins, which are rules applied to a probe (design doc 18 §6.3), not a fixed mapping
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/VizMapping"
        created_at: {type: [integer, "null"]}
        updated_at: {type: [integer, "null"]}
    VizTemplateCreate:
      type: object
      additionalProperties: false
      required: [name, mapping]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 2000}
        mapping: {$ref: "#/components/schemas/VizMapping"}
