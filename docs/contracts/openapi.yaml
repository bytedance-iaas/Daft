openapi: 3.1.0
info:
  title: Curator v2 API
  version: 4.0.0
  description: |
    ## Overview

    The REST API of the Physical AI Kit data quality-check platform: register robot datasets (LeRobot
    v2 / v3, mcap, Lance), run quality-check tasks over their episodes, read the verdicts, findings and
    reports, and adjudicate what needs a person. The delivery is the report: the platform does not
    write a curated dataset.
    The web console is built on this same API, so whatever it does can be done here. JSON in, JSON out,
    UTF-8. Each endpoint does one whole thing a user would name; no task needs a chain of calls.

    A typical run:

    1. Check: `GET /modules` lists the quality-check modules; `POST /preflight` checks a dataset
       against them in seconds (the result is kept 30 minutes); `POST /datasets` registers the dataset
       (a task created with a plain address registers it too).
    2. Create: `POST /tasks` with that `preflight_id` creates the task and, with `params.start_now`,
       starts it; otherwise call `POST /tasks/{id}/actions/start`.
    3. Follow: subscribe to SSE `GET {base}/events/tasks/{id}`, or poll `GET /tasks/{id}` every 5
       seconds.
    4. Read: `GET /tasks/{id}/report`, and the verdict and findings of each episode with
       `GET /tasks/{id}/episodes` and `GET /tasks/{id}/episodes/{index}`.
    5. Adjudicate: `GET /tasks/{id}/adjudication` lists what a person has to decide, `POST` on the same
       path records decisions, and `POST /tasks/{id}/adjudication/apply` executes them as a subtask that
       makes a new result revision.

    The `credentials` and `vlm` groups hold the TOS access keys and the VLM backends a task names,
    `uploads` takes the input files of module parameters, `viz` is the data visualizer and `overview`
    the console's first page.

    ## Conventions

    ### Mount prefix

    Every route lives under the mount prefix `{base}` (empty by default, `/curation` in production; the
    gateway does not strip it): the API under `{base}/api/v1`, SSE under `{base}/events`, the probes
    `/healthz` and `/readyz` both at the root and under `{base}`.

    ### Authentication

    HTTP Basic (`basicAuth`) on every route but the probes. A browser signed in to the console sends the
    credentials by itself on same-origin requests.

    ### Writes

    Write operations are asynchronous: they return the resource and its state, progress arrives over SSE
    or polling. Write endpoints accept only `application/json` - send `Content-Type: application/json`
    on every write, even without a body (`POST /tasks/{id}/actions/{action}`, `DELETE /tasks/{id}` and
    other writes have none) - and cross-site writes from a browser are refused (a `Sec-Fetch-Site` other
    than `same-origin`); there is no CORS.

    Every write takes an `Idempotency-Key` header: the same key within 24 hours returns the first
    successful response, so a retry after a timeout does not create a second task.

    ### Errors

    Errors use one body, `Error`: `code` is stable for programs, `message` is Chinese for people. A write
    that starts work and fails a pre-start check answers 422 `precheck_failed`, with `error.details`
    shaped as `PrecheckDetails`: one entry per check. A write that does not fit the current state
    answers 409 with a code that names the conflict (`task_state_conflict`, `subtask_active`,
    `dataset_in_use`, ...).

    ### Links

    Responses that point people at a page of the console carry `links`: absolute URLs when the site's
    public address is configured, otherwise relative paths with `absolute: false`.

    ### IDs

    IDs are opaque strings. Records made now get `<prefix>-<9 lowercase letters>` (task, sub, ds, pf,
    cred, vb, vm, upl; e.g. `task-kqzmrtbwe`); older records keep their `<prefix>_...` ID, and both work
    everywhere. IDs carry no time: lists sort by creation time.

    ## Changelog

    **2.5.1** (2026-10-05): the first published version of this reference. Every later version lists
    its changes here.

    **3.0.0** (2026-10-06): the skill profile is gone, and with it the module `skill_profile`, the
    `profile_vlm` stage and the `profile` plan stage. One adjudication card now asks one question: the
    `label` review line is gone, and a suspected conflict between a task text and the picture is part
    of the `task_verdict` question. An answer on that line may carry `new_label`, the task text the
    person rewrote while judging; it replaces the decisions `adopt_suggestion`, `custom_label` and
    `keep_label`. Follow-up questions are gone (`follow_ups` on a review line, `follow_up_of` on a
    question).

    **4.0.0** (2026-10-07): the platform delivers the quality report, not a curated dataset. Gone with
    the export: `POST /tasks/{id}/reexport`, the subtask kind `reexport`, `delivery_stale` on a task,
    `params.export`, the overview's `todo.delivery_pending`, and the episode video origin
    `delivery_dataset` (an episode's cameras now play from the source dataset, or from a clip cut for
    the adjudication page). The delivery directory itself stays: a task's run directory - the result
    revisions, the report and its details - is synced into `<delivery>/<run_id>/`, read back, and marked
    `_COMPLETE`; `latest` still points at the newest complete batch.
  x-description-zh: |
    ## 概览

    Physical AI Kit 数据质检平台的 REST API：登记机器人数据集（LeRobot v2 / v3、mcap、Lance），对其中的 episode 跑质检任务，读取判决、发现与质检报告，人工裁决需要人来判断的条目。交付的是质检报告，平台不再写交付数据集。网页控制台用的就是这套 API，控制台能做的事都能通过它完成。请求与响应都是 JSON，UTF-8 编码。每个接口完成一件完整的事，不需要连着调几个接口才办成一件事。

    一次典型的质检：

    1. 检查：`GET /modules` 列出质检模块；`POST /preflight` 几秒内查出数据集能跑哪些模块（结果保留 30 分钟）；`POST /datasets` 登记数据集（直接用地址建任务时也会自动登记）。
    2. 建任务：`POST /tasks` 带上预检得到的 `preflight_id` 创建任务，`params.start_now` 为 true 时建完就开始，否则再调 `POST /tasks/{id}/actions/start`。
    3. 跟进度：订阅 SSE `GET {base}/events/tasks/{id}`，或每 5 秒轮询一次 `GET /tasks/{id}`。
    4. 看结果：`GET /tasks/{id}/report` 是质检报告，每条 episode 的判决与发现用 `GET /tasks/{id}/episodes` 和 `GET /tasks/{id}/episodes/{index}` 读取。
    5. 人工裁决：`GET /tasks/{id}/adjudication` 列出需要人来判断的条目，对同一路径 `POST` 记录决定，`POST /tasks/{id}/adjudication/apply` 以子任务执行这些决定并产生新的结果版本。

    `credentials`、`vlm` 两组管理任务用到的 TOS 访问密钥和 VLM 后端，`uploads` 上传模块参数需要的文件，`viz` 是数据可视化，`overview` 是控制台首页的数据。

    ## 约定

    ### 挂载前缀

    所有路径都在挂载前缀 `{base}` 之下（缺省为空，生产环境是 `/curation`；网关转发时不去掉前缀）：API 在 `{base}/api/v1`，SSE 在 `{base}/events`，探针 `/healthz`、`/readyz` 在根路径和 `{base}` 下都有。

    ### 鉴权

    除探针外都用 HTTP Basic 鉴权（`basicAuth`）。在浏览器里登录过控制台后，同源请求会自动带上凭据。

    ### 写请求

    写操作是异步的：立即返回资源和它的状态，进度通过 SSE 或轮询获取。写接口只接受 `application/json`：每个写请求都要带 `Content-Type: application/json`，没有请求体的也要带（比如 `POST /tasks/{id}/actions/{action}`、`DELETE /tasks/{id}`）；浏览器发出的跨站写请求一律拒绝（`Sec-Fetch-Site` 不是 `same-origin`），不支持 CORS。

    每个写请求都可以带 `Idempotency-Key` 请求头：24 小时内相同的 key 返回第一次成功的响应，超时重试不会重复建任务。

    ### 错误

    错误统一用一种响应体 `Error`：`code` 是给程序判断的稳定取值，`message` 是给人看的中文说明。会启动工作的写请求在开始前的检查没通过时返回 422 `precheck_failed`，`error.details` 是 `PrecheckDetails`，每项检查一条。与当前状态冲突的写请求返回 409，`code` 写明是哪种冲突（`task_state_conflict`、`subtask_active`、`dataset_in_use` 等）。

    ### 链接

    需要把人带到控制台某个页面的响应带有 `links`：配置了站点的公网地址时是完整网址，否则是相对路径，并带 `absolute: false`。

    ### ID

    ID 是不透明的字符串。现在新建的记录，ID 形如 `<前缀>-<9 个小写字母>`（task、sub、ds、pf、cred、vb、vm、upl，比如 `task-kqzmrtbwe`）；早先建的记录保留原来的 `<前缀>_…` 形式，两种在所有地方都能用。ID 不含时间，列表按创建时间排序。

    ## 变更记录

    **2.5.1**（2026-10-05）：本文档首次发布。之后每个版本的改动都记在这里。

    **3.0.0**（2026-10-06）：技能画像下线，模块 `skill_profile`、`profile_vlm` 档与 `profile` 阶段一并移除。
    裁决改成一张卡片只问一个问题：`label` 这条问题线去掉，「标注与画面疑似不符」并入 `task_verdict` 的问题；
    判成败时可以顺带带上 `new_label`，就是人改写的任务描述，原来的 `adopt_suggestion`、`custom_label`、
    `keep_label` 三个决定不再需要。追加问题机制去掉（问题线上的 `follow_ups`、问题上的 `follow_up_of`）。

    **4.0.0**（2026-10-07）：平台交付的是质检报告，不再写交付数据集。随导出一起去掉的有：
    `POST /tasks/{id}/reexport`、子任务种类 `reexport`、任务上的 `delivery_stale`、`params.export`、
    总览的 `todo.delivery_pending`，以及 episode 视频的来源 `delivery_dataset`（相机现在从源数据集放，
    或者放裁决页裁好的片段）。交付目录本身保留：任务的运行目录（结果版本、报告与明细）同步到
    `<交付>/<run_id>/`，回读无误后写 `_COMPLETE`；`latest` 仍指向最新的完整一批。
servers:
  - url: "{base}/api/v1"
    variables:
      base:
        default: ""
        description: mount prefix, e.g. /curation
security:
  - basicAuth: []
tags:
  - name: credentials
    description: >-
      TOS access keys that tasks and registered datasets read and deliver with: save (the identity
      is verified on save), list, update, delete, verify again; at most one is the default. Secrets
      are write-only, no response returns them. VLM API keys are stored with their backend (`vlm`).
    x-description-zh: 任务与已登记的数据集读写 TOS 用的访问密钥：保存（保存时验证身份）、列出、修改、删除、重新验证；最多一把设为默认。密钥只写不读，任何响应都不会返回。VLM 的 API Key 跟着它的后端保存（见 `vlm`）。
  - name: vlm
    description: >-
      VLM backends (Volcengine Ark or a custom endpoint) and their models, which a task's `vlm`
      names for the modules that ask a vision-language model: save, verify, refresh the model list,
      add / update / delete models, pick the default model. API keys are write-only.
    x-description-zh: VLM 后端（火山方舟或自定义端点）及其模型，任务的 `vlm` 指定调用视觉语言模型的模块用哪一个：保存、验证、刷新模型列表、添加 / 修改 / 删除模型、设置默认模型。API Key 只写不读。
  - name: datasets
    description: >-
      Before a task: the module list (`GET /modules`), the dataset registry (register, list, rename,
      recheck and re-preflight the fingerprints, sign reads for the ReRun viewer), browsing TOS
      prefixes and the HuggingFace cache bucket, episode previews, the preflight and the
      delivery-directory write probe.
    x-description-zh: 建任务之前用到的接口：模块清单（`GET /modules`）、数据集登记（登记、列出、改名、重新核对与重新预检指纹、为 ReRun 查看器签发读取地址）、浏览 TOS 前缀与 HuggingFace 缓存桶、episode 预览、预检，以及交付目录的写入探测。
  - name: overview
    description: >-
      The console's first page in one call: what needs attention, what is running, and the chosen
      period's numbers (tasks finished, episodes checked, pass rate, tokens).
    x-description-zh: 控制台首页的数据，一次取齐：需要处理的事、正在运行的任务，以及所选时间段的统计（完成的任务、质检的 episode、通过率、Token）。
  - name: tasks
    description: >-
      Quality-check tasks: create (one or a batch), edit (any field before it starts, name and note
      after), start / pause / resume / stop, delete and restore, delete its run directory on TOS,
      re-preflight, rebind keys, and the subtasks that retry and continue; a task's
      subtasks, plan, timeline, logs and token usage.
    x-description-zh: 质检任务：创建（单个或批量）、修改（开始前可改任何字段，开始后只能改名称和备注）、开始 / 暂停 / 继续 / 停止、删除与恢复、删除它在 TOS 上的运行目录、重新预检、重新绑定密钥，以及重试、继续运行、重新导出这些子任务；任务的子任务、执行计划、时间线、日志和 Token 用量。
  - name: report
    description: >-
      What a task found: the report and its detail tables, the episodes with their verdicts and
      findings (live ones while it runs: `pipeline/episodes`), sync curves, the performance profile,
      and adjudication (the open questions, recording decisions, applying them). They read a
      committed result revision; when its files are neither on the service's disk nor fetchable from
      the delivery directory, the answer is 404 not_found with details.reason run_dir_missing or
      revision_missing.
    x-description-zh: 任务的质检结果：报告及其明细表、每条 episode 的判决与发现（运行中的实时结果见 `pipeline/episodes`）、同步曲线、性能剖析，以及人工裁决（待裁的问题、记录决定、执行决定）。这些接口读已提交的结果版本；它的文件既不在服务的磁盘上、也没法从交付目录取回时，返回 404 not_found，details.reason 为 run_dir_missing 或 revision_missing。
  - name: system
    description: >-
      Plumbing: presigned URLs for evidence media (`GET /media/sign`), the SSE stream of one task
      (under `{base}/events`, not `{base}/api/v1`), and the liveness / readiness probes (no
      authentication, at the root and under `{base}`).
    x-description-zh: 基础接口：证据媒体的预签名地址（`GET /media/sign`）、单个任务的 SSE 事件流（在 `{base}/events` 下，不在 `{base}/api/v1` 下），以及存活 / 就绪探针（免鉴权，根路径和 `{base}` 下都有）。
  - name: uploads
    description: >-
      Input files of module parameters (parameters whose `format` is `upload`) and a dataset's
      external annotation files (`viz_annotations`), validated on arrival; the returned `handle`
      (`upload:<upload_id>`) is what a task's module `params` or a dataset names.
    x-description-zh: 模块参数要用的输入文件（`format` 为 `upload` 的参数）和数据集的外部标注文件（`viz_annotations`），上传时即校验；返回的 `handle`（`upload:<upload_id>`）填进任务模块的 `params` 或数据集登记里引用。
  - name: viz
    description: >-
      The data visualizer: one presentation model for a registered dataset (the visualize page) or a
      task's frozen input (the mini player of the report, the adjudication cards and the live
      episodes): episodes, curves, the cameras the service serves (mp4, frame and sample packs),
      mcap field mappings and the site's template library.
    x-description-zh: 数据可视化：已登记的数据集（「可视化」页）和任务冻结的输入（报告、人工裁决卡片与实时 episode 里的迷你播放器）用同一套展示模型：episode、曲线、由服务提供的相机画面（mp4、帧包与样本包）、mcap 字段映射和站点的模版库。

paths:
  # ---------------------------------------------------------------- credentials
  /credentials:
    get:
      tags: [credentials]
      operationId: listCredentials
      summary: List TOS access keys (never returns secrets)
      responses:
        "200":
          description: all access keys of the owner
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Credential"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [credentials]
      operationId: createCredential
      summary: Save an access key; verifies identity only (D30, doc 08 §4)
      description: |
        Saving never fails because verification failed: the key is stored and marked
        `failed` or `unverified`. Read and write permissions are checked against concrete
        buckets when a task starts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [credentials]
      operationId: updateCredential
      summary: Update; a secret left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Credential"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [credentials]
      operationId: deleteCredential
      summary: Delete (409 credential_in_use while a non-terminal task uses it)
      description: |
        Referenced only by finished tasks: requires `confirm=true`. Those tasks keep their
        reports, which then say the key is gone; rebind-credentials gives them another one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /credentials/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [credentials]
      operationId: verifyCredential
      summary: Verify identity again
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: verification result (also stored on the key)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- vlm backends
  /vlm-backends:
    get:
      tags: [vlm]
      operationId: listVlmBackends
      summary: List backends with their models
      responses:
        "200":
          description: backends
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/VlmBackend"}}
        default: {$ref: "#/components/responses/Error"}
    post:
      tags: [vlm]
      operationId: createVlmBackend
      summary: Add a backend with its API key; then try GET {endpoint}/models once (D8)
      description: Not listing any models is not an error; the user adds model IDs by hand.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendCreate"}
      responses:
        "201":
          description: saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
    put:
      tags: [vlm]
      operationId: updateVlmBackend
      summary: Update; an API key left empty stays unchanged
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmBackendUpdate"}
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmBackend"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      tags: [vlm]
      operationId: deleteVlmBackend
      summary: Delete with its models and key (409 backend_in_use while a non-terminal task uses it)
      description: |
        An unfinished task using it answers 409 in_use. When only finished (or deleted) tasks
        use it, the 409 carries `error.details.confirm_required: true`; repeating the call
        with `confirm=true` deletes it and those tasks lose the reference.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: confirm
          in: query
          schema: {type: boolean, default: false}
      responses:
        "204": {description: deleted}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: verifyVlmBackend
      summary: Probe the endpoint (GET /models, else a minimal chat call)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VerifyResult"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/refresh-models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: refreshVlmModels
      summary: List models again; an empty result means "enter them by hand"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: listing result
          content:
            application/json:
              schema:
                type: object
                required: [listed, models]
                properties:
                  listed: {type: boolean, description: "false when GET /models is not available"}
                  models: {type: array, items: {$ref: "#/components/schemas/VlmModel"}}
                  note: {type: string}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      tags: [vlm]
      operationId: addVlmModel
      summary: Add a model ID or inference endpoint ID (ep-...), checked with one minimal call
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VlmModelCreate"}
      responses:
        "201":
          description: added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VlmModel"}
        default: {$ref: "#/components/responses/Error"}
  /vlm-backends/{id}/models/{model_id}:
    parameters:
      - $ref: "#/components/parameters/PathId"
