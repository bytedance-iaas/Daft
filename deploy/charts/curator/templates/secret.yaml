{{- /*
The master key (design doc 08 §2) comes from a Secret the operator creates and backs up
(masterKey.existingSecret). Only when none is named does the chart generate one - for a
trial install. That one is generated once (lookup keeps the stored value, and any keys an
operator added for a rotation, on every upgrade) and is never deleted with the release:
without it no stored secret can be opened again.
*/ -}}
{{- if not .Values.masterKey.existingSecret }}
{{- $name := include "curator.masterKeySecret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "curator.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing $existing.data }}
  {{- toYaml $existing.data | nindent 2 }}
  {{- else }}
  {{ .Values.masterKey.key }}: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
{{- end }}
