{{- include "curator.validate" . -}}
{{- $fullname := include "curator.fullname" . -}}
{{- $scratchPvc := eq .Values.persistence.scratch.type "pvc" -}}
{{- $dataClaim := .Values.persistence.data.existingClaim -}}
# One replica on a ReadWriteOnce block volume: SQLite takes a single writer (D1, D2). A
# StatefulSet stops the old pod before it starts the new one, so an upgrade never has two
# Daemons on the volume; a Deployment would start the new pod first (design doc 09 §2).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "curator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ $fullname }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "curator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "curator.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # the Daemon reads the site config at start-up: a change rolls the pod
        checksum/site-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Service links would inject CURATOR_PORT=tcp://<ip>:<port> for a Service named
      # "curator" - the Daemon's own CURATOR_PORT setting (an integer).
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # SIGTERM: the Daemon stops taking tasks, lets CLI children finish their episode
      # (90 s at most), records the tasks as paused(system) and exits; the new pod resumes
      # them (design doc 09 §2.3, 01 §3.2). The grace period covers preStop + that.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: curator
          image: {{ include "curator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # the image's entry point (tini -> curator-entrypoint) stays; only the program is chosen
          {{- if .Values.maintenance.enabled }}
          args: ["sleep", "infinity"]
          {{- else }}
          args: ["curator-daemon"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            {{- include "curator.env" . | nindent 12 }}
          {{- if not .Values.maintenance.enabled }}
          # Probes use the root paths; both are exempt from authentication (a 401 would take
          # the pod down). The same paths also answer under the mount prefix, for the gateway.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- if gt (int .Values.preStopSleepSeconds) 0 }}
          lifecycle:
            preStop:
              # let the endpoints (Service, ingress, gateway) drop the pod before SIGTERM
              exec:
                command: ["sleep", "{{ int .Values.preStopSleepSeconds }}"]
          {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.data.mountPath }}
            - name: scratch
              mountPath: {{ .Values.persistence.scratch.mountPath }}
            - name: site-config
              mountPath: {{ include "curator.siteConfigDir" . }}
              readOnly: true
            {{- if eq .Values.auth.mode "htpasswd" }}
            - name: auth
              mountPath: {{ include "curator.authDir" . }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: site-config
          configMap:
            name: {{ $fullname }}-site
        {{- if eq .Values.auth.mode "htpasswd" }}
        # the account table, shared with the rerun viewer's nginx; read once at start-up
        - name: auth
          secret:
            secretName: {{ .Values.auth.htpasswdSecret }}
            items:
              - key: {{ .Values.auth.htpasswdKey }}
                path: htpasswd
        {{- end }}
        {{- if not $scratchPvc }}
        - name: scratch
          {{- if .Values.persistence.scratch.size }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.scratch.size }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with $dataClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if or (not $dataClaim) $scratchPvc }}
  # Immutable once created: change the size on the PVC itself (if the storage class allows
  # expansion), never here. Labels are the selector labels only, for the same reason.
  volumeClaimTemplates:
    {{- if not $dataClaim }}
    - metadata:
        name: data
        labels:
          {{- include "curator.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.data.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.data.size | quote }}
    {{- end }}
    {{- if $scratchPvc }}
    - metadata:
        name: scratch
        labels:
          {{- include "curator.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.scratch.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.scratch.size | quote }}
    {{- end }}
  {{- end }}
