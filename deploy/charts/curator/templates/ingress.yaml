{{- if .Values.ingress.enabled }}
{{- $fullname := include "curator.fullname" . }}
{{- $path := include "curator.basePath" . | default "/" }}
{{- $hosts := .Values.ingress.hosts | default (list dict) }}
# Optional. Routes {base} (prefix match) to the Service without rewriting: the Daemon
# registers every route under the prefix (design doc 09 §2.4). SSE responses carry
# X-Accel-Buffering: no, so nginx does not buffer them; the heartbeat (15 s) keeps them open.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "curator.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - http:
        paths:
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  # a number, not the port name: the VKE APIG controller cannot create its upstream from a
                  # named port (MissingParameter.UpstreamSpec.K8SService.Port)
                  number: {{ $.Values.service.port }}
      {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
    {{- end }}
{{- end }}
