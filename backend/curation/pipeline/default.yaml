# 默认流水线配置(L1 配置层,DESIGN.md §11.1)。客户从这份改,不从零配。
# ⚠️ 权重/阈值当前为工程默认,P5.1 校准集扫 ROC 后固化正式值。
pipeline:
  sync_plots: flagged            # 同步曲线证据图:flagged=只画非'过'(默认)/all=全画/off=不画
  evidence_frames: flagged       # 任务成败证据帧:flagged=只存拒绝/待裁决(默认)/all=全存/off=不存
  frame_sample_interval_s: 0.5     # 视觉/同步检查的抽帧间隔
  frame_max_side: 448
  max_endstate_cams: 4             # 任务成败判定一次请求送几路相机(主相机优先,其余按名字序)。
                                   #   2026-07-21 由"主相机+wrist"放开为全部路:DROID ep34 的关键
                                   #   视角 exterior_2 曾被按名字过滤挡掉。
ingest:
  # rerun(.rrd)格式总开关(2026-08-21):release 只对外支持 LeRobot v2/v3,默认关。
  # 关着时 .rrd 目录会被明确拒绝("RRD 质检暂未开放");打开即恢复全部 RRD 能力
  # (六维质检/裁决闭环/审片/rrd_curated 交付,黄金对账与浸泡都验过)。
  rrd_enabled: false
  # rerun(.rrd)输入的采集帧率。RRD 里常常只有 frame_index、没有时间线;文件内能推出
  # 时间(VideoFrameReference 时间戳/录制属性)时以文件为准,推不出才用这里的值。
  # 留空 = 不替客户猜:推不出时间就报错,让他显式给(--set ingest.rrd_fps=30)。
  rrd_fps: null
  # lance 格式总开关(2026-09-21 用户定:**默认开**,多格式是产品要支持的能力;
  # 个别实例要关走站点配置/环境变量)。只支持官方 lerobot-lance-convert ≥0.3.0
  # 的三表布局 frames/videos/meta(info.json 带 storage_format:"lance" 标记;
  # 0.3.0 前旧插件的单表布局官方已废弃,不支持)。--input 指转换产出的根目录即可
  # 质检 —— meta/ 就是标准 LeRobot v3 元数据,型号/任务/fps 全自动。
  # 原格式交付本版本未做,交付以 episodes_parquet + 判决清单为准。
  lance_enabled: true
  # mcap 格式总开关(2026-09-21 用户定:**默认开**,同上)。--input 指一目录 N 个
  # episode_N.mcap 即可质检(topic 约定见 ingest/mcap_reader.DEFAULT_MAPPING;
  # 时间轴取 action topic 的 log_time,不需要 fps 配置),交付落 mcap_curated/。
  mcap_enabled: true
  # topic 指认覆盖(2026-09-21):默认约定认不出、内置 UMI 识别(/robotN/vio/eef_pose
  # 形状零配置命中)也不命中时,在站点配置里显式指认。action 散在多路时用来源列表:
  #   mcap_mapping:
  #     action:
  #       - {topic: /robot0/vio/eef_pose, fields: pose}          # 7 维(xyz+四元数)
  #       - {topic: /robot0/sensor/magnetic_encoder, fields: value}  # 夹爪开度 1 维
  #     video_prefix: /observation.images.
  # 第 0 号来源定时间轴,其余按最近时间对齐后按序横拼。留空 = 默认约定 + 自动识别。
  mcap_mapping: null

checks:
  # 判废与否不在这里:模块只报发现,任务的判决策略定级(设计 17 §4)。这里是各检查的参数。
  timestamp_check:                 # M5a-L0
    enable: true
    params:
      min_duration_s: 1.0          # 短于此=残段(采集中断碎片)硬杀;实证 droid ep000018(0.5s/8帧)
  kinematic_limits:                # M5b 核心
    enable: true
    params: {margin: 0.02}
  motion_quality:                  # M4b(六个分项,只报告)
    enable: true
    params: {}
  visual_quality:
    # 多相机权重:默认每路 1.0;按相机名(全名或短名如 wrist)覆盖,设 0 =该路不进总分
    # 例: camera_weights: {wrist: 0.5}
    camera_weights: {}
    enable: true                   # M4a(抽帧)
    params:
      blur_ref_var: 100.0   # 清晰度参考线(lapvar,绑定 frame_max_side=448 标尺;P5.1 按可用性标注校准)
  video_action_sync:               # M5a-L1(抽帧+光流)
    # 2026-08-07 逐相机改造:**每路相机各测一遍**(与视觉质量共用同一次解码),
    # 判废只发生在"所有可信相机一致指向同一个 Δ≠0"这一种情形;单相机数据集永不
    # 因同步判废;测不准/矛盾/无信号一律 passed + 标注(不进人工裁决队列)。
    enable: true
    params:
      corr_min: 0.3                # 测量层:峰值相关低于此 = 这一路测不准
      lag_tol_s: 0.25              # |lag| 容忍(≈2-3 帧);两层共用
      # ── 以下为判定层(跨相机)可选覆盖,不写则用代码默认 ──
      # spread_tol_s: 0.3          # 各路 lag 极差超过此值 = 证据不一致 → 只标注不判废
      # kill_lag_min_s: 0.5        # 正滞后判废门槛(相机链路延迟有良性解释,门槛抬高)
      # neg_kill_lag_min_s: 0.25   # 负滞后判废门槛(无良性解释,从严)
      # min_kill_cameras: 2        # 判废至少要几路可信相机同证(孤证不定罪)
  task_success:                    # M4c(VLM)
    enable: true
    # 一次请求看全部机位的连续视频判成败，同一次回答带每路相机的意见与画面缺陷（D71）。
    # 相机路数沿用 pipeline.max_endstate_cams，视频预处理见下面 vlm.video。
    params: {}
    vlm:                           # ★ 模型只在这一处配置——换模型=改这里,零代码改动
                                   #   本段供任务成败判定(连同画面缺陷)与 EEF 模块的模型复核
      provider: openai             # openai 兼容端点:自托管 vLLM 与托管 MaaS(方舟)同一套协议
      model: doubao-seed-2-1-pro-260915     # 出厂默认=2.1-pro(2026-09-24 用户定;依据=umi224 实测:
                                            #   glm-5-3-flash-260828 对 166s 双相机视频稳定 500(字节降到
                                            #   7.2MB 依旧,4 次重试全挂,疑似其思考不可关+长视频的实现 bug);
                                            #   2.0-pro 能跑通但输入余量 224k(ep4 单请求已用 119k);
                                            #   2.1-pro 上下文 1024k,四连跑判决完全稳定)。自托管 Cosmos
                                            #   走预设/站点文件切换。
      endpoint: https://ark.cn-beijing.volces.com/api/v3
      video:                      # 任务成败判定的连续视频输入
        fps: 5                    # 本地编码与服务端共用的抽帧率（设计 13）：模型可见帧与全帧编码+服务端抽样一致，只省字节
        max_side: 720              # 裁片分辨率上限，保持宽高比
        max_bytes: 33554432        # 单次请求全部机位视频总字节上限，超出明确报错
      max_concurrency: 64          # 判定请求(probe)的进程级在飞上限(1=串行);任务的执行计划
                                   #   按 VLM 并行度 N 覆盖它(设计 04 §2.2)。
      api_key_env: ARK_API_KEY     # 只写环境变量**名**,密钥本身只存环境变量/K8s Secret,
                                   #   绝不进 YAML 与仓库。切自托管时预设会把它清空(不发鉴权头)。
      timeouts_s:                  # 分类型超时(秒),站点文件可只覆盖想改的几项(深合并)。
                                   #   这也是**对冲补发**的触发线:单次调用到线未回 → 同一并发
                                   #   闸门下补发一次,谁先回用谁;整次调用最坏 2×此值出结果或作废。
                                   #   2026-08-15 droid-200 实测定值:p95 在 60s 内,旧默认 600 让超时
                                   #   调用卡线白等。视频请求按送出的视频长度再放宽(video_vlm)。
        probe: 60                  # 任务成败判定(一次请求)
      # ── 切换后端:--vlm-backend <名>(预设见下方 vlm_backends,一个参数三元组全换)──
      #    仍可 --set checks.task_success.vlm.* 微调(--set 在 backend 之后应用,赢)

# VLM 后端预设:--vlm-backend <名> 一键切换(端点/模型/密钥三元组整组换)。
# ★ 出厂只带通用示例——具体部署(你的 IP/模型/硬件)写在**你自己的站点文件**里,
#   用 --config site.yaml 叠加(只写想改的几行,其余沿用本文件;深合并,副本不腐烂),
#   或环境变量 CURATION_CONFIG 指到该文件(K8s: ConfigMap 挂载 + Deployment 设一次 env)。
#   站点文件示例:
#     vlm_backends:
#       my-gpu-server:                       # 名字自己起
#         endpoint: http://10.0.0.5:8000/v1  # 你的推理服务(OpenAI 兼容)
#         model: Qwen/Qwen2.5-VL-32B-Instruct
#         hardware: NVIDIA A100 80G          # 可选:纯描述,进交付记录供质检报告展示
#         service_type: 自托管 vLLM          # 可选:不写则由端点域名兜底推断
#   也可不用预设,命令行直连:--vlm-endpoint <URL> --vlm-model <名>
#   (或环境变量 CURATION_VLM_ENDPOINT / CURATION_VLM_MODEL)。
#
# ★ hardware / service_type(2026-07-30):**只描述、不参与请求**。质检报告的
#   「性能剖析」页要回答"这批数据是在什么硬件上判的",而预设名(my-gpu-server 之类)
#   是内部代号不进界面 → 硬件信息必须由本配置声明并随交付落盘,UI 侧零硬编码映射。
# ★ TOS 桶(2026-08-17,可选段,写在站点文件):质检台界面的「数据集」下拉从这些
#   目录里扫;「数据集根目录」下拉始终显示(单桶时只有一项且默认选中,随时看得见
#   数据来自哪个桶),显示文本 = tos://桶名/桶内前缀(桶名没声明就如实写
#   「(未声明桶):本地目录」;前缀推导不出就如实标"桶内前缀未知",不编)。
#   命名:键名按声明对象命名(本段声明的是桶及其数据集根,叫 tos_buckets),
#   界面标签按用户所选对象命名(下拉选的是"到哪个根目录列数据集",叫「数据集
#   根目录」)—— 两个名字各说各的对象,别再互相追改。
#   bucket = 该目录所在 TOS 桶名,给 rerun 深链的 tos://桶/前缀/… URL 对表用,
#   对表是**桶 + 桶内前缀两级**:桶对不上任何声明就明说"未接入",前缀对不上
#   就明说"只接入了 X/,链接指向的 Y/ 没有接入",**绝不回落到默认目录里找同名
#   数据集**(两个桶各有一个同名数据集、或同桶 raw/ 与 curated/ 同名时,那会
#   静默跑错数据);前缀推导不出时深链同样不放行(本站配置不全,不许因为
#   "不知道"就当对上了)。不写本段 = 用 --data-root / CURATION_DATA_ROOT 合成
#   单桶,行为与旧版完全一致(桶名视为未知)。
#   ⚠️ 键名 2026-08-17 由 data_sources 改为 tos_buckets,旧键出现会启动报错
#   点名新键名,不静默兼容。
#   站点文件示例:
#     tos_buckets:
#       - bucket: curation                  # 该目录所在的 TOS 桶名(可选;不写=未知)
#         mount_root: /mnt/tos              # 桶根挂在容器哪儿;桶内前缀由
#                                           #   datasets_path 相对它推导(推导优于再写一遍)
#         datasets_path: /mnt/tos/datasets  # 数据集目录(挂载好的绝对路径)→ 前缀 datasets
#         endpoint: https://tos-s3-cn-beijing.ivolces.com  # 可选;只读展示用,不参与请求
#                                           #   (地域含在主机名里,不单存 region 字段)
#         tos_prefix: datasets              # 可选;仅挂载布局推不出前缀时显式覆盖
#         name: 客户A                       # 可选别名;真有信息量才显示(「默认」这类占位不印)
# ★ 数据来源(curation fetch,2026-08-18,可选段):`curation fetch --source <名>`
#   从哪个镜像站拉公开数据集。配置不写本段时用出厂默认 —— 只有一个来源 ai-infra
#   (内网 HF 镜像缓存桶,经 oniond 下载,同区直连),值在 curation/fetch.py 的
#   FACTORY_FETCH_SOURCES(⚠️ 与下方示例保持同值,改一处必改另一处)。
#   base_url = 逐文件 HEAD 量**真实体积**用的对象存储前缀:镜像站 inspect 报的
#   Used Storage 高报可达 1200 倍(2026-08-18 实测),体积只认逐文件 HEAD;
#   端点将来会变、curation/ 要推公开仓,所以它必须写在配置里,不写死在业务逻辑。
#   站点文件示例:
#     fetch_sources:
#       ai-infra:
#         display_name: 内网 HF 镜像缓存桶
#         bucket: ai-infra                  # 镜像所在 TOS 桶(传给下载器的 BUCKET)
#         base_url: https://ai-infra.tos-cn-beijing.volces.com/dataset  # 数据集对象前缀
vlm_backends:
  ark:                             # 方舟 MaaS(豆包)——托管,零运维,任何部署都可用
    endpoint: https://ark.cn-beijing.volces.com/api/v3
    model: doubao-seed-2-1-pro-260915   # 与上方 checks.task_success.vlm.model 的出厂默认同款(选型依据见设计 13 末节)
    api_key_env: ARK_API_KEY
    hardware: 托管服务,硬件不可见(由服务商调度)
    service_type: 方舟 MaaS(托管服务)
  self-hosted-example:             # 自托管示例(占位):复制到你的站点文件改名改值
    endpoint: http://YOUR-VLLM-HOST:8000/v1
    model: YOUR/MODEL-NAME
    api_key_env:                   # 自托管通常无鉴权,留空即不发 Bearer 头
    hardware:                      # 填你的卡型(如 NVIDIA A100 80G);留空 = 界面写"未记录"
    service_type: 自托管 vLLM

# 公共数据集镜像(2026-08-21):一个匿名可读的 TOS 桶,HF 数据集按 <prefix>/<名字>/ 镜像,
# 桶根有 {名字: [对象 key…]} 的清单。配了桶名,界面「数据来源」多出「公共数据集」一项、
# CLI 多出 `curation public`;不配 = 功能整个不出现。桶名/地区是部署常量,写站点配置。
public_datasets:
  bucket: null                    # 镜像桶名(null = 关闭)
  region: null                    # 桶所在地区(如 cn-beijing)
  prefix: dataset                 # 数据集都在这个前缀下
  manifest: dataset_files.json    # 桶根清单的对象名
  label: HuggingFace 缓存桶          # 界面「数据集目录」旁二选一里这个来源的叫法
