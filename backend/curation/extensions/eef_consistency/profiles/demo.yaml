# DEMO threshold profile (design 12 §12, appendix C.3). calibrated: false - every status it yields is
# advisory and reported as uncalibrated. Numbers come from the noise floor of the two baselines only
# (galbot dataset1 ep0, dataset2 ep0, both cameras) measured with the synthetic_fixture P-A tracker on
# 2026-09-23, times a factor fixed before looking at the faulty episodes (x3 for medians, x1.5-2.5 for
# peaks). Never tuned on fault labels. Baseline worst values are in the comments.
name: demo
version: "0.2"
calibrated: false
source: >-
  baseline noise floor (dataset1 ep0, dataset2 ep0) of the synthetic_fixture P-A tracker and the recorded
  state, 2026-09-23; factors fixed a priori; not calibrated on independent annotations
coverage:
  min_valid_fraction: 0.3            # valid comparisons / requested frames, per camera and point
  min_valid_frames: 30
position:                            # raw residual |u_declared - u_visual|, media px
  median_px: 3.0                     # baseline worst median 1.05 px (x3)
  rolling_median_frames: 5
  on_px: 10.0                        # baseline worst 5-frame rolling median 6.2 px (x1.6)
  off_px: 7.0
  min_duration_s: 1.0
  max_gap_s: 0.4
  local_hf_px: 2.5                   # residual RMS above 2 Hz; baseline worst 0.81 px (x3)
orientation:                         # angle between declared and observed 2D direction
  min_axis_len_px: 25.0              # shorter projected axes are not_observable
  min_valid_frames: 15
  median_deg: 5.0                    # baseline worst median 0.5 deg (x3, floored at 5 deg)
  rolling_median_frames: 5
  on_deg: 8.0                        # baseline worst P95 3.1 deg (x2.5)
  off_deg: 5.0
  min_duration_s: 1.0
  max_gap_s: 0.4
temporal:
  min_lag_frames: 2.0                # baseline worst |lag| 0.07 frame
  min_improvement: 1.5               # residual(0) / residual(lag); baseline 1.00
  min_drop_px: 2.0
  min_motion_px_s: 20.0              # below this the lag is not identifiable
state_motion:                        # rolling RMS (1 s) of the > 2 Hz recorded position
  hf_on_mm: 2.5                      # baseline worst 1.09 mm (x2.3)
  hf_off_mm: 1.8
  min_duration_s: 1.0
  max_gap_s: 0.4
  spikes_suspect: 2
camera_motion:                       # rolling RMS (1 s) of the > 1 Hz background trajectory
  hf_on_px: 2.0                      # baseline worst 0.67 px (x3)
  hf_off_px: 1.4
  min_duration_s: 1.0
  max_gap_s: 0.4
  min_support_fraction: 0.5          # frames with a background fit / requested
diagnosis:                           # PnP, constant body rotation and axial-offset fits
  fit_min_improvement: 0.6           # the median residual must drop by 60 % ...
  fit_max_residual_px: 2.5           # ... to below 2.5 px: a median, so against the baseline worst median
                                     # residual 1.05 px (x2.4); the 0.1 draft compared it with the P95 floor
  pnp_max_translation_mm: 100.0      # design 12 §8.6: a wrong extrinsic is a small correction (cm / deg)
  pnp_max_rotation_deg: 10.0
  lag_min_improvement: 1.5
  orientation_max_iqr_deg: 8.0
  drift_max_hf_share: 0.3
record:                              # design 12 §8.7 (D-E16): the upload against the dataset's own record, 3D
  min_frames: 30                     # paired frames, and at least this share of the upload's posed frames
  min_fraction: 0.3
  rolling_median_frames: 5
  pos_on_mm: 5.0                     # dataset2 ep0 (DROID): Panda kinematics vs the pose column 0.0 mm, 0.00 deg;
  pos_off_mm: 3.0                    # real encoders and kinematic models are worse - a few mm, a fraction of a deg -
  rot_on_deg: 2.0                    # so the demo numbers leave room above them; not calibrated on real data
  rot_off_deg: 1.5
  min_duration_s: 0.5
  max_gap_s: 0.4
  constant_mm: 5.0                   # fitted constant vs the declared relation
  constant_deg: 2.0
  lag_min_frames: 1.0                # a time offset worth naming: at least a frame, residual 1.5x better
  lag_min_improvement: 1.5
ego_motion:                          # design doc 22 §5.3 (F5.19): a wrist camera's motion in its pictures vs its poses,
                                     # pairs 0.5 s apart (module parameter); not calibrated. DAS recording 00001 with the
                                     # right convention: rotation difference median 0.56 / 0.54 deg, P95 1.6 / 2.0 deg,
                                     # never 5 deg over half a second; body->optical forgotten: share of the turn 1.06-1.13
                                     # (1.45 on pairs turning 5 deg or more); pose stream 0.5 s late: offset found +0.47 s
  rotation_on_deg: 5.0               # a stretch (rolling median of 3 pairs) at least this far apart ...
  rotation_off_deg: 3.0
  relative_min: 0.5                  # ... and at least half the poses' own turn (floored at 2 deg) is bad
  min_duration_s: 0.5                # pair starts; shorter stretches are noise
  bands_deg: [5.0, 10.0, 20.0]       # minor / moderate / severe by the stretch's median difference ...
  relative_bands: [0.75, 1.0]        # ... at least moderate / severe by its median share of the turn
  lag_min_s: 0.15                    # a time offset worth naming (the right recordings: -0.03 s) ...
  lag_confidence_min: 0.3            # ... found clearly (1 - best median / median over the offsets searched)
  lag_bands_s: [0.15, 0.3, 0.5]
  min_inliers: 100                   # fewer inliers: the pair says nothing (white walls, blur)
  coverage_min: 0.5                  # under half the pairs measured: unknown, nothing judged
merge:                               # design doc 25 §7.1-§7.2 (D82): an inconsistency confidence p per sub-item and camera;
                                     # p orders, it is not a probability - not calibrated (requester 2026-10-09)
  high: 0.7                          # p >= high: "inconsistent"; one side here and the other below `low` is a conflict
  low: 0.4                           # [low, high): "possibly inconsistent"; below: "consistent"
  single_source_cap: 0.8             # one channel alone never says more than this
  full_at: 3.0                       # a CPU reading this many times its open threshold is full strength
