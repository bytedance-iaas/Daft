# SO-100(lerobot 官方开源臂,svla_so100_* 用)。STS3215 舵机(12位磁编码,4096步/360°)。
# 单位=归一化度数:lerobot 标定把各关节行程映射到 ±100(夹爪 0-100),与 so101 同族同约定。
# ⚠️ 官方 URDF(TheRobotStudio/SO-ARM100 → Simulation/SO100/so100.urdf)是**物理角度、home 位姿
#    参考、非对称**(shoulder_lift 0~3.5rad、elbow_flex -3.14~0rad)——与本表归一化约定
#    **不可通约**,照抄会制造大批假阳性。2026-07-19 已核实,勿再用 URDF 值覆盖本表。
#    (URDF 里 velocity=1rad/s、effort=35 六关节完全相同,系占位符,不可用;
#     速度依据取 STS3215 手册:空载 0.222s/60° @12V ≈ 270°/s。)
#
# 约定核对(2026-07-19 转正,方法同 so101):lerobot/svla_so100_pickplace
#   50 条 / 19631 帧,action + observation.state 双侧实测:
#     pan[-37.2,72.8] lift[-89.5,41.9] elbow[-49.0,75.1]
#     wrist_f[9.7,96.6] wrist_r[56.3,123.6] grip[-0.21,34.9]
#   全部落在本表限位内;最紧处 grip 下限 -0.21(检查器 2% 裕度=2.0,不会错杀)、
#   wrist_f 距上限 3.4。⇒ 归一化 ±100 约定确认,升 approximate,可硬判。
#   ⚠️ 同时修正:gripper 速度限位 200 → 300。实测夹爪峰值 207.7 单位/s,旧值 200
#      加 2% 容差(204)仍会被判超限=假阳性;夹爪快速开合本属正常。改为与其余关节
#      及 so101 一致的 300(实测最高峰 221.5,有裕度)。
# 历史:2026-07-07 曾因"全量违规"降 draft(疑舵机原始角约定错位)。该顾虑现由检查器护栏
#   兜底——某关节 ≥90% 帧持续限外即判为约定错位并整体弃权,不会重演全灭事故。
# 仍为 approximate 而非 authoritative:仅 1 个数据集核对(so101 用了 4 数据集 185 条)。
embodiment_id: so100
aliases: [so100_follower]
dof: 6
action_space: joint_position
unit: deg_normalized           # 归一化度数:±100=标定行程端点(非物理角度)
joint_limits:
  - [-110.0, 110.0]   # shoulder_pan
  - [-100.0, 100.0]   # shoulder_lift
  - [-100.0, 100.0]   # elbow_flex
  - [-100.0, 100.0]   # wrist_flex
  - [-160.0, 160.0]   # wrist_roll
  - [0.0, 100.0]      # gripper(开合度)
velocity_limits: [300.0, 300.0, 300.0, 300.0, 300.0, 300.0]  # 归一化单位/s,近似(实测峰221.5)
gripper_range: [0.0, 100.0]
control_freq_hz: 30
urdf_path: null
source: "lerobot so100 归一化标定约定(±100=标定行程端点)+ svla_so100_pickplace 50条/19631帧实测核对(2026-07-19);舵机参数见 Feetech STS3215 手册"
quality: approximate   # 2026-07-19 转正:角度=标定约定(归一化定义),速度=实测上包络近似;可硬判
gripper_dims: [5]   # 夹爪列下标(本数据布局约定)
