[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "curation"
version = "1.0.0"
description = "Curator v2:机器人操作数据质检(命令行 curation 与 API Daemon)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["curation*", "daemon*"]

[project.scripts]
curation = "curation.cli:main"
curator-daemon = "daemon.__main__:main"
curator-rotate-master-key = "daemon.secrets.rotate:main"
